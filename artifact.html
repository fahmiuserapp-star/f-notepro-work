<script>// Playables SDK v1.0.0
// Game lifecycle bridge: rAF-based game-ready detection + event communication
(function() {
  'use strict';

  // Idempotency: skip if already initialized (e.g., server-side injection
  // followed by client-side inject-javascript via the Bloks webview component).
  if (window.playablesSDK) return;

  var HANDLER_NAME = 'playablesGameEventHandler';
  var ANDROID_BRIDGE_NAME = '_MetaPlayablesBridge';
  var RAF_FRAME_THRESHOLD = 3;

  var gameReadySent = false;
  var firstInteractionSent = false;
  var errorSent = false;
  var frameCount = 0;
  var originalRAF = window.requestAnimationFrame;

  // --- Transport Layer ---

  function hasIOSBridge() {
    return !!(window.webkit &&
              window.webkit.messageHandlers &&
              window.webkit.messageHandlers[HANDLER_NAME]);
  }

  function hasAndroidBridge() {
    return !!(window[ANDROID_BRIDGE_NAME] &&
              typeof window[ANDROID_BRIDGE_NAME].postEvent === 'function');
  }

  function isInIframe() {
    return !!(window.parent && window.parent !== window);
  }

  function sendEvent(eventName, payload) {
    var message = {
      type: eventName,
      payload: payload || {},
      timestamp: Date.now()
    };

    if (hasIOSBridge()) {
      try {
        window.webkit.messageHandlers[HANDLER_NAME].postMessage(message);
      } catch (e) { /* ignore */ }
      return;
    }

    if (hasAndroidBridge()) {
    try {
      var p = payload || {};
      p.__secureToken = window.__fbAndroidBridgeAuthToken || '';
      p.timestamp = message.timestamp;
      window[ANDROID_BRIDGE_NAME].postEvent(
        eventName,
        JSON.stringify(p)
      );
    } catch (e) { /* ignore */ }
    return;
  }

    if (isInIframe()) {
      try {
        window.parent.postMessage(message, '*');
      } catch (e) { /* ignore */ }
      return;
    }
  }

  // --- rAF Game-Ready Detection ---

  function onFrame() {
    if (gameReadySent) return;

    frameCount++;
    if (frameCount >= RAF_FRAME_THRESHOLD) {
      gameReadySent = true;
      sendEvent('game_ready', {
        frame_count: frameCount,
        detected_at: Date.now()
      });
      return;
    }

    originalRAF.call(window, onFrame);
  }

  if (originalRAF) {
    window.requestAnimationFrame = function(callback) {
      if (!gameReadySent) {
        return originalRAF.call(window, function(timestamp) {
          frameCount++;
          if (frameCount >= RAF_FRAME_THRESHOLD && !gameReadySent) {
            gameReadySent = true;
            sendEvent('game_ready', {
              frame_count: frameCount,
              detected_at: Date.now()
            });
          }
          callback(timestamp);
        });
      }
      return originalRAF.call(window, callback);
    };
  }

  // --- First User Interaction Detection ---

  function setupFirstInteractionDetection() {
    var events = ['touchstart', 'mousedown', 'keydown'];

    function onFirstInteraction() {
      if (firstInteractionSent) return;
      firstInteractionSent = true;
      sendEvent('user_interaction_start', null);

      for (var i = 0; i < events.length; i++) {
        document.removeEventListener(events[i], onFirstInteraction, true);
      }
    }

    for (var i = 0; i < events.length; i++) {
      document.addEventListener(events[i], onFirstInteraction, true);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupFirstInteractionDetection);
  } else {
    setupFirstInteractionDetection();
  }

  // --- Auto Error Capture ---

  window.addEventListener('error', function(event) {
    if (errorSent) return;
    errorSent = true;
    sendEvent('error', {
      message: event.message || 'Unknown error',
      source: event.filename || '',
      lineno: event.lineno || 0,
      colno: event.colno || 0,
      auto_captured: true
    });
  });

  window.addEventListener('unhandledrejection', function(event) {
    if (errorSent) return;
    errorSent = true;
    var reason = event.reason;
    sendEvent('error', {
      message: (reason instanceof Error) ? reason.message : String(reason),
      type: 'unhandled_promise_rejection',
      auto_captured: true
    });
  });

  // --- Public API ---

  window.playablesSDK = {
    complete: function(score) {
      sendEvent('game_ended', {
        score: score,
        completed: true
      });
    },

    error: function(message) {
      if (errorSent) return;
      errorSent = true;
      sendEvent('error', {
        message: message || 'Unknown error',
        auto_captured: false
      });
    },

    sendEvent: function(eventName, payload) {
      if (!eventName || typeof eventName !== 'string') return;
      sendEvent(eventName, payload);
    }
  };

  // Kick off rAF detection in case no game code calls rAF immediately
  if (originalRAF) {
    originalRAF.call(window, onFrame);
  }
})();</script>

  <style>
    :root {

      --bg: #F7F7F2;
      --card: #FFFFFF;
      --text: #1F2937;
      --muted: #6B7280;
      --border: #E5E7EB;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
    }
    [data-theme="dark"] {
      --olive: #6F7F45;
      --olive-600: #5A6A36;
      --olive-100: #2A2F1E;
      --gold: #D4B14A;
      --gold-600: #C9A227;
      --bg: #121410;
      --card: #1A1D16;
      --text: #E5E7EB;
      --muted: #9CA3AF;
      --border: #2D3325;
      --shadow: 0 10px 25px -5px rgba(0,0,0,0.4), 0 8px 10px -6px rgba(0,0,0,0.4);
    }
    
    * {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'Noto Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    body {
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    
    /* Force Western Arabic numerals 0-9 */
    html, body, input, textarea, select {
      font-variant-numeric: lining-nums tabular-nums;
      font-feature-settings: "lnum" 1, "tnum" 1;
    }
    
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      box-shadow: var(--shadow);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--olive) 0%, var(--olive-600) 100%);
      color: white;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px 0 rgba(74, 93, 35, 0.3);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px 0 rgba(74, 93, 35, 0.4);
    }
    .btn-primary:active {
      transform: translateY(0);
    }
    
    .btn-gold {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-600) 100%);
      color: #1F2937;
      transition: all 0.2s ease;
      box-shadow: 0 4px 14px 0 rgba(201, 162, 39, 0.3);
    }
    .btn-gold:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px 0 rgba(201, 162, 39, 0.4);
    }
    
    .input-field {
      background: var(--bg);
      border: 2px solid var(--border);
      color: var(--text);
      transition: all 0.2s ease;
      outline: none;
    }
    .input-field:focus {
      border-color: var(--olive);
      box-shadow: 0 0 0 3px rgba(74, 93, 35, 0.1);
    }
    
    .plate-input {
      width: 5.5rem;
      text-align: center;
      font-weight: 700;
      font-size: 1.125rem;
      letter-spacing: 0.1em;
    }
    
    .badge-olive {
      background: var(--olive-100);
      color: var(--olive-600);
      border: 1px solid var(--olive);
    }
    
    [data-theme="dark"] .badge-olive {
      background: var(--olive-100);
      color: var(--gold);
      border: 1px solid var(--olive);
    }
    
    .strip-card {
      background: linear-gradient(135deg, var(--card) 0%, var(--olive-100) 100%);
      cursor: pointer;
      overflow: hidden;
      position: relative;
    }
    .strip-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(201, 162, 39, 0.05), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }
    .strip-card:hover::before {
      transform: translateX(100%);
    }
    
    .thumbnail {
      width: 48px;
      height: 48px;
      border-radius: 0.5rem;
      object-fit: cover;
      border: 2px solid var(--gold);
    }
    
    .modal-backdrop {
      backdrop-filter: blur(8px);
      background: rgba(0, 0, 0, 0.5);
    }
    
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .animate-slide-in {
      animation: slideIn 0.3s ease-out;
    }
    
    .settings-menu {
      transform-origin: top left;
      animation: scaleIn 0.2s ease-out;
    }
    
    [dir="ltr"] .settings-menu {
      transform-origin: top right;
    }
    
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>

      en: {
        appTitle: 'F-NOTEPRO-WORK',
        appSubtitle: 'Security Note Application',
        settings: 'Settings',
        language: 'Language',
        theme: 'Theme',
        toggleTheme: 'Light Mode',
        toggleThemeDark: 'Dark Mode',
        currentTime: 'Current Time',
        newNote: 'New Security Note',
        busInfo: 'Bus Information',
        licensePlate: 'License Plate',
        foreignPlate: 'Foreign Plate Number',
        busImage: 'Bus Image',
        chooseImage: 'Choose image...',
        busNotes: 'Bus Notes',
        busNotesPlaceholder: 'Additional notes about the bus...',
        guideInfo: 'Guide Information',
        guideName: 'Guide Name',
        guideNamePlaceholder: 'Full name',
        guidePhone: 'Guide Phone',
        guideImage: 'Guide Image',
        guideNotes: 'Guide Notes',
        guideNotesPlaceholder: 'Additional notes about the guide...',
        generalNotes: 'General Notes',
        generalNotesPlaceholder: 'General security notes...',
        save: 'Save',
        reset: 'Reset',
        savedNotes: 'Saved Notes',
        noNotes: 'No notes saved yet',
        noNotesDesc: 'Start by creating your first security note above',
        viewDetails: 'View Details',
        delete: 'Delete',
        bus: 'Bus',
        guide: 'Guide',
        savedAt: 'Saved at'
      }
    };

    // DOM Elements
    const elements = {
      settingsBtn: document.getElementById('settingsBtn'),
      settingsMenu: document.getElementById('settingsMenu'),
      themeToggle: document.getElementById('themeToggle'),
      themeIcon: document.getElementById('themeIcon'),
      themeText: document.getElementById('themeText'),
      dateTime: document.getElementById('dateTime'),
      plateToggle: document.getElementById('plateToggle'),
      plateTunisian: document.getElementById('plateTunisian'),
      plateForeign: document.getElementById('plateForeign'),
      platePart1: document.getElementById('platePart1'),
      platePart2: document.getElementById('platePart2'),
      plateForeignInput: document.getElementById('plateForeignInput'),
      guideName: document.getElementById('guideName'),
      guidePhone: document.getElementById('guidePhone'),
      busImage: document.getElementById('busImage'),
      guideImage: document.getElementById('guideImage'),
      busPreview: document.getElementById('busPreview'),
      guidePreview: document.getElementById('guidePreview'),
      saveBtn: document.getElementById('saveBtn'),
      resetBtn: document.getElementById('resetBtn'),
      notesList: document.getElementById('notesList'),
      emptyState: document.getElementById('emptyState'),
      notesCount: document.getElementById('notesCount')
    };

    // Initialize
    function init() {
      updateDateTime();
      setInterval(updateDateTime, 1000);
      setupEventListeners();
      loadNotes();
      applyLanguage('ar');
      loadTheme();
    }

    // Date Time - Force Western numerals
    function updateDateTime() {
      const now = new Date();
      const formatted = now.toLocaleString('en-GB', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
      });
      elements.dateTime.textContent = formatted;
    }

    // Event Listeners
    function setupEventListeners() {
      // Settings menu toggle
      elements.settingsBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        elements.settingsMenu.classList.toggle('hidden');
      });
      
      document.addEventListener('click', () => {
        elements.settingsMenu.classList.add('hidden');
      });
      
      elements.settingsMenu.addEventListener('click', (e) => e.stopPropagation());

      // Language switch
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const lang = btn.dataset.lang;
          applyLanguage(lang);
          elements.settingsMenu.classList.add('hidden');
        });
      });

      // Theme toggle
      elements.themeToggle.addEventListener('click', toggleTheme);

      // Plate toggle
      elements.plateToggle.addEventListener('click', togglePlateType);

      // Numeric input validation - only allow 0-9
      [elements.platePart1, elements.platePart2].forEach(input => {
        input.addEventListener('input', (e) => {
          e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
      });

      // Phone input - force numeric
      elements.guidePhone.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/[^0-9+\s-]/g, '');
      });

      // Image uploads
      elements.busImage.addEventListener('change', (e) => handleImageUpload(e, 'bus'));
      elements.guideImage.addEventListener('change', (e) => handleImageUpload(e, 'guide'));

      // Buttons
      elements.saveBtn.addEventListener('click', saveNote);
      elements.resetBtn.addEventListener('click', resetForm);
    }

    // Language
    function applyLanguage(lang) {
      currentLang = lang;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      
      // Update all translatable elements
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (i18n[lang][key]) el.textContent = i18n[lang][key];
      });
      
      // Update placeholders
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        const key = el.dataset.i18nPlaceholder;
        if (i18n[lang][key]) el.placeholder = i18n[lang][key];
      });
      
      // Update active lang button
      document.querySelectorAll('.lang-btn').forEach(btn => {
        if (btn.dataset.lang === lang) {
          btn.style.borderColor = 'var(--olive)';
          btn.style.background = 'var(--olive-100)';
        } else {
          btn.style.borderColor = 'var(--border)';
          btn.style.background = 'transparent';
        }
      });
      
      updateThemeText();
    }

    // Theme
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.dataset.theme;
      const next = current === 'light' ? 'dark' : 'light';
      html.dataset.theme = next;
      localStorage.setItem('theme', next);
      updateThemeText();
    }

    function loadTheme() {
      const saved = localStorage.getItem('theme') || 'light';
      document.documentElement.dataset.theme = saved;
      updateThemeText();
    }

    function updateThemeText() {
      const isDark = document.documentElement.dataset.theme === 'dark';
      if (isDark) {
        elements.themeIcon.className = 'fas fa-moon';
        elements.themeText.textContent = i18n[currentLang].toggleThemeDark;
      } else {
        elements.themeIcon.className = 'fas fa-sun';
        elements.themeText.textContent = i18n[currentLang].toggleTheme;
      }
    }

    // Plate Type Toggle
    function togglePlateType() {
      isForeignPlate = !isForeignPlate;
      if (isForeignPlate) {
        elements.plateTunisian.classList.add('hidden');
        elements.plateForeign.classList.remove('hidden');
        elements.plateToggle.innerHTML = '<i class="fas fa-minus"></i>';
        elements.plateToggle.title = 'Switch to Tunisian plate';
      } else {
        elements.plateTunisian.classList.remove('hidden');
        elements.plateForeign.classList.add('hidden');
        elements.plateToggle.innerHTML = '<i class="fas fa-plus"></i>';
        elements.plateToggle.title = 'Switch to foreign plate';
      }
    }

    // Image Upload
    function handleImageUpload(e, type) {
      const file = e.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = (event) => {
        if (type === 'bus') {
          busImageData = event.target.result;
          elements.busPreview.src = busImageData;
          elements.busPreview.classList.remove('hidden');
          document.getElementById('busImageName').textContent = file.name;
        } else {
          guideImageData = event.target.result;
          elements.guidePreview.src = guideImageData;
          elements.guidePreview.classList.remove('hidden');
          document.getElementById('guideImageName').textContent = file.name;
        }
      };
      reader.readAsDataURL(file);
    }

    // Save Note
    function saveNote() {
      const plateNumber = isForeignPlate 
        ? elements.plateForeignInput.value.trim()
        : `${elements.platePart1.value} تونس ${elements.platePart2.value}`;
      
      if (!plateNumber || (!isForeignPlate && (!elements.platePart1.value || !elements.platePart2.value))) {
        alert('Please enter license plate number');
        return;
      }
      
      if (!elements.guideName.value.trim()) {
        alert('Please enter guide name');
        return;
      }

      const note = {
        id: Date.now(),
        timestamp: new Date().toISOString(),
        plate: plateNumber,
        isForeignPlate,
        busImage: busImageData,
        busNotes: document.getElementById('busNotes').value.trim(),
        guideName: elements.guideName.value.trim(),
        guidePhone: elements.guidePhone.value.trim(),
        guideImage: guideImageData,
        guideNotes: document.getElementById('guideNotes').value.trim(),
        generalNotes: document.getElementById('generalNotes').value.trim(),
        expanded: false
      };
      
      notes.unshift(note);
      renderNotes();
      resetForm();
      
      // Scroll to notes
      elements.notesList.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // Reset Form
    function resetForm() {
      elements.platePart1.value = '';
      elements.platePart2.value = '';
      elements.plateForeignInput.value = '';
      elements.guideName.value = '';
      elements.guidePhone.value = '';
      document.getElementById('busNotes').value = '';
      document.getElementById('guideNotes').value = '';
      document.getElementById('generalNotes').value = '';
      elements.busImage.value = '';
      elements.guideImage.value = '';
      busImageData = null;
      guideImageData = null;
      elements.busPreview.classList.add('hidden');
      elements.guidePreview.classList.add('hidden');
      document.getElementById('busImageName').textContent = i18n[currentLang].chooseImage;
      document.getElementById('guideImageName').textContent = i18n[currentLang].chooseImage;
    }

    // Render Notes
    function renderNotes() {
      elements.notesCount.textContent = notes.length;
      
      if (notes.length === 0) {
        elements.emptyState.classList.remove('hidden');
        elements.notesList.innerHTML = '';
        return;
      }
      
      elements.emptyState.classList.add('hidden');
      elements.notesList.innerHTML = notes.map(note => createNoteHTML(note)).join('');
      
      // Attach event listeners
      notes.forEach(note => {
        const stripEl = document.getElementById(`strip-${note.id}`);
        const deleteBtn = document.getElementById(`delete-${note.id}`);
        
        if (stripEl) {
          stripEl.addEventListener('click', () => toggleExpand(note.id));
        }
        if (deleteBtn) {
          deleteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            deleteNote(note.id);
          });
        }
      });
    }

    function createNoteHTML(note) {
      const time = new Date(note.timestamp).toLocaleString('en-GB', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
      
      if (!note.expanded) {
        // Compact Strip View
        return `
          <div id="strip-${note.id}" class="strip-card card p-4 animate-slide-in">
            <div class="flex items-center gap-3">
              ${note.busImage ? `<img src="${note.busImage}" class="thumbnail" alt="Bus" />` : `<div class="thumbnail bg-gradient-to-br from-olive-100 to-gold flex items-center justify-center"><i class="fas fa-bus text-xl" style="color: var(--olive)"></i></div>`}
              ${note.guideImage ? `<img src="${note.guideImage}" class="thumbnail" alt="Guide" />` : `<div class="thumbnail bg-gradient-to-br from-gold to-olive-100 flex items-center justify-center"><i class="fas fa-user text-xl" style="color: var(--olive)"></i></div>`}
              
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                  <i class="fas fa-id-card" style="color: var(--gold)"></i>
                  <span class="font-bold text-sm" dir="ltr">${note.plate}</span>
                </div>
                <div class="flex items-center gap-4 text-sm">
                  <span class="flex items-center gap-1">
                    <i class="fas fa-user text-xs" style="color: var(--muted)"></i>
                    <span class="truncate">${note.guideName}</span>
                  </span>
                  ${note.guidePhone ? `<span class="flex items-center gap-1" dir="ltr"><i class="fas fa-phone text-xs" style="color: var(--muted)"></i><span>${note.guidePhone}</span></span>` : ''}
                </div>
              </div>
              
              <div class="flex items-center gap-2">
                <span class="text-xs px-2 py-1 rounded badge-olive">${time}</span>
                <button id="delete-${note.id}" class="p-2 rounded-lg hover:bg-red-100 transition-colors" style="color: #DC2626">
                  <i class="fas fa-trash"></i>
                </button>
                <i class="fas fa-chevron-down text-sm" style="color: var(--muted)"></i>
              </div>
            </div>
          </div>
        `;
      } else {
        // Expanded View
        return `
          <div id="strip-${note.id}" class="card p-6 animate-slide-in">
            <div class="flex items-start justify-between mb-4">
              <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg btn-primary flex items-center justify-center">
                  <i class="fas fa-file-lines"></i>
                </div>
                <div>
                  <h3 class="font-bold text-lg">${i18n[currentLang].savedAt}</h3>
                  <p class="text-sm" style="color: var(--muted)" dir="ltr">${time}</p>
                </div>
              </div>
              <button id="delete-${note.id}" class="px-4 py-2 rounded-lg text-sm font-medium transition-all hover:scale-105" style="background: #FEE2E2; color: #DC2626">
                <i class="fas fa-trash me-2"></i>${i18n[currentLang].delete}
              </button>
            </div>
            
            <div class="grid md:grid-cols-2 gap-6">
              <div>
                <h4 class="font-semibold mb-3 flex items-center gap-2">
                  <i class="fas fa-bus" style="color: var(--olive)"></i>
                  ${i18n[currentLang].bus}
                </h4>
                <div class="space-y-3">
                  <div class="flex items-center gap-3">
                    <span class="text-sm" style="color: var(--muted)">${i18n[currentLang].licensePlate}:</span>
                    <span class="font-bold" dir="ltr">${note.plate}</span>
                  </div>
                  ${note.busImage ? `<img src="${note.busImage}" class="w-full h-48 object-cover rounded-lg border-2" style="border-color: var(--gold)" alt="Bus" />` : ''}
                  ${note.busNotes ? `<p class="text-sm p-3 rounded-lg" style="background: var(--bg)">${note.busNotes}</p>` : ''}
                </div>
              </div>
              
              <div>
                <h4 class="font-semibold mb-3 flex items-center gap-2">
                  <i class="fas fa-user-tie" style="color: var(--gold)"></i>
                  ${i18n[currentLang].guide}
                </h4>
                <div class="space-y-3">
                  <div class="flex items-center gap-3">
                    <span class="text-sm" style="color: var(--muted)">${i18n[currentLang].guideName}:</span>
                    <span class="font-semibold">${note.guideName}</span>
                  </div>
                  ${note.guidePhone ? `<div class="flex items-center gap-3"><span class="text-sm" style="color: var(--muted)">${i18n[currentLang].guidePhone}:</span><span dir="ltr">${note.guidePhone}</span></div>` : ''}
                  ${note.guideImage ? `<img src="${note.guideImage}" class="w-full h-48 object-cover rounded-lg border-2" style="border-color: var(--gold)" alt="Guide" />` : ''}
                  ${note.guideNotes ? `<p class="text-sm p-3 rounded-lg" style="background: var(--bg)">${note.guideNotes}</p>` : ''}
                </div>
              </div>
            </div>
            
            ${note.generalNotes ? `
              <div class="mt-6 pt-6 border-t" style="border-color: var(--border)">
                <h4 class="font-semibold mb-2 flex items-center gap-2">
                  <i class="fas fa-note-sticky" style="color: var(--olive)"></i>
                  ${i18n[currentLang].generalNotes}
                </h4>
                <p class="text-sm p-4 rounded-lg" style="background: var(--bg)">${note.generalNotes}</p>
              </div>
            ` : ''}
            
            <div class="mt-6 text-center">
              <button onclick="toggleExpand(${note.id})" class="text-sm px-4 py-2 rounded-lg transition-all hover:scale-105" style="color: var(--olive)">
                <i class="fas fa-chevron-up me-2"></i>Collapse
              </button>
            </div>
          </div>
        `;
      }
    }

    function toggleExpand(id) {
      const note = notes.find(n => n.id === id);
      if (note) {
        note.expanded = !note.expanded;
        renderNotes();
      }
    }

    function deleteNote(id) {
      if (confirm('Are you sure you want to delete this note?')) {
        notes = notes.filter(n => n.id !== id);
        renderNotes();
      }
    }

    function loadNotes() {
      renderNotes();
    }

    // Global function for inline onclick
    window.toggleExpand = toggleExpand;

    // Start App
    init();
  </script>
</body>
</html>
