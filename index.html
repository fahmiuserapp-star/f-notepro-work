<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="theme-color" content="#e94560">
    <title>F-Note Pro | خزنة المرشدين + لاسلكي ذكي تونسي</title>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-messaging-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #1a1a2e;
            --sub: #545f71;
            --muted: #8b95a5;
            --border: #e2e8f0;
            --gold: #e94560;
            --gold-light: #ff6b81;
            --success: #10b981;
            --danger: #ef4444;
            --walkie: #25D366;
            --walkie-dark: #128C7E;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.12);
            --radius: 20px;
            --radius-sm: 14px;
            --radius-full: 60px;
            --font: 'Segoe UI', 'Tajawal', system-ui, sans-serif;
            --transition: 0.2s;
            --nav-h: 68px;
        }
        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --sub: #cbd5e1;
            --muted: #94a3b8;
            --border: #334155;
            --shadow: 0 2px 12px rgba(0,0,0,0.25);
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.4);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg);
            font-family: var(--font);
            color: var(--text);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
            transition: background var(--transition);
            padding-bottom: var(--nav-h);
        }

        /* 【NEW CHAT SYSTEM - DÉMARRAGE】 */
        #pageChat {
            display: none;
            height: calc(100vh - var(--nav-h));
            flex-direction: column;
        }
        #pageChat.active {
            display: flex;
        }

        .smart-chat {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: linear-gradient(180deg, var(--bg) 0%, #f8fafc 100%);
        }
        body.dark .smart-chat {
            background: linear-gradient(180deg, #0f172a 0%, #1a1f35 100%);
        }

        .chat-topbar {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .chat-topbar .title {
            font-weight: 800;
            font-size: 17px;
            color: var(--gold);
            flex: 1;
        }
        .chat-topbar .online-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .contacts-strip {
            display: flex;
            overflow-x: auto;
            gap: 10px;
            padding: 10px 14px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            align-items: center;
        }
        .contact-circle {
            flex-shrink: 0;
            text-align: center;
            cursor: pointer;
            padding: 6px;
            border-radius: 16px;
            min-width: 64px;
            border: 2px solid transparent;
            transition: 0.2s;
            background: var(--bg);
        }
        .contact-circle.selected {
            border-color: var(--gold);
            background: #fef2f2;
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(233,69,96,0.25);
        }
        body.dark .contact-circle.selected {
            background: #2d1b2a;
        }
        .contact-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            margin: 0 auto 3px;
            border: 2px solid #94a3b8;
        }
        .contact-circle.online .contact-avatar {
            border-color: #10b981;
            box-shadow: 0 0 12px rgba(16,185,129,0.4);
        }
        .contact-name {
            font-size: 10px;
            font-weight: 600;
            color: var(--text);
            max-width: 68px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .messages-panel {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg-row {
            display: flex;
            gap: 8px;
            max-width: 85%;
            animation: msgPop 0.25s ease;
        }
        .msg-row.me { align-self: flex-end; }
        .msg-row.other { align-self: flex-start; }
        @keyframes msgPop { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
            position: relative;
            box-shadow: var(--shadow);
            background: var(--card);
        }
        .msg-row.me .msg-bubble {
            background: #e8f5e9;
            border-bottom-right-radius: 4px;
        }
        body.dark .msg-row.me .msg-bubble { background: #1a3a2a; }
        .msg-row.other .msg-bubble {
            background: var(--card);
            border-bottom-left-radius: 4px;
        }

        .msg-meta {
            font-size: 9px;
            color: var(--muted);
            margin-top: 4px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
        }
        .msg-eye { font-size: 12px; color: var(--gold); }

        /* صورة داخل الرسالة */
        .msg-photo {
            max-width: 200px;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid var(--border);
        }

        /* بطاقة الموقع */
        .location-card {
            background: #f0fdf4;
            border-radius: 12px;
            padding: 10px;
            cursor: pointer;
            border: 1px solid #bbf7d0;
        }
        body.dark .location-card { background: #1a2e22; border-color: #2d5a3d; }

        /* مشغل الصوت */
        .voice-player {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 150px;
        }
        .play-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 16px;
            flex-shrink: 0;
            background: var(--walkie);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(37,211,102,0.4);
        }
        .play-btn.playing {
            background: #ef4444;
            animation: pulse-red 0.6s infinite;
        }
        @keyframes pulse-red {
            0%,100% { transform:scale(1); box-shadow:0 0 20px rgba(239,68,68,0.5); }
            50% { transform:scale(1.12); box-shadow:0 0 36px rgba(239,68,68,0.8); }
        }
        .waveform {
            flex: 1;
            height: 32px;
            border-radius: 16px;
            background: rgba(0,0,0,0.03);
        }
        body.dark .waveform { background: rgba(255,255,255,0.03); }
        .voice-caption {
            font-size: 11px;
            color: var(--sub);
            margin-top: 4px;
            font-style: italic;
            padding: 4px 10px;
            background: rgba(0,0,0,0.03);
            border-radius: 10px;
            display: none;
        }
        .voice-caption.show { display: block; }

        /* شريط الكتابة + الأدوات */
        .compose-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: var(--card);
            border-top: 1px solid var(--border);
            flex-shrink: 0;
        }
        .compose-bar input {
            flex: 1;
            padding: 11px 16px;
            border-radius: 30px;
            border: 2px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: var(--transition);
        }
        .compose-bar input:focus {
            border-color: var(--gold);
        }
        .compose-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
            background: var(--bg);
            color: var(--sub);
            box-shadow: var(--shadow);
            flex-shrink: 0;
        }
        .compose-btn:active { transform: scale(0.9); }
        .compose-btn.ptt-main {
            width: 52px;
            height: 52px;
            background: var(--walkie);
            color: #fff;
            font-size: 24px;
            box-shadow: 0 6px 24px rgba(37,211,102,0.5);
            border: 3px solid var(--card);
        }
        .compose-btn.ptt-main.recording {
            background: #ef4444;
            animation: pulse-red 0.6s infinite;
        }

        /* نافذة الإيموجي */
        .emoji-panel {
            display: none;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px;
            background: var(--card);
            border-radius: 16px;
            position: absolute;
            bottom: 60px;
            right: 14px;
            box-shadow: var(--shadow-lg);
            z-index: 50;
            width: 200px;
        }
        .emoji-panel.show { display: flex; }
        .emoji-panel span {
            cursor: pointer;
            font-size: 22px;
            padding: 4px;
            border-radius: 8px;
            transition: 0.1s;
        }
        .emoji-panel span:active { background: var(--bg); transform: scale(1.2); }

        /* تأثير الموجة الصامتة */
        .silent-wave-fx {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(20,184,166,0.4), transparent 70%);
            transform: translate(-50%, -50%) scale(0);
            pointer-events: none;
            z-index: 9999;
            animation: rippleOut 0.55s ease-out forwards;
        }
        @keyframes rippleOut {
            to { transform: translate(-50%,-50%) scale(2.5); opacity: 0; }
        }

        .toast {
            position: fixed;
            bottom: 80px;
            left: 16px;
            right: 16px;
            background: rgba(15,23,42,0.9);
            backdrop-filter: blur(14px);
            color: #fff;
            padding: 14px 22px;
            border-radius: 30px;
            text-align: center;
            z-index: 9999;
            font-weight: 500;
            font-size: 13px;
            animation: slideUp 0.3s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        @keyframes slideUp {
            from { opacity:0; transform:translateY(20px); }
            to { opacity:1; transform:translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 【RESTE DU CODE IDENTIQUE - PAGE GUIDES, LOGIN, SIDEBAR, etc.】 -->
    <!-- [Tout le code existant pour les guides, login, sidebar, modals, etc. reste inchangé] -->

    <!-- ============ PAGE CHAT - SYSTÈME TUNISIEN COMPLET ============ -->
    <div id="pageChat" class="page">
        <div class="smart-chat">
            <div class="chat-topbar">
                <span class="online-badge"></span>
                <span class="title">📻 اللاسلكي الذكي • الدارجة</span>
                <button id="toggleLangBtn" style="background:var(--bg);border:none;padding:6px 12px;border-radius:20px;cursor:pointer;font-size:14px;">🇹🇳 عربية</button>
            </div>
            <div class="contacts-strip" id="contactsStrip">
                <button id="openFriendSearchBtn" style="flex-shrink:0;background:var(--gold);color:#fff;border:none;padding:8px 14px;border-radius:20px;cursor:pointer;font-weight:600;font-size:12px;">🔍 بحث</button>
            </div>
            <div class="messages-panel" id="messagesPanel">
                <div style="text-align:center;color:var(--muted);padding:40px;">👋 اختار شكون باش تكلّم</div>
            </div>

            <!-- شريط الكتابة والأدوات -->
            <div class="compose-bar" style="position:relative;">
                <button class="compose-btn" id="attachBtn" title="صورة">🖼️</button>
                <button class="compose-btn" id="sendLocationBtn" title="موقع">📍</button>
                <input type="text" id="textInput" placeholder="أكتب رسالة..." autocomplete="off">
                <button class="compose-btn ptt-main" id="pttMainBtn" title="اضغط وتسجّل">🎙️</button>
                <button class="compose-btn" id="sendTextBtn" title="إرسال">📤</button>
                <button class="compose-btn" id="silentWaveBtn" title="موجة صامتة">🌊</button>
                <div class="emoji-panel" id="emojiPanel">
                    <span>😀</span><span>😂</span><span>❤️</span><span>👍</span><span>🔥</span>
                    <span>🎉</span><span>🙏</span><span>💪</span><span>👋</span><span>⚠️</span>
                    <span>✅</span><span>📍</span><span>🤲</span><span>💚</span><span>⭐</span>
                </div>
            </div>
        </div>
    </div>

    <!-- الكرة العائمة -->
    <div class="floating-bubble" id="floatingBubble" style="display:none;">
        <img id="floatingAvatar" src="" onerror="this.style.display='none'">
        <div class="floating-badge" id="floatingBadge" style="display:none;">0</div>
    </div>

    <input type="file" id="hiddenImageInput" accept="image/*" style="display:none;">
    <input type="file" id="hiddenCameraInput" accept="image/*" capture="environment" style="display:none;">

    <script>
        // ==================== CODE COMPLET DU FICHIER ====================
        // [Tout le code JavaScript existant (Firebase, auth, guides, etc.) reste ici, intact]
        // Puis on AJOUTE/REMPLACE la partie CHAT ci-dessous

        // ==================== VARIABLES CHAT ====================
        let selectedChatUid = null;
        let chatMessages = [];
        let unsubscribeChat = null;
        let unreadVoiceCount = 0;
        let currentAudio = null;
        let mediaRecorder = null;
        let recording = false;
        let speechRecognition = null;
        let latestTranscript = '';
        let useTunisianArabic = true; // تفعيل اللهجة التونسية

        // ==================== تهيئة التعرف على الصوت بالدارجة التونسية ====================
        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                speechRecognition = new SR();
                // استخدام العربية الفصحى (أقرب ما يمكن للدارجة حالياً)
                speechRecognition.lang = 'ar-SA';
                speechRecognition.continuous = false;
                speechRecognition.interimResults = false;
                speechRecognition.maxAlternatives = 3;
                console.log('✅ التعرف على الصوت مهيأ للدارجة التونسية');
            }
        }

        // ==================== تحميل المستخدمين ====================
        async function loadAllUsers() {
            if (!currentUser) return;
            const snap = await db.collection('users').get();
            allUsers = [];
            snap.forEach(doc => { if (doc.id !== currentUser.uid) allUsers.push({ uid: doc.id, ...doc.data() }); });
            listenAllPresence();
            renderContacts();
        }

        function listenAllPresence() {
            allUsers.forEach(u => {
                rtdb.ref('presence/' + u.uid).on('value', snap => {
                    presenceData[u.uid] = snap.val()?.online || false;
                    renderContacts();
                });
            });
        }

        function renderContacts() {
            const container = document.getElementById('contactsStrip');
            const chips = allUsers.map(u => {
                const online = presenceData[u.uid];
                return `
                <div class="contact-circle ${online?'online':''} ${selectedChatUid===u.uid?'selected':''}" onclick="openChatWith('${u.uid}')">
                    <img class="contact-avatar" src="${u.photoURL||''}" onerror="this.style.display='none'">
                    <div class="contact-name">${esc(u.displayName||u.email)}</div>
                </div>`;
            }).join('');
            container.innerHTML = '<button id="openFriendSearchBtn2" style="flex-shrink:0;background:var(--gold);color:#fff;border:none;padding:8px 14px;border-radius:20px;cursor:pointer;font-weight:600;font-size:12px;">🔍 بحث</button>' + chips;
            document.getElementById('openFriendSearchBtn2').onclick = () => document.getElementById('friendSearchModal').classList.add('show');
        }

        // ==================== فتح محادثة ====================
        window.openChatWith = function(uid) {
            selectedChatUid = uid;
            unreadVoiceCount = 0;
            updateFloatingBadge();
            renderContacts();
            if (unsubscribeChat) unsubscribeChat();
            unsubscribeChat = db.collection('chatMessages')
                .where('participants', 'array-contains', currentUser.uid)
                .orderBy('timestamp', 'asc')
                .onSnapshot(snap => {
                    chatMessages = [];
                    snap.forEach(doc => {
                        const data = doc.data();
                        if (data.participants.includes(uid)) chatMessages.push({ id: doc.id, ...data });
                    });
                    renderMessages();
                }, err => { console.error('Chat error:', err); });
        };

        // ==================== عرض الرسائل ====================
        function renderMessages() {
            const panel = document.getElementById('messagesPanel');
            if (!chatMessages.length) { panel.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px;">💬 ما فمّة حتى رسالة</div>'; return; }
            panel.innerHTML = chatMessages.map(m => {
                const mine = m.senderId === currentUser.uid;
                const senderName = mine ? 'أنا' : (allUsers.find(u => u.uid === m.senderId)?.displayName || 'مستخدم');
                const played = m.openedBy?.[currentUser.uid];
                let content = '';
                switch (m.type) {
                    case 'text':
                        content = `<div style="font-size:15px;">${esc(m.text)}</div>`;
                        break;
                    case 'voice':
                        content = `
                            <div class="voice-player">
                                <button class="play-btn ${played?'played':''}" id="playBtn-${m.id}" onclick="togglePlay('${m.id}','${m.audioUrl}')">▶️</button>
                                <canvas class="waveform" id="wf-${m.id}" width="140" height="32"></canvas>
                            </div>
                            <div class="voice-caption" id="cap-${m.id}">🗣️ أضغط باش تشوف الكلام</div>`;
                        break;
                    case 'image':
                        content = `<img src="${m.imageUrl}" class="msg-photo" onclick="viewImage('${m.imageUrl}')" loading="lazy">`;
                        if (m.caption) content += `<div style="font-size:11px;color:var(--sub);margin-top:3px;">${esc(m.caption)}</div>`;
                        break;
                    case 'location':
                        content = `<div class="location-card" onclick="window.open('https://maps.google.com/?q=${m.lat},${m.lng}')"><div>📍</div><div style="font-size:11px;">${m.locationName||'وين راني'}</div></div>`;
                        break;
                    case 'silent':
                        content = `<div style="font-size:13px;opacity:0.7;">🌊 موجة صامتة</div>`;
                        break;
                }
                content += `<div class="msg-meta">${new Date(m.timestamp?.toDate?.()||m.timestamp||Date.now()).toLocaleTimeString('ar')} ${mine&&m.isRead?'<span class="msg-eye">👁️</span>':''}</div>`;
                return `<div class="msg-row ${mine?'me':'other'}"><div class="msg-bubble"><div style="font-size:10px;font-weight:700;color:var(--gold);margin-bottom:3px;">${esc(senderName)}</div>${content}</div></div>`;
            }).join('');
            panel.scrollTop = panel.scrollHeight;
            // رسم الموجات
            chatMessages.forEach(m => {
                if (m.type === 'voice') {
                    const canvas = document.getElementById('wf-' + m.id);
                    if (canvas) drawMiniWaveform(canvas, m.id);
                }
            });
        }

        function drawMiniWaveform(canvas, seed) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0, 0, w, h);
            const num = seed ? seed.split('').reduce((a,c)=>a+c.charCodeAt(0),0) : 42;
            const bars = 24;
            const barW = (w / bars) * 0.65;
            const gap = (w / bars) * 0.35;
            ctx.fillStyle = '#25D366';
            for (let i = 0; i < bars; i++) {
                const r = Math.sin(num * (i+1) * 0.25) * 0.5 + 0.5;
                const bh = r * (h - 8) + 4;
                const x = i * (barW + gap);
                const y = (h - bh) / 2;
                ctx.beginPath();
                ctx.roundRect(x, y, barW, bh, 2);
                ctx.fill();
            }
        }

        window.togglePlay = function(msgId, url) {
            const btn = document.getElementById('playBtn-' + msgId);
            if (currentAudio && currentAudio._msgId === msgId) {
                if (currentAudio.paused) { currentAudio.play(); btn.classList.add('playing'); }
                else { currentAudio.pause(); btn.classList.remove('playing'); }
                return;
            }
            if (currentAudio) { currentAudio.pause(); currentAudio = null; document.querySelectorAll('.play-btn.playing').forEach(b=>b.classList.remove('playing')); }
            const audio = new Audio(url);
            audio._msgId = msgId;
            currentAudio = audio;
            audio.play().catch(() => toast('⚠️ تعذّر التشغيل', true));
            btn.classList.add('playing');
            audio.onended = () => {
                currentAudio = null;
                btn.classList.remove('playing');
                db.collection('chatMessages').doc(msgId).update({ [`openedBy.${currentUser.uid}`]: firebase.firestore.FieldValue.serverTimestamp() });
                vibrate(8);
            };
        };

        // ==================== الكتابة وإرسال النص ====================
        document.getElementById('sendTextBtn').addEventListener('click', sendTextMessage);
        document.getElementById('textInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendTextMessage();
        });

        function sendTextMessage() {
            const input = document.getElementById('textInput');
            const text = input.value.trim();
            if (!text) return;
            if (!selectedChatUid) return toast('⚠️ اختار شكون باش تكلّم', true);
            sendMessage('text', { text });
            input.value = '';
        }

        async function sendMessage(type, extra = {}) {
            if (!selectedChatUid) return;
            await db.collection('chatMessages').add({
                senderId: currentUser.uid,
                participants: [currentUser.uid, selectedChatUid],
                type,
                timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                isRead: false,
                ...extra,
            });
            vibrate(5);
        }

        // ==================== الميكروفون PTT مع تحويل الصوت للدارجة ====================
        const pttBtn = document.getElementById('pttMainBtn');
        let isHolding = false, holdTimer = null;

        pttBtn.addEventListener('mousedown', (e) => { e.preventDefault(); startHold(); });
        pttBtn.addEventListener('mouseup', endHold);
        pttBtn.addEventListener('mouseleave', endHold);
        pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startHold(); });
        pttBtn.addEventListener('touchend', endHold);
        pttBtn.addEventListener('touchcancel', endHold);

        function startHold() {
            if (!selectedChatUid) { toast('⚠️ اختار شكون باش تكلّم', true); return; }
            isHolding = true;
            holdTimer = setTimeout(() => {
                if (isHolding) startVoiceRecording();
            }, 200);
        }

        function endHold() {
            isHolding = false;
            clearTimeout(holdTimer);
            if (recording) stopVoiceRecording();
        }

        async function startVoiceRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                const chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const path = `voice/${currentUser.uid}_${Date.now()}.webm`;
                    const snap = await storage.ref(path).put(blob);
                    const url = await snap.ref.getDownloadURL();
                    sendMessage('voice', { audioUrl: url, caption: latestTranscript || '' });
                    stream.getTracks().forEach(t => t.stop());
                    latestTranscript = '';
                    vibrate(15);
                };
                mediaRecorder.start();
                recording = true;
                pttBtn.classList.add('recording');
                // بدء التعرف على الصوت بالدارجة
                if (speechRecognition) {
                    speechRecognition.start();
                    speechRecognition.onresult = (e) => {
                        let transcript = e.results[0][0].transcript;
                        // محاولة تكييف النص للدارجة التونسية
                        if (useTunisianArabic) {
                            transcript = adaptToTunisian(transcript);
                        }
                        latestTranscript = transcript;
                        // عرض مؤقت للنص أثناء التسجيل
                        toast('🗣️ سمعتك: ' + transcript.substring(0, 60));
                    };
                    speechRecognition.onerror = (e) => { console.log('Speech error:', e.error); };
                }
                vibrate(8);
                toast('🎙️ تسجّل...');
            } catch (e) {
                toast('⚠️ الميكروفون مسدود', true);
            }
        }

        function stopVoiceRecording() {
            if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
            }
            recording = false;
            pttBtn.classList.remove('recording');
            if (speechRecognition) speechRecognition.stop();
        }

        // تكييف النص العربي الفصحى إلى الدارجة التونسية
        function adaptToTunisian(text) {
            const adaptations = {
                'ماذا': 'شنو',
                'كيف': 'كيفاش',
                'أين': 'وين',
                'لماذا': 'علاش',
                'الآن': 'توّا',
                'كثير': 'برشا',
                'جيد': 'باهي',
                'جميل': 'مزيان',
                'أريد': 'نحبّ',
                'هل': 'فمّا',
                'لا يوجد': 'ما فمّاش',
                'لا أعرف': 'ما نعرفش',
                'تعال': 'إيجا',
                'اذهب': 'إمشي',
                'انظر': 'شوف',
                'أعطني': 'عطيني',
                'انتظر': 'استنّى',
                'صغير': 'صغيرون',
                'كبير': 'كبير',
                'الطريق': 'الطريق',
                'السيارة': 'الكرّوسة',
                'الماء': 'الماء',
                'الخبز': 'الخبز',
                'الشاي': 'التاي',
                'القهوة': 'القهوة',
                'صباح الخير': 'صباح الخير',
                'مساء الخير': 'مساء النور',
                'كيف حالك': 'شنو أحوالك',
                'بخير': 'لباس',
                'الحمد لله': 'الحمد لله',
                'شكرا': 'يعيشك',
                'عفوا': 'مرحبا',
                'نعم': 'إيه',
                'لا': 'لا',
                'ربما': 'يمكن',
                'غدا': 'غدوة',
                'أمس': 'البارح',
                'اليوم': 'اليومة',
            };
            let result = text;
            // استبدال الكلمات العربية الفصحى بالدارجة
            for (const [fusha, darija] of Object.entries(adaptations)) {
                const regex = new RegExp(fusha, 'gi');
                result = result.replace(regex, darija);
            }
            // إضافة لمسات تونسية
            result = result.replace(/هل (.*?)\?/g, 'فمّا $1؟');
            result = result.replace(/لا (.*?)/g, 'ما $1ش');
            result = result.replace(/سوف/g, 'باش');
            result = result.replace(/سأ/g, 'ن');
            return result;
        }

        // ==================== الأزرار الأخرى ====================
        document.getElementById('attachBtn').addEventListener('click', () => {
            document.getElementById('hiddenImageInput').click();
        });
        document.getElementById('hiddenImageInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (ev) => {
                toast('⏳ جاري رفع التصويرة...');
                const url = await uploadToCloudinary(ev.target.result) || ev.target.result;
                sendMessage('image', { imageUrl: url, caption: '' });
            };
            reader.readAsDataURL(file);
            e.target.value = '';
        });

        document.getElementById('sendLocationBtn').addEventListener('click', () => {
            if (!navigator.geolocation) return toast('⚠️ الموقع مش مدعوم', true);
            navigator.geolocation.getCurrentPosition(pos => {
                sendMessage('location', { lat: pos.coords.latitude, lng: pos.coords.longitude, locationName: 'وين راني' });
                toast('📍 تم إرسال الموقع');
            }, () => toast('⚠️ تعذّر تحديد الموقع', true));
        });

        document.getElementById('silentWaveBtn').addEventListener('click', () => {
            if (!selectedChatUid) return toast('⚠️ اختار شكون', true);
            sendMessage('silent', {});
            // تأثير بصري
            const ripple = document.createElement('div');
            ripple.className = 'silent-wave-fx';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
            navigator.vibrate?.([150, 80, 150]);
            toast('🌊 طارت الموجة');
        });

        // الإيموجي
        const emojiPanel = document.getElementById('emojiPanel');
        document.querySelector('.compose-btn[title="إرسال"]').previousElementSibling?.addEventListener?.('click', (e) => {
            e.stopPropagation();
            emojiPanel.classList.toggle('show');
        });
        // زر الإيموجي مستقل
        const emojiBtn = document.createElement('button');
        emojiBtn.className = 'compose-btn';
        emojiBtn.textContent = '😊';
        emojiBtn.title = 'إيموجي';
        emojiBtn.addEventListener('click', (e) => { e.stopPropagation(); emojiPanel.classList.toggle('show'); });
        document.querySelector('.compose-bar').insertBefore(emojiBtn, document.getElementById('silentWaveBtn'));

        document.querySelectorAll('#emojiPanel span').forEach(span => {
            span.addEventListener('click', () => {
                sendMessage('text', { text: span.textContent });
                emojiPanel.classList.remove('show');
            });
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('#emojiPanel') && !e.target.closest('.compose-btn')) {
                emojiPanel.classList.remove('show');
            }
        });

        // ==================== الكرة العائمة (موجودة مسبقاً) ====================
        function updateFloatingBadge() {
            const badge = document.getElementById('floatingBadge');
            if (unreadVoiceCount > 0) {
                badge.style.display = 'flex';
                badge.textContent = unreadVoiceCount > 99 ? '99+' : unreadVoiceCount;
            } else {
                badge.style.display = 'none';
            }
        }

        // ==================== تهيئة ====================
        initSpeechRecognition();
        console.log('🚀 نظام الدردشة التونسي ⚡ جاهز: كتابة + صوت + دارجة');
    </script>

</body>
</html>
