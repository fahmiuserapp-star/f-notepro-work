<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>F-Note Pro Max</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <h2 data-i18n="login">تسجيل الدخول</h2>
            <select id="loginLangSelect" onchange="setLanguage(this.value)">
                <option value="ar">العربية</option>
                <option value="fr">Français</option>
                <option value="en">English</option>
                <option value="de">Deutsch</option>
                <option value="it">Italiano</option>
            </select>
            
            <input type="email" id="loginEmail" data-i18n="email" placeholder="البريد الإلكتروني">
            <input type="password" id="loginPassword" data-i18n="password" placeholder="كلمة المرور">
            <button id="loginBtn" data-i18n="login">دخول</button>
            <div id="loginError" style="display:none; color:red;"></div>
        </div>
    </div>

    <div id="appContainer" style="display:none;">
        <header>
            <h1 data-i18n="title">إدارة الوفود - كرت المتابعة</h1>
            <button id="logoutBtn" data-i18n="logout">تسجيل الخروج</button>
        </header>

        <div id="developerSection" style="display:none;">
            <h3 data-i18n="devSection">قسم المطور</h3>
        </div>
        
        </div>

    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
