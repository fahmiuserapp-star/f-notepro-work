<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="theme-color" content="#e94560">
    <title>F-Note Pro Max</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #f7f9fc; --bg-card: #ffffff; --text-primary: #1e293b; --text-secondary: #475569;
            --text-muted: #64748b; --border: #e2e8f0; --gold: #e94560; --success: #10b981; --whatsapp: #25D366;
            --olive: #556B2F; --olive-light: #6B842F; --gold-card: #D4AF37; --gold-light: #E5C158;
        }
        body.dark { --bg-body: #0f172a; --bg-card: #1e293b; --text-primary: #f1f5f9; --text-secondary: #e2e8f0; --text-muted: #94a3b8; --border: #475569; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg-body); color: var(--text-primary); transition: background 0.2s, color 0.2s; padding-bottom: 20px; position: relative; }
        body::before { content: ""; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 280px; height: 280px; background: rgba(0,0,0,0.03); border-radius: 50%; z-index: 0; pointer-events: none; }
        body::after { content: ""; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 250px; height: 250px; background-image: url('https://i.ibb.co/ds6SXvq6/1778351155986-removebg-preview.png'); background-size: contain; background-repeat: no-repeat; background-position: center; opacity: 0.07; z-index: 0; pointer-events: none; }

        .app-header { background: var(--bg-card); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .logo-header img { height: 44px; }
        .header-btn { width: 38px; height: 38px; border-radius: 50%; background: transparent; border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 17px; transition: all 0.15s; }
        .header-btn:active { background: var(--gold); color: white; transform: scale(0.93); }

        .sidebar { position: fixed; top: 0; right: -100%; width: 280px; height: 100%; background: var(--bg-card); z-index: 1500; transition: right 0.3s ease; box-shadow: -4px 0 20px rgba(0,0,0,0.15); overflow-y: auto; }
        .sidebar.open { right: 0; }
        .sidebar-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .sidebar-close { background: var(--bg-body); border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .sidebar-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
        .sidebar-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; border-radius: 14px; margin: 3px 0; font-size: 14px; color: var(--text-primary); }
        .sidebar-item:active { background: var(--bg-body); }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(3px); z-index: 1400; visibility: hidden; opacity: 0; transition: 0.2s; }
        .overlay.show { visibility: visible; opacity: 1; }

        .toolbar { display: flex; gap: 10px; padding: 12px 16px; background: var(--bg-body); position: sticky; top: 64px; z-index: 90; }
        .search-box { flex: 1; padding: 11px 16px; border: 2px solid transparent; border-radius: 60px; background: var(--bg-card); color: var(--text-primary); font-size: 14px; }
        .search-box:focus { border-color: var(--gold); outline: none; }
        .add-btn { width: 46px; height: 46px; border-radius: 50%; background: var(--gold); color: white; font-size: 24px; border: none; cursor: pointer; }

        .guides-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
        .note-card { background: var(--bg-card); border-radius: 20px; padding: 14px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border-right: 4px solid var(--gold); cursor: pointer; }
        .note-card:active { transform: scale(0.99); }
        .note-body { display: flex; align-items: center; gap: 10px; }
        .note-img { width: 50px; height: 50px; border-radius: 14px; object-fit: cover; border: 2px solid var(--gold-card); }
        .note-info { flex: 1; }
        .note-title { font-weight: 800; font-size: 16px; }
        .note-subtitle { font-size: 12px; color: var(--text-muted); }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1600; display: flex; align-items: center; justify-content: center; visibility: hidden; opacity: 0; transition: 0.2s; }
        .modal.show { visibility: visible; opacity: 1; }
        .modal-box { background: var(--bg-card); width: 92%; max-width: 650px; border-radius: 32px; padding: 24px; max-height: 90vh; overflow-y: auto; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--olive); }
        .input-group input, .input-group select, .input-group textarea { width: 100%; padding: 11px 14px; border: 2px solid var(--border); border-radius: 16px; background: var(--bg-body); color: var(--text-primary); font-size: 14px; }
        .upload-area { border: 2px dashed var(--gold-card); border-radius: 20px; padding: 16px; text-align: center; cursor: pointer; margin: 8px 0; }
        .upload-area:hover { background: rgba(212,175,55,0.05); }
        .preview-thumb { width: 70px; height: 70px; border-radius: 16px; object-fit: cover; border: 2px solid var(--gold-card); }

        .btn-primary { background: linear-gradient(135deg, var(--olive), #3d4d21); color: white; border: none; padding: 14px; border-radius: 20px; font-weight: 700; width: 100%; cursor: pointer; }
        .btn-gold { background: linear-gradient(135deg, var(--gold-card), var(--gold-light)); color: white; border: none; padding: 14px; border-radius: 20px; font-weight: 700; cursor: pointer; }
        .toast { position: fixed; bottom: 30px; left: 20px; right: 20px; background: #1e293b; color: white; border-radius: 60px; padding: 12px 20px; text-align: center; z-index: 9999; font-size: 13px; animation: slideUp 0.3s; }
        @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    </style>
</head>
<body>

<div id="loginScreen" style="position:fixed;inset:0;background:var(--bg-body);z-index:2000;display:flex;align-items:center;justify-content:center;">
    <div style="background:var(--bg-card);border-radius:28px;padding:36px;width:90%;max-width:400px;text-align:center;">
        <img src="https://i.ibb.co/ds6SXvq6/1778351155986-removebg-preview.png" style="height:90px;margin-bottom:16px;">
        <h2 style="color:var(--gold);">F‑Note Pro Max</h2>
        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" style="width:100%;margin:12px 0;padding:14px;border:2px solid var(--border);border-radius:60px;" dir="ltr">
        <input type="password" id="loginPassword" placeholder="كلمة المرور" style="width:100%;margin:12px 0;padding:14px;border:2px solid var(--border);border-radius:60px;">
        <button id="loginBtn" style="width:100%;padding:14px;background:var(--gold);color:white;border:none;border-radius:60px;font-weight:700;">دخول</button>
        <p id="loginError" style="color:red;margin-top:8px;"></p>
    </div>
</div>

<div class="app-header">
    <div><button class="header-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></button></div>
    <div class="logo-header"><img src="https://i.ibb.co/ds6SXvq6/1778351155986-removebg-preview.png" alt="logo"></div>
    <div><button class="header-btn" id="darkModeBtn"><i class="fa-solid fa-moon"></i></button></div>
</div>

<div class="overlay" id="overlay"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-header"><h3 style="color:var(--gold);">✨ F-Note Pro Max</h3><button class="sidebar-close" id="closeSidebar">✕</button></div>
    <div class="sidebar-section">
        <div class="sidebar-item" id="signOutBtn" style="display:none;"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</div>
    </div>
</div>

<div id="mainPage">
    <div class="toolbar">
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 بحث...">
        <button class="add-btn" id="addNoteBtn">+</button>
    </div>
    <div id="notesList" class="guides-list"></div>
</div>

<!-- مودال بطاقة الوفد السياحي -->
<div id="delegationModal" class="modal">
    <div class="modal-box">
        <div id="formSection">
            <h2 style="text-align:center;color:var(--olive);">بطاقة الوفد السياحي</h2>
            <p style="text-align:center;font-weight:800;background:linear-gradient(90deg, var(--olive), var(--gold-card));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">HÔTEL LES OLIVIERS PALACE SFAX</p>
            <div class="input-group"><label>عدد الأفراد *</label><input type="number" id="tcPeople" min="1" value="1"></div>
            <div class="input-group"><label>الجنسية *</label><input type="text" id="tcNationality" placeholder="الجنسية"></div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div class="input-group"><label>من *</label><input type="text" id="tcFrom" placeholder="الانطلاق"></div>
                <div class="input-group"><label>إلى *</label><input type="text" id="tcTo" placeholder="الوجهة"></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
                <div class="input-group"><label>نوع النقل *</label><select id="tcTransport"><option value="">اختر</option><option>حافلة</option><option>سيارة</option><option>فان</option><option>قطار</option><option>أخرى</option></select></div>
                <div class="input-group"><label>رقم اللوحة *</label><input type="text" id="tcPlate" placeholder="اللوحة"></div>
            </div>
            <div class="input-group"><label>اسم المرشد *</label><input type="text" id="tcGuideName" placeholder="الاسم"></div>
            <div class="input-group"><label>جوال المرشد *</label><input type="tel" id="tcGuidePhone" placeholder="05xxxxxxxx" dir="ltr"></div>
            
            <!-- رفع صورة وسيلة النقل (ستظهر كبيرة) -->
            <div class="upload-area" id="vehicleUploadArea"><i class="fa-solid fa-bus"></i> صورة وسيلة النقل *<input type="file" id="vehicleImageInput" accept="image/*" hidden></div>
            <div id="vehiclePreview" style="display:none;"><img id="vehiclePreviewImg" class="preview-thumb" style="width:100px;height:70px;"><button type="button" id="removeVehicle" style="color:red;">إزالة</button></div>

            <!-- رفع صورة المرشد (ستظهر دائرية صغيرة) -->
            <div class="upload-area" id="guideUploadArea"><i class="fa-solid fa-user"></i> صورة المرشد *<input type="file" id="guideImageInput" accept="image/*" hidden></div>
            <div id="guidePreview" style="display:none;"><img id="guidePreviewImg" class="preview-thumb" style="border-radius:50%;width:60px;height:60px;"><button type="button" id="removeGuide" style="color:red;">إزالة</button></div>

            <div class="input-group"><label>ملاحظات</label><textarea id="tcNotes" maxlength="200" rows="2" placeholder="ملاحظات إضافية"></textarea><small id="tcCharCount">0/200</small></div>

            <button class="btn-primary" id="generateCardBtn"><i class="fa-solid fa-wand-magic-sparkles"></i> معاينة الكرت</button>
            <button style="width:100%;margin-top:8px;background:gray;color:white;border:none;padding:12px;border-radius:20px;" id="closeDelegationModal">إلغاء</button>
        </div>

        <!-- معاينة الكرت -->
        <div id="previewSection" style="display:none;">
            <div id="cardToCapture" style="background:white;border-radius:24px;padding:20px;border:3px solid var(--gold-card);">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
                    <div style="display:flex;align-items:center;gap:8px;">
                        <img src="https://i.ibb.co/ds6SXvq6/1778351155986-removebg-preview.png" height="40">
                        <div><strong style="color:var(--olive);">F‑Note Pro Max</strong><br><small style="color:var(--gold-card);">معلومات الوفد السياحي</small></div>
                    </div>
                    <div style="text-align:left;"><span id="cardWeather" style="background:rgba(85,107,47,0.1);padding:4px 10px;border-radius:20px;font-size:12px;"></span><br><small id="cardDateTime" style="color:#666;"></small></div>
                </div>
                <p style="text-align:center;font-weight:800;background:linear-gradient(90deg, var(--olive), var(--gold-card));-webkit-background-clip:text;-webkit-text-fill-color:transparent;">HÔTEL LES OLIVIERS PALACE SFAX</p>
                
                <!-- صورة وسيلة النقل كبيرة -->
                <img id="cardVehicleImg" style="width:100%;max-height:220px;object-fit:cover;border-radius:20px;margin:10px 0;">
                
                <div style="display:flex;align-items:center;gap:12px;margin:10px 0;">
                    <!-- صورة المرشد دائرية -->
                    <img id="cardGuideImg" style="width:70px;height:70px;border-radius:50%;object-fit:cover;border:3px solid var(--gold-card);">
                    <div>
                        <strong id="cardGuideName" style="color:var(--olive);"></strong>
                        <span dir="ltr" id="cardGuidePhone" style="color:var(--gold-card);"></span>
                    </div>
                </div>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                    <div><small>الأفراد</small><br><strong id="cardPeople"></strong></div>
                    <div><small>الجنسية</small><br><strong id="cardNationality"></strong></div>
                    <div><small>من</small><br><strong id="cardFrom"></strong></div>
                    <div><small>إلى</small><br><strong id="cardTo"></strong></div>
                    <div><small>النقل</small><br><strong id="cardTransport"></strong></div>
                    <div><small>اللوحة</small><br><strong id="cardPlate" dir="ltr"></strong></div>
                </div>
                <div id="cardNotesBox" style="display:none;margin-top:8px;background:#f9f9f9;padding:8px;border-radius:12px;"><small>ملاحظات</small><p id="cardNotes"></p></div>
            </div>

            <div style="display:flex;gap:10px;margin-top:16px;">
                <button class="btn-gold" id="shareCardBtn" style="flex:1;"><i class="fa-brands fa-whatsapp"></i> مشاركة</button>
                <button class="btn-primary" id="downloadCardBtn" style="flex:1;"><i class="fa-solid fa-download"></i> تحميل</button>
                <button style="flex:1;background:#64748b;color:white;border:none;padding:14px;border-radius:20px;" id="backToFormBtn">عودة</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Firebase
    const firebaseConfig = { apiKey: "AIzaSyC4vYbhHGfAWMSh-fRl4NlG1WiEyS6Ez9s", authDomain: "f-notepro-work-2d25b.firebaseapp.com", projectId: "f-notepro-work-2d25b", storageBucket: "f-notepro-work-2d25b.firebasestorage.app", messagingSenderId: "221438380381", appId: "1:221438380381:web:b46c35d0ec0944079480b4" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(), auth = firebase.auth();

    let currentUser = null, notes = [];

    function toast(msg, err=false) {
        const t = document.createElement('div'); t.className='toast'; t.style.background=err?'#ef4444':'#1e293b'; t.textContent=msg;
        document.body.appendChild(t); setTimeout(()=>t.remove(),3000);
    }

    // Auth
    document.getElementById('loginBtn').onclick = async () => {
        const email = document.getElementById('loginEmail').value.trim(), pw = document.getElementById('loginPassword').value;
        try { await auth.signInWithEmailAndPassword(email,pw); } catch(e) { toast('خطأ في الدخول',true); }
    };
    auth.onAuthStateChanged(async u => {
        if(u) { currentUser = u; document.getElementById('loginScreen').style.display='none'; document.getElementById('signOutBtn').style.display='flex'; loadNotes(); }
        else { currentUser = null; notes = []; renderNotes(); document.getElementById('loginScreen').style.display='flex'; }
    });
    document.getElementById('signOutBtn').onclick = () => auth.signOut();

    function loadNotes() {
        db.collection('notes').where('userId','==',currentUser.uid).onSnapshot(snap => {
            notes = []; snap.forEach(d => notes.push({id:d.id,...d.data()}));
            db.collection('notes').where('visibility','==','public').get().then(pub => {
                pub.forEach(d => { if(d.data().userId !== currentUser.uid) notes.push({id:d.id,...d.data()}); });
                renderNotes();
            }).catch(()=> renderNotes());
        });
    }

    function renderNotes() {
        const q = (document.getElementById('searchInput')?.value||'').toLowerCase();
        let filtered = notes.filter(n => !q || (n.description||'').includes(q) || (n.guideName||'').includes(q));
        const container = document.getElementById('notesList');
        if(!filtered.length) { container.innerHTML = '<p style="text-align:center;color:var(--text-muted);">لا توجد ملاحظات</p>'; return; }
        container.innerHTML = filtered.map(n => {
            const thumb = n.vehicleImage || n.guideImage || '';
            return `<div class="note-card" onclick="shareNote('${n.id}')">
                <div class="note-body">
                    <img class="note-img" src="${thumb}" onerror="this.style.display='none'">
                    <div class="note-info">
                        <div class="note-title">${n.guideName||'وفد'} ${n.nationality ? ' - '+n.nationality : ''}</div>
                        <div class="note-subtitle">${n.from||''} ➔ ${n.to||''} | ${n.people||''} أفراد</div>
                    </div>
                    <i class="fa-brands fa-whatsapp" style="color:var(--whatsapp);"></i>
                </div>
            </div>`;
        }).join('');
    }

    window.shareNote = (id) => {
        const n = notes.find(x=>x.id===id); if(!n) return;
        const text = `*معلومات الوفد*\n👥 ${n.people}\n🌍 ${n.nationality}\n📍 ${n.from} ➔ ${n.to}\n🚌 ${n.transport}\n🔢 ${n.plate}\n👤 ${n.guideName}\n📞 ${n.guidePhone}\n📝 ${n.notes||''}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank');
    };

    // ---- بطاقة الوفد ----
    let vehicleImageData = null, guideImageData = null;
    const modal = document.getElementById('delegationModal');
    const formSection = document.getElementById('formSection');
    const previewSection = document.getElementById('previewSection');

    document.getElementById('addNoteBtn').addEventListener('click', ()=> {
        vehicleImageData = guideImageData = null;
        document.getElementById('vehiclePreview').style.display='none';
        document.getElementById('guidePreview').style.display='none';
        document.querySelectorAll('#formSection input, #formSection select, #formSection textarea').forEach(el => el.value = '');
        document.getElementById('tcPeople').value = 1;
        document.getElementById('tcCharCount').textContent = '0/200';
        formSection.style.display='block'; previewSection.style.display='none';
        modal.classList.add('show');
    });
    document.getElementById('closeDelegationModal').onclick = ()=> modal.classList.remove('show');

    // رفع الصور
    document.getElementById('vehicleUploadArea').onclick = ()=> document.getElementById('vehicleImageInput').click();
    document.getElementById('vehicleImageInput').onchange = e => {
        const f = e.target.files[0]; if(!f) return;
        const r = new FileReader(); r.onload = ev => { vehicleImageData = ev.target.result; document.getElementById('vehiclePreviewImg').src = vehicleImageData; document.getElementById('vehiclePreview').style.display='block'; }; r.readAsDataURL(f);
    };
    document.getElementById('removeVehicle').onclick = (e)=> { e.stopPropagation(); vehicleImageData=null; document.getElementById('vehiclePreview').style.display='none'; };

    document.getElementById('guideUploadArea').onclick = ()=> document.getElementById('guideImageInput').click();
    document.getElementById('guideImageInput').onchange = e => {
        const f = e.target.files[0]; if(!f) return;
        const r = new FileReader(); r.onload = ev => { guideImageData = ev.target.result; document.getElementById('guidePreviewImg').src = guideImageData; document.getElementById('guidePreview').style.display='block'; }; r.readAsDataURL(f);
    };
    document.getElementById('removeGuide').onclick = (e)=> { e.stopPropagation(); guideImageData=null; document.getElementById('guidePreview').style.display='none'; };

    document.getElementById('tcNotes').oninput = function() { document.getElementById('tcCharCount').textContent = this.value.length+'/200'; };

    // طقس
    async function weatherString() {
        try {
            const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=34.74&longitude=10.76&current_weather=true');
            const d = await r.json();
            if(d.current_weather) {
                const t = d.current_weather.temperature;
                const code = d.current_weather.weathercode;
                const day = d.current_weather.is_day;
                return `${day?'☀️':'🌙'} ${t}°C ${code<=3?'صافي':(code<=48?'غائم':'ممطر')}`;
            }
        } catch(e) {}
        return new Date().getHours()>=6 && new Date().getHours()<18 ? '☀️ نهار' : '🌙 ليل';
    }

    document.getElementById('generateCardBtn').onclick = async () => {
        if(!document.getElementById('tcPeople').value || !document.getElementById('tcNationality').value || !document.getElementById('tcFrom').value || !document.getElementById('tcTo').value || !document.getElementById('tcTransport').value || !document.getElementById('tcPlate').value || !document.getElementById('tcGuideName').value || !document.getElementById('tcGuidePhone').value) return toast('املأ الحقول المطلوبة',true);
        if(!vehicleImageData || !guideImageData) return toast('صور وسيلة النقل والمرشد مطلوبة',true);

        document.getElementById('cardPeople').textContent = document.getElementById('tcPeople').value;
        document.getElementById('cardNationality').textContent = document.getElementById('tcNationality').value;
        document.getElementById('cardFrom').textContent = document.getElementById('tcFrom').value;
        document.getElementById('cardTo').textContent = document.getElementById('tcTo').value;
        document.getElementById('cardTransport').textContent = document.getElementById('tcTransport').value;
        document.getElementById('cardPlate').textContent = document.getElementById('tcPlate').value;
        document.getElementById('cardGuideName').textContent = document.getElementById('tcGuideName').value;
        document.getElementById('cardGuidePhone').textContent = document.getElementById('tcGuidePhone').value;
        document.getElementById('cardVehicleImg').src = vehicleImageData;
        document.getElementById('cardGuideImg').src = guideImageData;
        const notesVal = document.getElementById('tcNotes').value.trim();
        if(notesVal) { document.getElementById('cardNotes').textContent = notesVal; document.getElementById('cardNotesBox').style.display='block'; }
        else document.getElementById('cardNotesBox').style.display='none';

        const now = new Date();
        document.getElementById('cardDateTime').textContent = now.toLocaleDateString('ar-TN',{year:'numeric',month:'long',day:'numeric'}) + ' ' + now.toLocaleTimeString('ar-TN',{hour:'2-digit',minute:'2-digit'});
        document.getElementById('cardWeather').textContent = await weatherString();

        formSection.style.display='none'; previewSection.style.display='block';
    };

    document.getElementById('backToFormBtn').onclick = ()=> { previewSection.style.display='none'; formSection.style.display='block'; };

    async function getCardBlob() {
        const canvas = await html2canvas(document.getElementById('cardToCapture'), {scale:2, backgroundColor:'#ffffff'});
        return new Promise(res => canvas.toBlob(res, 'image/png'));
    }

    async function saveNote() {
        const data = {
            userId: currentUser.uid,
            type: 'delegation',
            description: `وفد ${document.getElementById('tcNationality').value} ${document.getElementById('tcFrom').value} ➔ ${document.getElementById('tcTo').value}`,
            people: document.getElementById('tcPeople').value,
            nationality: document.getElementById('tcNationality').value,
            from: document.getElementById('tcFrom').value,
            to: document.getElementById('tcTo').value,
            transport: document.getElementById('tcTransport').value,
            plate: document.getElementById('tcPlate').value,
            guideName: document.getElementById('tcGuideName').value,
            guidePhone: document.getElementById('tcGuidePhone').value,
            notes: document.getElementById('tcNotes').value.trim(),
            vehicleImage: vehicleImageData,
            guideImage: guideImageData,
            visibility: 'private',
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };
        await db.collection('notes').add(data);
        toast('تم حفظ الملاحظة');
        modal.classList.remove('show');
    }

    document.getElementById('downloadCardBtn').onclick = async ()=> {
        const blob = await getCardBlob();
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'بطاقة_وفد.png'; a.click();
        await saveNote();
    };

    document.getElementById('shareCardBtn').onclick = async ()=> {
        const blob = await getCardBlob();
        const file = new File([blob], 'بطاقة_وفد.png', {type:'image/png'});
        const text = `*معلومات الوفد*\n👥 ${document.getElementById('tcPeople').value}\n🌍 ${document.getElementById('tcNationality').value}\n📍 ${document.getElementById('tcFrom').value} ➔ ${document.getElementById('tcTo').value}\n🚌 ${document.getElementById('tcTransport').value}\n🔢 ${document.getElementById('tcPlate').value}\n👤 ${document.getElementById('tcGuideName').value}\n📞 ${document.getElementById('tcGuidePhone').value}\n📝 ${document.getElementById('tcNotes').value}`;
        if(navigator.canShare && navigator.canShare({files:[file]})) {
            try { await navigator.share({files:[file], text}); } catch(e) { if(e.name!=='AbortError') toast('تعذرت المشاركة',true); }
        } else {
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'بطاقة_وفد.png'; a.click();
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank');
        }
        await saveNote();
    };

    // Sidebar
    document.getElementById('menuBtn').onclick = ()=> { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); };
    document.getElementById('closeSidebar').onclick = ()=> { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); };
    document.getElementById('overlay').onclick = ()=> { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); };
    document.getElementById('darkModeBtn').onclick = ()=> document.body.classList.toggle('dark');
    document.getElementById('searchInput').oninput = renderNotes;
    document.querySelectorAll('.modal').forEach(m=> m.addEventListener('click', function(e){ if(e.target===this) this.classList.remove('show'); }));
</script>
</body>
</html>
