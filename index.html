<script>
    // Firebase & ImgBB config
    const IMGBB_KEY = "4e65916ca5e764d97e1f5348c6515666";
    firebase.initializeApp({apiKey:"AIzaSyB3c1RP9ZZGC25BepSCxZYJ31okyBpdoEo",authDomain:"f-notepromax-work.firebaseapp.com",projectId:"f-notepromax-work",storageBucket:"f-notepromax-work.firebasestorage.app",messagingSenderId:"125749698617",appId:"1:125749698617:web:ff9709a863fd5a5053ede8"});
    const db = firebase.firestore();
    const auth = firebase.auth();
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{});

    // LocalStorage helpers
    const LDB = {
        get(k) { try { return JSON.parse(localStorage.getItem('fnote_'+k)); } catch { return null; } },
        set(k,v) { localStorage.setItem('fnote_'+k, JSON.stringify(v)); },
        getGuides() { return this.get('guides') || []; },
        saveGuides(arr) { this.set('guides', arr); },
        getPin() { return this.get('appPin') || '0000'; },
        setPin(p) { this.set('appPin', p); },
        getUserName() { return this.get('userName') || 'عامل'; }
    };

    // State
    let currentUser = null, guides = LDB.getGuides(), editGuideId = null;
    let busPhotoUrl = '', guidePhotoUrl = '';
    let isForeignPlate = false, currentLang = localStorage.getItem('lang') || 'ar';
    let currentWeather = { icon: '☀️', temp: '--' };
    let notificationTimers = [];

    // Translations
    const translations = {
        ar: {
            email:'البريد الإلكتروني', password:'كلمة المرور', login:'دخول', offline:'🔄 بدون إنترنت',
            back:'رجوع', save:'حفظ',
            profile:'الملف الشخصي', edit_profile:'تعديل الملف', signout:'خروج',
            dev_tools:'أدوات المطور', sync:'مزامنة', pdf:'تصدير PDF', backup:'نسخ احتياطي', restore:'استيراد',
            language:'اللغة', change_pin:'تغيير PIN', weekly:'جدول أسبوعي',
            search:'🔍 بحث...', guide_name:'اسم المرشد *', phone:'رقم الهاتف *',
            toggle_plate:'تبديل إلى لوحة أجنبية', ocr:'استخراج من صورة',
            people:'عدد الأفراد', transport:'نوع النقل', from:'من', to:'إلى', agency:'الوكالة',
            summary:'ملخص عام', auto_summary:'إنشاء ملخص', share:'مشاركة', whatsapp:'واتساب', directions:'اتجاهات',
            plate:'رقم اللوحة', guide:'المرشد'
        },
        fr: { /* ... same keys French ... */ },
        en: { /* ... same keys English ... */ }
    };

    function applyLanguage(lang) {
        currentLang = lang;
        localStorage.setItem('lang', lang);
        document.querySelectorAll('[data-translate]').forEach(el => {
            const key = el.getAttribute('data-translate');
            if(translations[lang]?.[key]) el.textContent = translations[lang][key];
        });
        document.querySelectorAll('[data-translate-placeholder]').forEach(el => {
            const key = el.getAttribute('data-translate-placeholder');
            if(translations[lang]?.[key]) el.placeholder = translations[lang][key];
        });
        document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
        document.querySelector(`.lang-btn[data-lang="${lang}"]`)?.classList.add('active');
    }

    // Dark mode
    const darkPref = localStorage.getItem('darkMode');
    if (darkPref === 'enabled' || (!darkPref && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.body.classList.add('dark');
    }
    document.getElementById('darkToggle').onclick = () => {
        document.body.classList.toggle('dark');
        localStorage.setItem('darkMode', document.body.classList.contains('dark') ? 'enabled' : 'disabled');
    };

    // Toast
    function toast(m) { const e=document.createElement('div'); e.className='toast'; e.textContent=m; document.body.appendChild(e); setTimeout(()=>e.remove(),2500); }

    // Image upload
    async function uploadImg(file) {
        const blob = await new Promise(res => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas'); let w=img.width, h=img.height;
                    if(w>400){ h*=400/w; w=400; } c.width=w; c.height=h;
                    c.getContext('2d').drawImage(img,0,0,w,h);
                    c.toBlob(bl=>res(bl), 'image/jpeg', 0.6);
                }; img.src=e.target.result;
            }; reader.readAsDataURL(file);
        });
        const fd = new FormData(); fd.append('image', blob);
        const resp = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {method:'POST',body:fd});
        const json = await resp.json();
        if(json.success) return json.data.url;
        throw new Error('فشل الرفع');
    }
    function pickImg(previewId, setUrl) {
        const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
        inp.onchange = async e => {
            const file = e.target.files[0]; if(!file) return;
            document.getElementById(previewId).src = URL.createObjectURL(file);
            document.getElementById(previewId).style.display='block';
            try { const url = await uploadImg(file); setUrl(url); toast('تم رفع الصورة'); } catch { toast('خطأ'); }
        }; inp.click();
    }

    // OCR: extract date from image using Tesseract
    document.getElementById('ocrBtn').onclick = () => document.getElementById('ocrFileInput').click();
    document.getElementById('ocrFileInput').onchange = async function() {
        const file = this.files[0];
        if(!file) return;
        toast('⏳ جاري تحليل الصورة...');
        try {
            const { data: { text } } = await Tesseract.recognize(file, 'ara+eng+fra', { logger: m => console.log(m) });
            const datePatterns = [
                /(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/g,
                /(\d{4})[\/\-\.](\d{1,2})[\/\-\.](\d{1,2})/g,
                /(\d{1,2})\s+(يناير|فبراير|مارس|أبريل|ماي|يونيو|يوليوز|غشت|شتنبر|أكتوبر|نونبر|دجنبر|janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre|january|february|march|april|may|june|july|august|september|october|november|december)\s+(\d{2,4})/gi
            ];
            let extractedDate = null;
            for(let pattern of datePatterns) {
                const match = text.match(pattern);
                if(match) {
                    const d = new Date(match[0]);
                    if(!isNaN(d.getTime())) { extractedDate = d; break; }
                }
            }
            if(extractedDate) {
                document.getElementById('gTripDate').value = extractedDate.toISOString().slice(0,16);
                toast('✅ تم استخراج التاريخ: '+extractedDate.toLocaleDateString('ar-TN'));
            } else {
                toast('❌ لم نجد تاريخاً في الصورة');
            }
        } catch(e) { toast('فشل التحليل'); }
    };

    // Notification scheduling
    function scheduleNotification(guide) {
        if(!guide.tripDate) return;
        const tripTime = new Date(guide.tripDate).getTime();
        const now = Date.now();
        if(tripTime <= now) return;
        const delay = tripTime - now;
        const timer = setTimeout(() => {
            if(Notification.permission === 'granted') {
                new Notification('تذكير برحلة', { body: `المرشد: ${guide.name} - الوجهة: ${guide.toLocation}`, icon: 'https://i.ibb.co/ds6SXvq6/1778351155986-removebg-preview.png' });
            }
        }, delay);
        notificationTimers.push({ id: guide.id, timer });
    }

    function cancelNotification(guideId) {
        const idx = notificationTimers.findIndex(n => n.id === guideId);
        if(idx !== -1) { clearTimeout(notificationTimers[idx].timer); notificationTimers.splice(idx,1); }
    }

    function scheduleAllNotifications() {
        notificationTimers.forEach(n => clearTimeout(n.timer));
        notificationTimers = [];
        guides.forEach(g => scheduleNotification(g));
    }

    // Load guides & schedule
    async function loadFromCloud() {
        const snap = await db.collection('guides').where('userId','==',currentUser.uid).get();
        let cloud = []; snap.forEach(d => cloud.push({id:d.id,...d.data()}));
        guides = [...cloud, ...LDB.getGuides().filter(l=>!cloud.find(c=>c.id===l.id))];
        LDB.saveGuides(guides);
        renderGuides();
        scheduleAllNotifications();
    }

    // Weekly view
    function showWeeklyView() {
        const now = new Date();
        const startOfWeek = new Date(now.setDate(now.getDate() - now.getDay() + 1));
        const endOfWeek = new Date(startOfWeek.getTime() + 7*86400000);
        const weekly = guides.filter(g => g.tripDate && new Date(g.tripDate) >= startOfWeek && new Date(g.tripDate) < endOfWeek)
            .sort((a,b) => new Date(a.tripDate) - new Date(b.tripDate));
        const days = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
        let html = '<div style="display:flex; flex-direction:column; gap:8px;">';
        for(let i=0;i<7;i++) {
            const dayGuides = weekly.filter(g => new Date(g.tripDate).getDay() === i);
            html += `<div style="font-weight:700;color:var(--olive);">${days[i]}</div>`;
            if(dayGuides.length) {
                dayGuides.forEach(g => html += `<div style="background:var(--card);padding:8px;border-radius:12px;">${g.name} - ${g.toLocation} (${new Date(g.tripDate).toLocaleTimeString('ar-TN',{hour:'2-digit',minute:'2-digit'})})</div>`);
            } else html += '<div style="color:var(--txt3);">لا توجد رحلات</div>';
        }
        html += '</div>';
        const modal = document.createElement('div');
        modal.className = 'modal show';
        modal.innerHTML = `<div class="modal-box"><div class="close-btn" onclick="this.closest('.modal').remove()">&times;</div><h3>الجدول الأسبوعي</h3>${html}</div>`;
        document.body.appendChild(modal);
    }

    document.getElementById('weeklyBtn').onclick = showWeeklyView;
    document.getElementById('syncBtn').onclick = async () => { /* sync logic */ };
    // ... rest of previous functions (auth, sidebar, renderGuides, showCard, openStatus, etc) adapted with translations ...

    applyLanguage(currentLang);
    // Request notification permission
    if('Notification' in window) Notification.requestPermission();
    // Weather & time updates
    async function updateWeather() {
        try {
            const resp = await fetch('https://api.open-meteo.com/v1/forecast?latitude=36.8&longitude=10.18&current_weather=true');
            const data = await resp.json();
            const temp = Math.round(data.current_weather.temperature) + '°';
            const icons = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'❄️',73:'❄️',75:'❄️',77:'❄️',80:'🌧️',81:'🌧️',82:'🌧️',85:'🌨️',86:'🌨️',95:'⛈️',96:'⛈️',99:'⛈️'};
            currentWeather = { icon: icons[data.current_weather.weathercode] || '🌡️', temp };
            document.getElementById('weatherTemp').textContent = temp;
            document.getElementById('weatherIcon').textContent = currentWeather.icon;
        } catch(e) {}
    }
    function updateDateTime() {
        const now = new Date();
        document.getElementById('currentTime').textContent = now.toLocaleTimeString('ar-TN', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
        document.getElementById('currentDate').textContent = now.toLocaleDateString('ar-TN', {weekday:'long', day:'numeric', month:'long'});
    }
    updateWeather(); updateDateTime();
    setInterval(updateDateTime, 1000);
    setInterval(updateWeather, 600000);

    // Render guides (simplified version, full one includes bus img, avatar, etc)
    function renderGuides() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const filtered = guides.filter(g => !q || g.name?.toLowerCase().includes(q));
        document.getElementById('guidesContainer').innerHTML = filtered.map(g => `
            <div class="guide-card">
                <img class="card-bus-img" src="${g.busPhoto||''}" onerror="this.style.background='#d1d5db';this.src='';">
                <div class="creator-circle" title="${g.createdBy||''}">${(g.createdBy||'?')[0]}</div>
                <div class="card-content">
                    <div class="guide-mini-avatar">${g.guidePhoto?`<img src="${g.guidePhoto}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`:'<i class="fa-solid fa-user"></i>'}</div>
                    <div class="card-info"><div class="name">${g.name}</div><div class="phone">📞 ${g.phone}</div></div>
                    <div style="display:flex;gap:4px;">
                        <button class="c-btn c-call" onclick="location.href='tel:${g.phone}'">📞</button>
                        <button class="c-btn c-wa" onclick="window.open('https://wa.me/${g.phone.replace(/[^0-9]/g,'')}')">💬</button>
                        <button class="c-btn c-card" onclick="showCard('${g.id}')">🪪</button>
                        <button class="c-btn c-status" onclick="openStatus('${g.id}')">📢</button>
                        <button class="c-btn c-edit" onclick="editGuide('${g.id}')">✏️</button>
                    </div>
                </div>
            </div>`).join('');
        document.getElementById('statsBar').innerHTML = `<div class="stat-item"><span class="big">${guides.length}</span><br>مرشدين</div>`;
    }

    // Initial render
    if(!currentUser) { /* show login */ } else { renderGuides(); scheduleAllNotifications(); }
</script>
</body>
</html>
