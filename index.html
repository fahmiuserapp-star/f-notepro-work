<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="theme-color" content="#e94560">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>F-Note Pro | النسخة المطورة</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg: #f5f6fa;
            --card: #ffffff;
            --text: #1a1a2e;
            --sub: #545f71;
            --muted: #8b95a5;
            --border: #e8ecf1;
            --gold: #e94560;
            --gold-light: #ff6b81;
            --success: #10b981;
            --danger: #ef4444;
            --walkie: #25D366;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --radius: 20px;
            --radius-sm: 14px;
            --radius-full: 60px;
            --font: 'Segoe UI', 'Tajawal', system-ui, -apple-system, sans-serif;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --sub: #cbd5e1;
            --muted: #94a3b8;
            --border: #334155;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg);
            font-family: var(--font);
            color: var(--text);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow-x: hidden;
            transition: background var(--transition), color var(--transition);
        }

        body::after {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50%;
            max-width: 280px;
            aspect-ratio: 1;
            background: url('https://i.ibb.co/KxCpMmmq/1777593015229-removebg-preview.png') center/contain no-repeat;
            opacity: 0.03;
            z-index: 0;
            pointer-events: none;
        }

        /* ==================== شاشة الدخول ==================== */
        .login-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: opacity 0.4s, visibility 0.4s;
        }
        .login-screen.hide { opacity: 0; visibility: hidden; pointer-events: none; }
        .login-card {
            background: var(--card);
            border-radius: 36px;
            padding: 36px 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            animation: popIn 0.5s ease;
        }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .login-logo img { width: 90px; margin-bottom: 12px; }
        .login-title { font-size: 26px; font-weight: 900; color: var(--gold); margin-bottom: 4px; }
        .login-input {
            width: 100%; padding: 13px 16px; margin: 6px 0; border: 2px solid var(--border);
            border-radius: var(--radius-full); background: var(--bg); color: var(--text); outline: none; direction: ltr;
        }
        .login-btn {
            width: 100%; padding: 14px; margin-top: 14px; border: none; border-radius: var(--radius-full);
            background: var(--gold); color: #fff; font-weight: 700; cursor: pointer;
        }

        /* ==================== الهيدر والشريط الجانبي ==================== */
        .header {
            background: var(--card); padding: 10px 16px; display: flex; align-items: center; justify-content: center;
            position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.04); border-bottom: 1px solid var(--border);
        }
        .header-logo img { height: 48px; }
        .header-menu { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); background: var(--bg); border: none; width: 42px; height: 42px; border-radius: 50%; cursor: pointer; color: var(--sub); display: flex; align-items: center; justify-content: center; }
        
        .sidebar {
            position: fixed; top: 0; right: -300px; width: 280px; height: 100%; background: var(--card);
            z-index: 1500; transition: right 0.3s ease; box-shadow: -6px 0 28px rgba(0, 0, 0, 0.2); overflow-y: auto; direction: rtl;
        }
        .sidebar.open { right: 0; }
        .sidebar-head { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-item { display: flex; align-items: center; gap: 10px; padding: 12px; cursor: pointer; color: var(--text); font-size: 14px; border-bottom: 1px solid var(--border); }

        /* ==================== اللاسلكي والدردشة ==================== */
        .walkie-room {
            position: fixed; inset: 0; background: var(--bg); z-index: 1200; display: none; flex-direction: column; padding-top: 70px;
        }
        .walkie-room.show { display: flex; }
        .online-list { display: flex; gap: 10px; padding: 15px; overflow-x: auto; background: var(--card); border-bottom: 1px solid var(--border); }
        .online-user { position: relative; display: flex; flex-direction: column; align-items: center; min-width: 60px; }
        .online-user img { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--success); }
        .status-dot { position: absolute; bottom: 18px; right: 5px; width: 12px; height: 12px; background: var(--success); border: 2px solid var(--card); border-radius: 50%; }
        .online-name { font-size: 10px; margin-top: 4px; max-width: 60px; overflow: hidden; text-overflow: ellipsis; }

        .chat-messages { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { max-width: 80%; padding: 10px; border-radius: 18px; position: relative; background: var(--card); align-self: flex-start; box-shadow: var(--shadow); }
        .msg-bubble.mine { align-self: flex-end; background: var(--gold); color: #fff; }
        .msg-info { font-size: 9px; opacity: 0.7; margin-bottom: 4px; display: flex; align-items: center; gap: 5px; }
        .msg-audio { cursor: pointer; display: flex; align-items: center; gap: 8px; }

        /* ==================== زر اللاسلكي الطافي ==================== */
        .walkie-btn {
            position: fixed; bottom: 24px; left: 24px; width: 62px; height: 62px; background: var(--walkie);
            border-radius: 50%; color: #fff; font-size: 28px; display: flex; align-items: center; justify-content: center;
            z-index: 1300; cursor: pointer; box-shadow: 0 6px 22px rgba(37, 211, 102, 0.4); touch-action: none;
        }
        .walkie-btn.recording { background: var(--danger); animation: pulse 0.7s infinite; }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

        /* ==================== نظام البطاقات والبحث ==================== */
        .toolbar { display: flex; padding: 10px 14px; gap: 8px; sticky: top: 68px; z-index: 90; }
        .search-box { flex: 1; padding: 12px 16px; border-radius: var(--radius-full); background: var(--card); border: none; box-shadow: var(--shadow); }
        .add-btn { width: 50px; height: 50px; border-radius: 50%; background: var(--gold); color: #fff; font-size: 28px; border: none; }

        .guides-list { padding: 10px 14px 100px; display: flex; flex-direction: column; gap: 12px; }
        .guide-card { background: var(--card); border-radius: var(--radius); padding: 14px; border-right: 5px solid var(--gold); box-shadow: var(--shadow); }
        
        /* ==================== Modal ==================== */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1600; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal.show { display: flex; }
        .modal-box { background: var(--card); width: 100%; max-width: 450px; padding: 25px; border-radius: 28px; max-height: 90vh; overflow-y: auto; }
        
        .profile-img-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 3px solid var(--gold); margin: 0 auto 15px; display: block; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1a1a2e; color: #fff; padding: 10px 20px; border-radius: 30px; z-index: 9999; }
    </style>
</head>
<body>

    <div class="conn-badge" id="connBadge" style="display:none;">📡 غير متصل</div>

    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <div class="login-logo"><img src="https://i.ibb.co/KxCpMmmq/1777593015229-removebg-preview.png"></div>
            <div class="login-title">F-Note Pro</div>
            <input type="email" id="loginEmail" class="login-input" placeholder="البريد الإلكتروني" value="fahmiajmi5@gmail.com">
            <input type="password" id="loginPassword" class="login-input" placeholder="كلمة المرور">
            <button class="login-btn" id="loginBtn">🔐 دخول</button>
            <div id="loginError" style="color:red; font-size:12px; margin-top:10px;"></div>
        </div>
    </div>

    <div class="header">
        <div class="header-logo"><img src="https://i.ibb.co/KxCpMmmq/1777593015229-removebg-preview.png"></div>
        <button class="header-menu" id="menuBtn">☰</button>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-head"><h3>✨ القائمة</h3><button id="closeSidebar">✕</button></div>
        <div class="sidebar-item" id="profileBtn"><span class="ico">👤</span> ملفي الشخصي</div>
        <div class="sidebar-item" id="walkieRoomBtn"><span class="ico">📻</span> غرفة اللاسلكي</div>
        <div class="sidebar-item" id="darkModeBtn"><span class="ico">🌙</span> الوضع الداكن</div>
        <div class="sidebar-item" id="signOutBtn"><span class="ico">🚪</span> خروج</div>
    </div>

    <div class="walkie-room" id="walkieRoom">
        <div class="header" style="position:fixed; top:0; width:100%;">
            <button onclick="closeWalkie()" style="position:absolute; right:15px; background:none; border:none; font-size:20px;">✕</button>
            <h4>رادار اللاسلكي</h4>
        </div>
        <div class="online-list" id="onlineList">
            </div>
        <div class="chat-messages" id="chatMessages">
            <div style="text-align:center; color:var(--muted); font-size:12px; padding:20px;">
                الرسائل المسموعة تحذف بعد 10 دقائق تلقائياً 🛡️
            </div>
        </div>
    </div>

    <div id="mainContent">
        <div class="toolbar">
            <input type="text" id="searchInput" class="search-box" placeholder="🔍 بحث عن مرشد...">
            <button class="add-btn" id="addBtn">+</button>
        </div>
        <div id="guidesContainer" class="guides-list"></div>
    </div>

    <div id="profileModal" class="modal">
        <div class="modal-box">
            <h3>👤 تعديل الحساب</h3>
            <img id="profilePreview" class="profile-img-preview" src="https://via.placeholder.com/80">
            <button onclick="pickProfileImg()" style="width:100%; margin-bottom:15px;" class="btn-sm btn-edit">تغيير الصورة</button>
            <input type="text" id="profName" class="login-input" placeholder="اسم العرض">
            <div class="modal-btns">
                <button class="btn-save" id="saveProfileBtn">حفظ</button>
                <button class="btn-cancel" onclick="closeModal('profileModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="guideModal" class="modal">
        <div class="modal-box">
            <h3>➕ إضافة مرشد</h3>
            <input type="text" id="gName" placeholder="الاسم الكامل">
            <input type="tel" id="gPhone" placeholder="رقم الهاتف">
            <input type="text" id="gPlate" placeholder="رقم اللوحة">
            <textarea id="gNotes" placeholder="ملاحظات"></textarea>
            <div class="modal-btns">
                <button class="btn-save" id="saveGuideBtn">حفظ</button>
                <button class="btn-cancel" onclick="closeModal('guideModal')">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="walkieBtn" class="walkie-btn">🎙️</div>

    <script>
        // --- إعدادات Firebase (نفس التي قدمتها) ---
        const firebaseConfig = {
            apiKey: "AIzaSyC4vYbhHGfAWMSh-fRl4NlG1WiEyS6Ez9s",
            authDomain: "f-notepro-work-2d25b.firebaseapp.com",
            projectId: "f-notepro-work-2d25b",
            storageBucket: "f-notepro-work-2d25b.firebasestorage.app",
            messagingSenderId: "221438380381",
            appId: "1:221438380381:web:b46c35d0ec0944079480b4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage();

        let currentUser = null;
        let userData = { name: 'Fahmi', photo: '' }; //

        // --- نظام الحذف التلقائي (Logic) ---
        async function autoCleanMessages() {
            const now = Date.now();
            const snapshot = await db.collection('radio_broadcasts').get();
            snapshot.forEach(async (doc) => {
                const data = doc.data();
                const timeDiff = now - (data.timestamp?.toMillis() || now);
                
                // حذف بعد 24 ساعة إذا لم تسمع، أو بعد 10 دقائق إذا سمعت
                if (timeDiff > 24 * 60 * 60 * 1000 || (data.played && timeDiff > 10 * 60 * 1000)) {
                    // حذف من الاستورج أولاً
                    try { await storage.refFromURL(data.url).delete(); } catch(e){}
                    // حذف من قاعدة البيانات
                    await db.collection('radio_broadcasts').doc(doc.id).delete();
                }
            });
        }
        setInterval(autoCleanMessages, 60000); // تحقق كل دقيقة

        // --- نظام الحضور (Online Status) ---
        function updateStatus(online) {
            if (!currentUser) return;
            db.collection('users').doc(currentUser.uid).set({
                name: userData.name,
                photo: userData.photo,
                lastSeen: firebase.firestore.FieldValue.serverTimestamp(),
                online: online
            }, { merge: true });
        }

        // --- إدارة الصور والملف الشخصي ---
        async function pickProfileImg() {
            const inp = document.createElement('input');
            inp.type = 'file'; inp.accept = 'image/*';
            inp.onchange = async e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = async (re) => {
                    document.getElementById('profilePreview').src = re.target.result;
                    // رفع الصورة (Cloudinary أو Firebase حسب رغبتك - هنا سنستخدم Firebase للسهولة)
                    const ref = storage.ref(`profiles/${currentUser.uid}.jpg`);
                    await ref.put(file);
                    userData.photo = await ref.getDownloadURL();
                };
                reader.readAsDataURL(file);
            };
            inp.click();
        }

        document.getElementById('saveProfileBtn').onclick = async () => {
            userData.name = document.getElementById('profName').value;
            await updateStatus(true);
            closeModal('profileModal');
            toast("تم تحديث الملف");
        };

        // --- اللاسلكي المتطور ---
        let mediaRecorder, chunks = [];
        const walkieBtn = document.getElementById('walkieBtn');

        walkieBtn.onpointerdown = async () => {
            if(!currentUser) return;
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = e => chunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(chunks, { type: 'audio/webm' });
                const ref = storage.ref(`radio/${Date.now()}.webm`);
                await ref.put(blob);
                const url = await ref.getDownloadURL();
                await db.collection('radio_broadcasts').add({
                    url, 
                    senderId: currentUser.uid,
                    senderName: userData.name,
                    senderPhoto: userData.photo,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    played: false
                });
                chunks = [];
            };
            mediaRecorder.start();
            walkieBtn.classList.add('recording');
        };

        walkieBtn.onpointerup = () => {
            if(mediaRecorder) mediaRecorder.stop();
            walkieBtn.classList.remove('recording');
        };

        // --- مراقبة الرسائل الجديدة والأعضاء المتصلين ---
        function listenToChat() {
            // المتصلون الآن
            db.collection('users').where('online', '==', true).onSnapshot(snap => {
                const list = document.getElementById('onlineList');
                list.innerHTML = '';
                snap.forEach(doc => {
                    const u = doc.data();
                    list.innerHTML += `
                        <div class="online-user">
                            <img src="${u.photo || 'https://via.placeholder.com/45'}">
                            <div class="status-dot"></div>
                            <span class="online-name">${u.name}</span>
                            <button onclick="addFriend('${doc.id}')" style="font-size:8px;">➕ صديق</button>
                        </div>
                    `;
                });
            });

            // الرسائل اللاسلكية
            db.collection('radio_broadcasts').orderBy('timestamp', 'asc').onSnapshot(snap => {
                const container = document.getElementById('chatMessages');
                container.innerHTML = '';
                snap.forEach(doc => {
                    const m = doc.data();
                    const isMine = m.senderId === currentUser.uid;
                    const bubble = document.createElement('div');
                    bubble.className = `msg-bubble ${isMine ? 'mine' : ''}`;
                    bubble.innerHTML = `
                        <div class="msg-info">
                            <img src="${m.senderPhoto}" style="width:15px;height:15px;border-radius:50%;">
                            <span>${m.senderName}</span>
                        </div>
                        <div class="msg-audio" onclick="playVoice('${m.url}', '${doc.id}')">
                            ▶️ رسالة صوتية
                        </div>
                    `;
                    container.appendChild(bubble);
                });
                container.scrollTop = container.scrollHeight;
            });
        }

        window.playVoice = (url, id) => {
            const audio = new Audio(url);
            audio.play();
            // تحديث الحالة بأنها "سمعت" لبدء عداد الـ 10 دقائق
            db.collection('radio_broadcasts').doc(id).update({ played: true });
        };

        // --- وظائف عامة ---
        function toast(m) {
            const t = document.createElement('div'); t.className = 'toast'; t.textContent = m;
            document.body.appendChild(t); setTimeout(() => t.remove(), 2000);
        }

        function closeModal(id) { document.getElementById(id).classList.remove('show'); }
        function closeWalkie() { document.getElementById('walkieRoom').classList.remove('show'); }

        document.getElementById('menuBtn').onclick = () => document.getElementById('sidebar').classList.add('open');
        document.getElementById('closeSidebar').onclick = () => document.getElementById('sidebar').classList.remove('open');
        document.getElementById('profileBtn').onclick = () => {
            document.getElementById('profName').value = userData.name;
            document.getElementById('profileModal').classList.add('show');
        };
        document.getElementById('walkieRoomBtn').onclick = () => document.getElementById('walkieRoom').classList.add('show');
        document.getElementById('addBtn').onclick = () => document.getElementById('guideModal').classList.add('show');

        // --- المصادقة ---
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('loginScreen').classList.add('hide');
                db.collection('users').doc(user.uid).get().then(doc => {
                    if(doc.exists) {
                        userData = doc.data();
                        document.getElementById('profilePreview').src = userData.photo || '';
                    }
                });
                updateStatus(true);
                listenToChat();
            } else {
                document.getElementById('loginScreen').classList.remove('hide');
            }
        });

        document.getElementById('loginBtn').onclick = () => {
            const email = document.getElementById('loginEmail').value;
            const pass = document.getElementById('loginPassword').value;
            auth.signInWithEmailAndPassword(email, pass).catch(e => {
                document.getElementById('loginError').textContent = "خطأ في الدخول";
            });
        };

        document.getElementById('signOutBtn').onclick = () => {
            updateStatus(false);
            auth.signOut();
        };

        window.onbeforeunload = () => updateStatus(false);

    </script>
</body>
</html>
