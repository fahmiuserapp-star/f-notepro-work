<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>F‑Note Pro Max | Offline First</title>
    <!-- فقط المكتبات الأساسية -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f8fafc; --card: #ffffff; --txt: #0f172a; --txt2: #475569; --txt3: #94a3b8;
            --border: #e2e8f0; --accent: #0f766e; --accent2: #14b8a6; --err: #ef4444;
            --ok: #10b981; --wa: #25D366; --r: 16px;
        }
        .dark { --bg: #0f172a; --card: #1e293b; --txt: #f1f5f9; --txt2: #cbd5e1; --txt3: #64748b; --border: #334155; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
        body { background:var(--bg); color:var(--txt); min-height:100vh; }
        @media(min-width:768px) { body { max-width:480px; margin:auto; border-left:1px solid var(--border); border-right:1px solid var(--border); } }
        button { cursor:pointer; border:none; background:none; font-family:'Cairo',sans-serif; }
        button:active { opacity:0.8; transform:scale(0.97); }
        input, textarea, select { width:100%; padding:12px 16px; border:2px solid var(--border); border-radius:14px; background:var(--bg); color:var(--txt); font-size:15px; outline:none; font-family:'Cairo',sans-serif; margin:6px 0; }
        textarea { resize:vertical; min-height:70px; }

        .header { background:var(--card); padding:10px 16px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; border-bottom:1px solid var(--border); }
        .header img { height:36px; }
        .icon-btn { width:40px; height:40px; border-radius:50%; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--txt2); font-size:18px; }

        .toolbar { display:flex; gap:8px; padding:12px 16px; background:var(--bg); position:sticky; top:58px; z-index:40; }
        .search { flex:1; padding:10px 16px; border:2px solid var(--border); border-radius:60px; background:var(--card); color:var(--txt); font-size:14px; }
        .accent-btn { background:var(--accent)!important; color:white!important; border-color:var(--accent)!important; font-size:22px; }

        .guides { padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
        .card { background:var(--card); border-radius:var(--r); padding:14px; box-shadow:0 2px 8px rgba(0,0,0,0.05); border-right:4px solid var(--accent); }
        .card-row { display:flex; align-items:center; gap:10px; }
        .avatar { width:48px; height:48px; border-radius:12px; object-fit:cover; border:2px solid var(--accent); flex-shrink:0; background:var(--bg); }
        .bus-avatar { width:40px; height:40px; border-radius:50%; object-fit:cover; border:2px solid var(--accent2); flex-shrink:0; background:var(--bg); }
        .info { flex:1; }
        .name { font-weight:800; font-size:15px; } .phone { color:var(--accent); font-weight:600; direction:ltr; font-size:13px; }
        .details { margin-top:10px; padding-top:10px; border-top:1px solid var(--border); display:none; }
        .details.show { display:block; }
        .actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
        .badge { padding:6px 12px; border-radius:20px; font-size:11px; font-weight:700; color:white; }
        .badge-call { background:var(--ok); } .badge-wa { background:var(--wa); } .badge-card { background:var(--accent); }
        .badge-edit { background:#3b82f6; } .badge-del { background:var(--err); }

        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:300; display:flex; align-items:center; justify-content:center; visibility:hidden; opacity:0; transition:0.2s; }
        .modal.show { visibility:visible; opacity:1; }
        .modal-box { background:var(--card); border-radius:24px; padding:24px; width:92%; max-width:460px; max-height:85vh; overflow-y:auto; }
        .modal-box h3 { text-align:center; color:var(--accent); margin-bottom:16px; }
        .upload-area { border:2px dashed var(--accent); border-radius:16px; padding:16px; text-align:center; margin:10px 0; cursor:pointer; }
        .upload-area img { width:60px; height:60px; object-fit:cover; border-radius:12px; margin-top:8px; }
        .btn-primary { width:100%; padding:12px; background:var(--ok); color:white; border-radius:14px; font-weight:700; font-size:15px; margin-top:10px; }
        .btn-secondary { width:100%; padding:12px; background:var(--txt3); color:white; border-radius:14px; font-weight:700; margin-top:6px; }

        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#1e293b; color:white; padding:10px 24px; border-radius:30px; font-size:13px; z-index:999; }
        .empty { text-align:center; padding:40px; color:var(--txt3); }
    </style>
</head>
<body>

<!-- شاشة الدخول -->
<div id="loginScreen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;">
    <div style="background:var(--card);border-radius:24px;padding:32px 24px;max-width:380px;width:100%;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.08);">
        <img src="https://i.ibb.co/ds6SXvq6/1778351155986-removebg-preview.png" style="width:90px;margin-bottom:16px;">
        <h1 style="color:var(--accent);font-size:26px;font-weight:900;margin-bottom:20px;">F‑Note Pro Max</h1>
        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" dir="ltr">
        <input type="password" id="loginPassword" placeholder="كلمة المرور">
        <button id="loginBtn" style="width:100%;padding:14px;background:var(--accent);color:white;border-radius:14px;font-weight:700;font-size:16px;margin-top:12px;">دخول</button>
        <button id="offlineModeBtn" style="width:100%;padding:14px;background:var(--txt3);color:white;border-radius:14px;font-weight:700;font-size:14px;margin-top:8px;">🔄 العمل بدون إنترنت</button>
        <div id="loginError" style="color:var(--err);font-size:13px;margin-top:8px;display:none;"></div>
    </div>
</div>

<!-- التطبيق الرئيسي -->
<div id="appContainer" style="display:none;">
    <div class="header">
        <button class="icon-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
        <img src="https://i.ibb.co/ds6SXvq6/1778351155986-removebg-preview.png" alt="Logo">
        <button class="icon-btn" id="darkToggle"><i class="fa-solid fa-moon"></i></button>
    </div>

    <div class="toolbar">
        <input type="text" id="searchInput" class="search" placeholder="🔍 بحث عن مرشد...">
        <button class="icon-btn" id="voiceSearchBtn"><i class="fa-solid fa-microphone"></i></button>
        <button class="icon-btn accent-btn" id="addGuideBtn">+</button>
        <button class="icon-btn" id="syncBtn" title="مزامنة"><i class="fa-solid fa-cloud-arrow-up"></i></button>
    </div>

    <div id="guidesContainer" class="guides"><div class="empty">⏳ جاري التحميل...</div></div>
</div>

<!-- مودال الإضافة -->
<div class="modal" id="guideModal">
    <div class="modal-box">
        <h3 id="modalTitle">➕ إضافة مرشد</h3>
        <input type="text" id="gName" placeholder="الاسم *">
        <input type="tel" id="gPhone" placeholder="الهاتف *" dir="ltr">
        <input type="text" id="gPlate" placeholder="رقم اللوحة">
        <div class="upload-area" id="guideUploadBtn"><i class="fa-solid fa-user"></i> 📸 صورة المرشد <img id="guidePreview" src="" style="display:none;"></div>
        <div class="upload-area" id="busUploadBtn"><i class="fa-solid fa-bus"></i> 🚌 صورة الحافلة <img id="busPreview" src="" style="display:none;"></div>
        <input type="text" id="gTransport" placeholder="وسيلة النقل">
        <input type="text" id="gAgency" placeholder="الوكالة">
        <textarea id="gNotes" placeholder="ملاحظات"></textarea>
        <select id="gVisibility"><option value="private">🔒 خاص</option><option value="public">🌍 عام</option></select>
        <button class="btn-primary" id="saveGuideBtn">💾 حفظ</button>
        <button class="btn-secondary" id="closeGuideBtn">إلغاء</button>
    </div>
</div>

<script>
    // ==================== تخزين محلي ذكي ====================
    const LocalDB = {
        getGuides() {
            try { return JSON.parse(localStorage.getItem('fnote_guides') || '[]'); } catch(e) { return []; }
        },
        saveGuides(guides) {
            try { localStorage.setItem('fnote_guides', JSON.stringify(guides)); } catch(e) { console.warn('Local storage full, clearing old data'); }
        },
        getProfile() {
            try { return JSON.parse(localStorage.getItem('fnote_profile') || '{}'); } catch(e) { return {}; }
        },
        saveProfile(profile) {
            try { localStorage.setItem('fnote_profile', JSON.stringify(profile)); } catch(e) {}
        }
    };

    // ==================== ضاغط صور قوي ====================
    function compressImage(file, maxWidth = 400, quality = 0.5) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let w = img.width, h = img.height;
                    if (w > maxWidth) { h *= maxWidth / w; w = maxWidth; }
                    canvas.width = w; canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL('image/jpeg', quality));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        });
    }

    // ==================== Firebase (اختياري) ====================
    let db = null, auth = null;
    const firebaseConfig = {
        apiKey: "AIzaSyC4vYbhHGfAWMSh-fRl4NlG1WiEyS6Ez9s",
        authDomain: "f-notepro-work-2d25b.firebaseapp.com",
        projectId: "f-notepro-work-2d25b",
        storageBucket: "f-notepro-work-2d25b.firebasestorage.app",
        messagingSenderId: "221438380381",
        appId: "1:221438380381:web:b46c35d0ec0944079480b4"
    };

    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
        auth = firebase.auth();
        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
    } catch(e) {
        console.warn('Firebase init failed, working offline only');
    }

    let currentUser = null;
    let guides = LocalDB.getGuides();
    let editId = null;
    let guidePhotoB64 = '', busPhotoB64 = '';
    let userProfile = LocalDB.getProfile();

    function toast(msg) {
        const el = document.createElement('div'); el.className='toast'; el.textContent=msg;
        document.body.appendChild(el); setTimeout(()=>el.remove(), 2500);
    }

    // ==================== الدخول ====================
    document.getElementById('loginBtn').onclick = async function() {
        const email = document.getElementById('loginEmail').value.trim();
        const pass = document.getElementById('loginPassword').value;
        const err = document.getElementById('loginError');
        if(!email||!pass) { err.textContent='أدخل البريد وكلمة المرور'; err.style.display='block'; return; }
        if(!auth) { toast('Firebase غير متصل - استخدم وضع بدون إنترنت'); return; }
        try {
            await auth.signInWithEmailAndPassword(email, pass);
        } catch(e) {
            err.textContent = 'خطأ: ' + (e.code==='auth/invalid-credential'?'بيانات خاطئة':e.message);
            err.style.display='block';
        }
    };

    // وضع بدون إنترنت
    document.getElementById('offlineModeBtn').onclick = function() {
        currentUser = { uid: 'offline_user', email: 'offline@local' };
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appContainer').style.display = 'block';
        renderGuides();
        toast('🔄 تعمل الآن بدون إنترنت');
    };

    if(auth) {
        auth.onAuthStateChanged(function(user) {
            if(user) {
                currentUser = user;
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appContainer').style.display = 'block';
                // تحميل من السحابة
                if(db) {
                    db.collection('guides').where('userId','==',user.uid).get().then(snap => {
                        let cloud = []; snap.forEach(d => cloud.push({id:d.id, ...d.data()}));
                        // دمج مع المحلي
                        const local = LocalDB.getGuides();
                        const merged = [...cloud];
                        local.forEach(l => { if(!merged.find(m=>m.id===l.id)) merged.push(l); });
                        guides = merged;
                        LocalDB.saveGuides(guides);
                        renderGuides();
                    }).catch(() => { guides = LocalDB.getGuides(); renderGuides(); });
                }
                renderGuides();
            }
        });
    }

    // ==================== عرض المرشدين ====================
    function renderGuides() {
        const q = document.getElementById('searchInput').value.toLowerCase();
        const filtered = guides.filter(g => !q || (g.name||'').toLowerCase().includes(q) || (g.phone||'').includes(q));
        const container = document.getElementById('guidesContainer');
        if(!filtered.length) { container.innerHTML='<div class="empty">لا توجد نتائج</div>'; return; }
        container.innerHTML = filtered.map(g => `
            <div class="card">
                <div class="card-row">
                    <img class="avatar" src="${g.guidePhoto||''}" onerror="this.style.display='none'">
                    ${g.busPhoto ? `<img class="bus-avatar" src="${g.busPhoto}">` : ''}
                    <div class="info"><div class="name">${g.name||''} ${g.visibility==='public'?'🌍':'🔒'}</div><div class="phone">${g.phone||''}</div></div>
                    <span onclick="toggleDetail('${g.id}')" style="font-size:18px;color:var(--txt3);cursor:pointer;"><i class="fa-solid fa-chevron-down"></i></span>
                </div>
                <div class="details" id="detail-${g.id}">
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;">
                        <div style="background:var(--bg);padding:8px;border-radius:10px;"><span style="font-size:10px;color:var(--txt3);">النقل</span><br>${g.transportType||'—'}</div>
                        <div style="background:var(--bg);padding:8px;border-radius:10px;"><span style="font-size:10px;color:var(--txt3);">الوكالة</span><br>${g.agency||'—'}</div>
                    </div>
                    <div class="actions">
                        <button class="badge badge-call" onclick="event.stopPropagation();location.href='tel:${g.phone}'">📞</button>
                        <button class="badge badge-wa" onclick="event.stopPropagation();window.open('https://wa.me/${(g.phone||'').replace(/[^0-9]/g,'')}')">💬</button>
                        <button class="badge badge-card" onclick="event.stopPropagation();shareCard('${g.id}')">🪪</button>
                        <button class="badge badge-edit" onclick="event.stopPropagation();editGuide('${g.id}')">✏️</button>
                        <button class="badge badge-del" onclick="event.stopPropagation();deleteGuide('${g.id}')">🗑️</button>
                    </div>
                </div>
            </div>
        `).join('');
    }

    window.toggleDetail = function(id) {
        document.getElementById('detail-'+id).classList.toggle('show');
    };

    // ==================== رفع الصور (محلي + Cloudinary اختياري) ====================
    function pickImage(previewId, setB64Callback) {
        const input = document.createElement('input'); input.type='file'; input.accept='image/*';
        input.onchange = async function(e) {
            const file = e.target.files[0]; if(!file) return;
            const b64 = await compressImage(file, 400, 0.5);
            document.getElementById(previewId).src = b64;
            document.getElementById(previewId).style.display = 'block';
            setB64Callback(b64);
            toast('✅ الصورة جاهزة (مضغوطة محلياً)');
        };
        input.click();
    }
    document.getElementById('guideUploadBtn').onclick = function() { pickImage('guidePreview', function(b64){ guidePhotoB64 = b64; }); };
    document.getElementById('busUploadBtn').onclick = function() { pickImage('busPreview', function(b64){ busPhotoB64 = b64; }); };

    // ==================== إضافة / تعديل ====================
    document.getElementById('addGuideBtn').onclick = function() {
        editId = null; guidePhotoB64 = ''; busPhotoB64 = '';
        ['gName','gPhone','gPlate','gTransport','gAgency','gNotes'].forEach(id=>document.getElementById(id).value='');
        document.getElementById('guidePreview').style.display='none'; document.getElementById('busPreview').style.display='none';
        document.getElementById('modalTitle').textContent = '➕ إضافة مرشد';
        document.getElementById('guideModal').classList.add('show');
    };
    document.getElementById('closeGuideBtn').onclick = function() { document.getElementById('guideModal').classList.remove('show'); };

    window.editGuide = function(id) {
        const g = guides.find(x=>x.id===id); if(!g) return;
        editId = id;
        document.getElementById('gName').value = g.name||'';
        document.getElementById('gPhone').value = g.phone||'';
        document.getElementById('gPlate').value = g.plateNumber||'';
        document.getElementById('gTransport').value = g.transportType||'';
        document.getElementById('gAgency').value = g.agency||'';
        document.getElementById('gNotes').value = g.notes||'';
        document.getElementById('gVisibility').value = g.visibility||'private';
        guidePhotoB64 = g.guidePhoto||''; busPhotoB64 = g.busPhoto||'';
        document.getElementById('guidePreview').src = guidePhotoB64; document.getElementById('guidePreview').style.display = guidePhotoB64?'block':'none';
        document.getElementById('busPreview').src = busPhotoB64; document.getElementById('busPreview').style.display = busPhotoB64?'block':'none';
        document.getElementById('modalTitle').textContent = '✏️ تعديل مرشد';
        document.getElementById('guideModal').classList.add('show');
    };

    window.deleteGuide = function(id) {
        if(!confirm('حذف؟')) return;
        guides = guides.filter(g => g.id !== id);
        LocalDB.saveGuides(guides);
        renderGuides();
        if(db && currentUser) db.collection('guides').doc(id).delete().catch(()=>{});
        toast('تم الحذف');
    };

    document.getElementById('saveGuideBtn').onclick = async function() {
        const name = document.getElementById('gName').value.trim();
        const phone = document.getElementById('gPhone').value.trim();
        if(!name||!phone) return toast('الاسم والهاتف مطلوبان');

        const data = {
            id: editId || 'local_' + Date.now(),
            userId: currentUser ? currentUser.uid : 'offline_user',
            creatorName: userProfile.displayName || (currentUser?currentUser.email:'مستخدم'),
            name, phone,
            plateNumber: document.getElementById('gPlate').value.trim(),
            guidePhoto: guidePhotoB64 || null,
            busPhoto: busPhotoB64 || null,
            transportType: document.getElementById('gTransport').value.trim(),
            agency: document.getElementById('gAgency').value.trim(),
            notes: document.getElementById('gNotes').value.trim(),
            visibility: document.getElementById('gVisibility').value,
            updatedAt: new Date().toISOString()
        };

        // حفظ محلي
        if(editId) {
            guides = guides.map(g => g.id === editId ? data : g);
        } else {
            guides.unshift(data);
        }
        LocalDB.saveGuides(guides);
        renderGuides();
        document.getElementById('guideModal').classList.remove('show');
        toast('✅ تم الحفظ محلياً');

        // مزامنة مع Firebase إن أمكن
        if(db && currentUser) {
            try {
                const docData = {...data};
                delete docData.id;
                if(editId && !editId.startsWith('local_')) {
                    await db.collection('guides').doc(editId).set(docData, {merge:true});
                } else {
                    const ref = await db.collection('guides').add(docData);
                    // تحديث المعرف المحلي
                    const idx = guides.findIndex(g => g.id === data.id);
                    if(idx >= 0) guides[idx].id = ref.id;
                    LocalDB.saveGuides(guides);
                }
                toast('✅ تمت المزامنة مع السحابة');
            } catch(e) {
                console.warn('Sync failed:', e);
            }
        }
    };

    // ==================== مشاركة البطاقة ====================
    window.shareCard = function(id) {
        const g = guides.find(x=>x.id===id); if(!g) return;
        const msg = `*${g.name}*\n📞 ${g.phone}\n🚐 ${g.transportType||''}\n🚍 ${g.plateNumber||''}\n🏢 ${g.agency||''}\n📝 ${g.notes||''}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    };

    // ==================== أحداث أخرى ====================
    document.getElementById('searchInput').oninput = renderGuides;
    document.getElementById('darkToggle').onclick = function() { document.body.classList.toggle('dark'); };
    document.getElementById('menuBtn').onclick = function() { toast('القائمة قيد التطوير'); };
    document.getElementById('syncBtn').onclick = function() {
        if(!db || !currentUser) return toast('يرجى تسجيل الدخول أولاً');
        toast('🔄 جاري المزامنة...');
        // مزامنة البيانات المحلية إلى السحابة
        guides.forEach(async (g) => {
            if(g.id.startsWith('local_')) {
                const data = {...g}; delete data.id;
                try {
                    const ref = await db.collection('guides').add(data);
                    g.id = ref.id;
                } catch(e) {}
            }
        });
        LocalDB.saveGuides(guides);
        renderGuides();
        toast('✅ تمت المزامنة');
    };
    document.getElementById('voiceSearchBtn').onclick = function() {
        if(!('webkitSpeechRecognition' in window)) return toast('غير مدعوم');
        const r = new webkitSpeechRecognition(); r.lang='ar-TN'; r.start();
        r.onresult = function(e) { document.getElementById('searchInput').value = e.results[0][0].transcript; renderGuides(); };
    };
    document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', function(e) { if(e.target===this) this.classList.remove('show'); }));

    renderGuides();
    console.log('✅ F‑Note Pro Max | Offline First | جاهز');
</script>
</body>
</html>
