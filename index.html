<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="theme-color" content="#e94560">
    <title>F-Note Pro Max</title>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-body: #f7f9fc; --bg-card: #ffffff; --text-primary: #1e293b; --text-secondary: #475569;
            --text-muted: #64748b; --border: #e2e8f0; --gold: #e94560; --success: #10b981; --whatsapp: #25D366;
            --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05); --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1);
            --card-olive: #556B2F; --card-gold: #D4AF37; --card-gold-light: #e8c456;
        }
        body.dark { --bg-body: #0f172a; --bg-card: #1e293b; --text-primary: #f1f5f9; --text-secondary: #e2e8f0; --text-muted: #94a3b8; --border: #475569; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: var(--bg-body); color: var(--text-primary); transition: background 0.2s, color 0.2s; padding-bottom: 20px; }
        body::before, body::after { content: ""; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; z-index: 0; pointer-events: none; }
        body::before { width: 280px; height: 280px; background: rgba(0,0,0,0.02); }
        body::after { width: 250px; height: 250px; background-image: url('https://i.ibb.co/ds6SXvq6/1778351155986-removebg-preview.png'); background-size: contain; background-repeat: no-repeat; background-position: center; opacity: 0.06; }
        body.dark::before { background: rgba(255,255,255,0.08); }
        body.dark::after { opacity: 0.12; }

        .app-header { background: var(--bg-card); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border); }
        .logo-header img { height: 44px; animation: logoBounce 2s ease-in-out infinite; }
        @keyframes logoBounce { 0%,100%{transform:scale(1)} 30%{transform:scale(1.06)} 60%{transform:scale(0.98)} }
        .header-btn { width: 38px; height: 38px; border-radius: 50%; background: transparent; border: 1px solid var(--border); cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 17px; transition: all 0.15s; }
        .header-btn:active { background: var(--gold); color: white; transform: scale(0.93); }

        .sidebar { position: fixed; top: 0; right: -100%; width: 280px; height: 100%; background: var(--bg-card); z-index: 1500; transition: right 0.3s ease; box-shadow: -4px 0 20px rgba(0,0,0,0.15); overflow-y: auto; }
        .sidebar.open { right: 0; }
        .sidebar-header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .sidebar-close { background: var(--bg-body); border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 18px; cursor: pointer; }
        .sidebar-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
        .sidebar-section h4 { font-size: 11px; color: var(--text-muted); margin-bottom: 10px; }
        .sidebar-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; border-radius: 14px; margin: 3px 0; font-size: 14px; color: var(--text-primary); }
        .sidebar-item:active { background: var(--bg-body); }
        .lang-row { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
        .lang-flag { flex: 1; padding: 6px 4px; text-align: center; border-radius: 20px; border: 1px solid var(--border); cursor: pointer; font-size: 11px; background: var(--bg-body); color: var(--text-primary); transition: all 0.2s; white-space: nowrap; }
        .lang-flag.active { background: var(--gold); color: white; border-color: var(--gold); }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(3px); z-index: 1400; visibility: hidden; opacity: 0; transition: 0.2s; }
        .overlay.show { visibility: visible; opacity: 1; }

        .toolbar { display: flex; gap: 10px; padding: 12px 16px; background: var(--bg-body); position: sticky; top: 64px; z-index: 90; }
        .search-box { flex: 1; padding: 11px 16px; border: 2px solid transparent; border-radius: 60px; background: var(--bg-card); color: var(--text-primary); font-size: 14px; }
        .search-box:focus { border-color: var(--gold); outline: none; }
        .voice-btn,.add-btn { width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer; font-size: 18px; }
        .voice-btn { background: var(--bg-card); color: var(--text-secondary); }
        .voice-btn.recording { background: #ef4444; color: white; animation: voicePulse 0.8s infinite; }
        @keyframes voicePulse { 0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.5)} 50%{box-shadow:0 0 0 14px rgba(239,68,68,0)} }
        .add-btn { background: var(--gold); color: white; font-size: 24px; }

        .guides-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
        .guide-card { background: var(--bg-card); border-radius: 20px; padding: 14px; box-shadow: var(--shadow-md); border-right: 4px solid var(--gold); cursor: pointer; }
        .guide-card:active { transform: scale(0.99); }
        .card-body { display: flex; align-items: center; gap: 12px; }
        .card-avatar { width: 56px; height: 56px; border-radius: 18px; object-fit: cover; border: 2px solid var(--gold); flex-shrink: 0; background: var(--bg-body); }
        .card-info { flex: 1; min-width: 0; }
        .card-name { font-weight: 800; font-size: 16px; color: var(--text-primary); }
        .card-phone { font-size: 13px; color: var(--gold); font-weight: 600; direction: ltr; display: inline-block; }
        .card-actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .btn-mini { padding: 5px 12px; border-radius: 20px; border: none; font-size: 11px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: all 0.1s; }
        .btn-mini:active { transform: scale(0.95); }
        .btn-wa { background: var(--whatsapp); color: white; }
        .btn-del-card { background: #ef4444; color: white; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1600; display: flex; align-items: center; justify-content: center; visibility: hidden; opacity: 0; transition: 0.2s; }
        .modal.show { visibility: visible; opacity: 1; }
        .modal-box { background: var(--bg-card); width: 90%; max-width: 600px; border-radius: 28px; padding: 24px; max-height: 88vh; overflow-y: auto; }
        .modal-box h3 { text-align: center; margin-bottom: 16px; color: var(--gold); font-size: 18px; }
        input, textarea, select { width: 100%; padding: 11px; margin: 6px 0; border: 2px solid var(--border); border-radius: 16px; background: var(--bg-body); color: var(--text-primary); font-size: 14px; }
        textarea { resize: vertical; }
        .btn-save, .btn-cancel { padding: 12px; border-radius: 16px; border: none; font-weight: 700; margin-top: 10px; cursor: pointer; width: 100%; font-size: 14px; }
        .btn-save { background: var(--success); color: white; }
        .btn-cancel { background: #64748b; color: white; }
        .upload-card { border: 2px dashed var(--card-gold); border-radius: 20px; padding: 12px; text-align: center; margin: 10px 0; cursor: pointer; }
        .toast { position: fixed; bottom: 30px; left: 20px; right: 20px; background: #1e293bcc; backdrop-filter: blur(10px); color: white; border-radius: 60px; padding: 12px 20px; text-align: center; z-index: 9999; font-size: 13px; animation: slideUp 0.3s; }
        @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
        .admin-badge { background: #e94560; padding: 2px 8px; border-radius: 40px; font-size: 10px; color: white; margin-right: 6px; }
        .loading-msg { text-align: center; padding: 40px; color: var(--text-muted); }
        .spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
        @keyframes spin { to{transform:rotate(360deg)} }

        /* بطاقة الوفد */
        .btn-olive { background: linear-gradient(135deg, var(--card-olive), #3d4d21); color: white; border: none; padding: 12px; border-radius: 16px; font-weight: 700; cursor: pointer; }
        .btn-gold { background: linear-gradient(135deg, var(--card-gold), var(--card-gold-light)); color: white; border: none; padding: 12px; border-radius: 16px; font-weight: 700; cursor: pointer; }
        #tcCard { background: white; border: 3px solid var(--card-gold); border-radius: 24px; padding: 20px; }
        body.dark #tcCard { background: #1e293b; }
        .weather-badge { display: inline-flex; align-items: center; gap: 4px; background: rgba(85,107,47,0.1); padding: 4px 10px; border-radius: 20px; font-size: 12px; }
    </style>
</head>
<body>

<div id="loginScreen" class="login-screen"><div class="login-card"><img src="https://i.ibb.co/ds6SXvq6/1778351155986-removebg-preview.png" alt="logo" class="logo-big"><div class="login-title">F-Note Pro Max</div><input type="email" id="loginEmail" placeholder="البريد الإلكتروني" dir="ltr"><input type="password" id="loginPassword" placeholder="كلمة المرور"><button class="login-btn" id="loginBtn">دخول</button><p class="error-msg" id="loginError"></p></div></div>

<div class="app-header"><div class="header-left"><button class="header-btn menu-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></button></div><div class="logo-header"><img src="https://i.ibb.co/ds6SXvq6/1778351155986-removebg-preview.png" alt="F-Note Pro"></div><div class="header-left"><button class="header-btn" id="darkModeBtn"><i class="fa-solid fa-moon"></i></button></div></div>
<div class="overlay" id="overlay"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-header"><h3 style="color:var(--gold);">✨ F-Note Pro Max</h3><button class="sidebar-close" id="closeSidebar">✕</button></div>
    <div class="sidebar-section"><h4>الحساب</h4><div id="userInfo"></div><div class="sidebar-item" id="profileBtn"><i class="fa-solid fa-user"></i> الملف الشخصي</div><div class="sidebar-item" id="signOutBtn" style="display:none;"><i class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج</div></div>
    <div class="sidebar-section" id="adminSection" style="display:none;"><h4>المدير</h4><div class="sidebar-item" id="createUserBtn"><i class="fa-solid fa-user-plus"></i> إنشاء حساب</div><div class="sidebar-item" id="manageUsersBtn"><i class="fa-solid fa-users-gear"></i> إدارة المستخدمين</div></div>
    <div class="sidebar-section"><h4>أدوات</h4><div class="sidebar-item" id="touristCardBtn"><i class="fa-solid fa-id-card"></i> بطاقة وفد سياحي</div></div>
    <div class="sidebar-section"><h4>الإعدادات</h4><div class="lang-row"><button class="lang-flag active" data-lang="ar">🇹🇳 عربي</button><button class="lang-flag" data-lang="fr">🇫🇷 Français</button></div></div>
</div>

<div id="pageGuides">
    <div class="toolbar"><input type="text" id="searchInput" class="search-box" placeholder="🔍 بحث عن مرشد أو وفد..."><button class="voice-btn" id="voiceSearchBtn"><i class="fa-solid fa-microphone"></i></button><button class="add-btn" id="addGuideBtn">+</button></div>
    <div id="guidesContainer" class="guides-list"><div class="loading-msg"><div class="spinner"></div><p>جاري التحميل...</p></div></div>
</div>

<!-- مودال بطاقة الوفد السياحي الجديدة -->
<div id="touristCardModal" class="modal">
    <div class="modal-box" style="max-width: 600px;">
        <div id="tcFormContainer">
            <h3 style="color: var(--card-olive);"><i class="fa-solid fa-id-card"></i> معلومات الوفد السياحي</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <div><label>عدد الأفراد *</label><input type="number" id="tcPeopleCount" min="1" value="1"></div>
                <div><label>الجنسية *</label><input type="text" id="tcNationality" placeholder="الجنسية"></div>
                <div><label>من *</label><input type="text" id="tcFrom" placeholder="نقطة الانطلاق"></div>
                <div><label>إلى *</label><input type="text" id="tcTo" placeholder="الوجهة"></div>
                <div><label>نوع النقل *</label><select id="tcTransport"><option value="">اختر</option><option>حافلة</option><option>سيارة</option><option>فان</option><option>طائرة</option><option>أخرى</option></select></div>
                <div><label>رقم اللوحة *</label><input type="text" id="tcPlate" placeholder="اللوحة"></div>
                <div><label>المرشد *</label><input type="text" id="tcGuideName" placeholder="الاسم"></div>
                <div><label>جوال المرشد *</label><input type="tel" id="tcGuidePhone" placeholder="05xxxxxxxx" dir="ltr"></div>
            </div>
            <div class="upload-card" id="tcImageUploadArea"><i class="fa-solid fa-cloud-arrow-up"></i> صورة الوفد *<input type="file" id="tcImageInput" accept="image/*" hidden></div>
            <div id="tcImagePreview" style="display:none;"><img id="tcPreviewImg" style="max-height:150px;border-radius:12px;"><button type="button" id="tcRemoveImage" style="color:red;">إزالة</button></div>
            <textarea id="tcNotes" maxlength="200" placeholder="ملاحظات (اختياري)"></textarea>
            <small id="tcCharCount">0 / 200</small>
            <div style="display:flex;gap:10px;margin-top:15px;">
                <button class="btn-olive" id="tcGenerateBtn"><i class="fa-solid fa-wand-magic-sparkles"></i> إنشاء البطاقة</button>
                <button class="btn-cancel" id="tcCloseBtn">إلغاء</button>
            </div>
        </div>
        <div id="tcPreviewContainer" style="display:none;">
            <div id="tcCard">
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
                    <img src="https://i.ibb.co/ds6SXvq6/1778351155986-removebg-preview.png" height="40">
                    <div><strong style="color:var(--card-olive);">F-Note Pro Max</strong><br><small style="color:var(--card-gold);">معلومات الوفد السياحي</small></div>
                    <div style="margin-right:auto;text-align:left;"><span id="tcWeatherBadge" class="weather-badge"></span><br><small id="tcCardDate" style="color:#666;"></small></div>
                </div>
                <img id="tcCardImage" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px;">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;">
                    <div><small>الأفراد</small><br><strong id="tcCardPeople"></strong></div>
                    <div><small>الجنسية</small><br><strong id="tcCardNationality"></strong></div>
                    <div><small>من</small><br><strong id="tcCardFrom"></strong></div>
                    <div><small>إلى</small><br><strong id="tcCardTo"></strong></div>
                    <div><small>النقل</small><br><strong id="tcCardTransport"></strong></div>
                    <div><small>اللوحة</small><br><strong id="tcCardPlate" dir="ltr"></strong></div>
                </div>
                <div style="display:flex;justify-content:space-between;background:#f9f9f9;padding:8px;border-radius:12px;">
                    <span><small>المرشد</small> <strong id="tcCardGuide"></strong></span>
                    <span dir="ltr"><small>📞</small> <strong id="tcCardPhone"></strong></span>
                </div>
                <div id="tcCardNotesBox" style="display:none;margin-top:8px;"><small>ملاحظات</small><p id="tcCardNotes"></p></div>
            </div>
            <div style="display:flex;gap:8px;margin-top:15px;">
                <button class="btn-gold" id="tcShareBtn"><i class="fa-brands fa-whatsapp"></i> مشاركة</button>
                <button class="btn-olive" id="tcDownloadBtn"><i class="fa-solid fa-download"></i> تحميل</button>
                <button class="btn-cancel" id="tcBackBtn">عودة</button>
            </div>
        </div>
    </div>
</div>

<script>
    // Firebase config
    const firebaseConfig = { apiKey: "AIzaSyC4vYbhHGfAWMSh-fRl4NlG1WiEyS6Ez9s", authDomain: "f-notepro-work-2d25b.firebaseapp.com", projectId: "f-notepro-work-2d25b", storageBucket: "f-notepro-work-2d25b.firebasestorage.app", messagingSenderId: "221438380381", appId: "1:221438380381:web:b46c35d0ec0944079480b4" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(), auth = firebase.auth();
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{});

    let currentUser = null, guides = [], userProfile = {}, isAdmin = false;

    function toast(msg, isError=false) {
        const t = document.createElement('div'); t.className='toast'; t.style.background = isError?'#ef4444cc':'#1e293bcc'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000);
    }

    // Auth
    document.getElementById('loginBtn').onclick = async () => {
        const email = document.getElementById('loginEmail').value.trim(), pw = document.getElementById('loginPassword').value;
        try { await auth.signInWithEmailAndPassword(email,pw); } catch(e) { toast('خطأ في الدخول',true); }
    };
    auth.onAuthStateChanged(async u => {
        if(u) { currentUser = u; isAdmin = u.email === 'fahmiajmi5@gmail.com'; document.getElementById('loginScreen').classList.add('hide'); document.getElementById('signOutBtn').style.display='flex'; document.getElementById('userInfo').innerHTML = `<strong>${u.email}</strong>${isAdmin?' <span class="admin-badge">👑</span>':''}`; if(isAdmin) document.getElementById('adminSection').style.display='block'; const d = await db.collection('users').doc(u.uid).get(); userProfile = d.exists ? d.data() : {}; loadNotes(); }
        else { currentUser = null; guides = []; renderNotes(); document.getElementById('loginScreen').classList.remove('hide'); }
    });
    document.getElementById('signOutBtn').onclick = ()=> auth.signOut();

    // تحميل الملاحظات (مرشدين + وفود)
    function loadNotes() {
        if(!currentUser) return;
        db.collection('guides').where('userId','==',currentUser.uid).onSnapshot(snap => {
            guides = []; snap.forEach(d => guides.push({id:d.id,...d.data()}));
            // نجلب الوفود العامة أيضاً
            db.collection('guides').where('visibility','==','public').get().then(pub => {
                pub.forEach(d => { if(d.data().userId !== currentUser.uid) guides.push({id:d.id,...d.data()}); });
                renderNotes();
            }).catch(()=> renderNotes());
        });
    }

    function renderNotes() {
        const q = (document.getElementById('searchInput')?.value||'').toLowerCase();
        let filtered = guides.filter(g => !q || (g.name||'').toLowerCase().includes(q) || (g.type||'').includes(q));
        const container = document.getElementById('guidesContainer');
        if(!filtered.length) { container.innerHTML = '<div class="loading-msg"><p>😕 لا توجد نتائج</p></div>'; return; }
        container.innerHTML = filtered.map(g => {
            const photo = g.image || g.guidePhoto || '';
            return `<div class="guide-card" style="border-right-color:${g.type==='delegation'?'var(--card-olive)':'var(--gold)'}">
                <div class="card-body">
                    <img class="card-avatar" src="${photo||'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2240%22 r=%2220%22 fill=%22%23ccc%22/></svg>'}" onerror="this.style.display='none'">
                    <div class="card-info"><div class="card-name">${g.name||'وفد'}</div><div class="card-phone">${g.phone||g.guidePhone||''}</div></div>
                </div>
                <div class="card-actions">
                    <button class="btn-mini btn-wa" onclick="event.stopPropagation();shareNoteWhatsApp('${g.id}')">واتساب</button>
                    ${g.userId===currentUser?.uid?`<button class="btn-mini btn-del-card" onclick="event.stopPropagation();deleteNote('${g.id}')">حذف</button>`:''}
                </div>
            </div>`;
        }).join('');
    }
    window.deleteNote = async id => { await db.collection('guides').doc(id).delete(); toast('تم الحذف'); };
    window.shareNoteWhatsApp = (id) => {
        const g = guides.find(x=>x.id===id); if(!g) return;
        const text = g.type==='delegation' ? 
            `*معلومات الوفد*\n👥 ${g.people||''}\n🌍 ${g.nationality||''}\n📍 ${g.from||''} ➔ ${g.to||''}\n🚌 ${g.transport||''}\n🔢 ${g.plate||''}\n👤 ${g.guide||''}\n📞 ${g.phone||''}\n📝 ${g.notes||''}` :
            `*مرشد*\n${g.name}\n📞 ${g.phone}`;
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank');
    };

    // ---- بطاقة الوفد الجديدة ----
    let tcImageData = null, tcGeneratedBlob = null;
    const modal = document.getElementById('touristCardModal');
    const formContainer = document.getElementById('tcFormContainer');
    const previewContainer = document.getElementById('tcPreviewContainer');

    // رفع الصورة
    document.getElementById('tcImageUploadArea').addEventListener('click', ()=> document.getElementById('tcImageInput').click());
    document.getElementById('tcImageInput').addEventListener('change', e => {
        const file = e.target.files[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = ev => { tcImageData = ev.target.result; document.getElementById('tcPreviewImg').src = tcImageData; document.getElementById('tcImagePreview').style.display='block'; };
        reader.readAsDataURL(file);
    });
    document.getElementById('tcRemoveImage').addEventListener('click', (e)=> {
        e.stopPropagation(); tcImageData = null; document.getElementById('tcImageInput').value=''; document.getElementById('tcImagePreview').style.display='none';
    });
    document.getElementById('tcNotes').addEventListener('input', function(){ document.getElementById('tcCharCount').textContent = this.value.length + ' / 200'; });

    // الطقس (Sfax)
    async function fetchWeather() {
        try {
            const resp = await fetch('https://api.open-meteo.com/v1/forecast?latitude=34.74&longitude=10.76&current_weather=true');
            const data = await resp.json();
            if(data.current_weather) {
                const temp = data.current_weather.temperature;
                const code = data.current_weather.weathercode;
                const isDay = data.current_weather.is_day;
                const icon = isDay ? '☀️' : '🌙';
                const desc = code <= 3 ? 'صافي' : (code <= 48 ? 'غائم' : 'ممطر');
                return `${icon} ${temp}°C ${desc}`;
            }
        } catch(e) {}
        const hour = new Date().getHours();
        return hour >=6 && hour <18 ? '☀️ نهار' : '🌙 ليل';
    }

    async function openCardModal() {
        tcImageData = null; document.getElementById('tcImageInput').value=''; document.getElementById('tcImagePreview').style.display='none';
        document.getElementById('tcCharCount').textContent = '0 / 200';
        document.querySelectorAll('#tcFormContainer input, #tcFormContainer select, #tcFormContainer textarea').forEach(el => el.value = '');
        document.getElementById('tcPeopleCount').value = 1;
        formContainer.style.display='block'; previewContainer.style.display='none';
        modal.classList.add('show');
    }

    document.getElementById('addGuideBtn').addEventListener('click', openCardModal);
    document.getElementById('touristCardBtn').addEventListener('click', openCardModal);
    document.getElementById('tcCloseBtn').addEventListener('click', ()=> modal.classList.remove('show'));

    document.getElementById('tcGenerateBtn').addEventListener('click', async () => {
        // تحقق
        const required = ['tcPeopleCount','tcNationality','tcFrom','tcTo','tcTransport','tcPlate','tcGuideName','tcGuidePhone'];
        for(let id of required) if(!document.getElementById(id).value.trim()) return toast('جميع الحقول المطلوبة', true);
        if(!tcImageData) return toast('صورة الوفد مطلوبة', true);

        // تعبئة المعاينة
        document.getElementById('tcCardPeople').textContent = document.getElementById('tcPeopleCount').value;
        document.getElementById('tcCardNationality').textContent = document.getElementById('tcNationality').value;
        document.getElementById('tcCardFrom').textContent = document.getElementById('tcFrom').value;
        document.getElementById('tcCardTo').textContent = document.getElementById('tcTo').value;
        document.getElementById('tcCardTransport').textContent = document.getElementById('tcTransport').value;
        document.getElementById('tcCardPlate').textContent = document.getElementById('tcPlate').value;
        document.getElementById('tcCardGuide').textContent = document.getElementById('tcGuideName').value;
        document.getElementById('tcCardPhone').textContent = document.getElementById('tcGuidePhone').value;
        document.getElementById('tcCardImage').src = tcImageData;
        const notes = document.getElementById('tcNotes').value.trim();
        if(notes) { document.getElementById('tcCardNotes').textContent = notes; document.getElementById('tcCardNotesBox').style.display='block'; }
        else document.getElementById('tcCardNotesBox').style.display='none';

        const now = new Date();
        document.getElementById('tcCardDate').textContent = now.toLocaleDateString('ar-TN',{year:'numeric',month:'long',day:'numeric'}) + ' - ' + now.toLocaleTimeString('ar-TN',{hour:'2-digit',minute:'2-digit'});
        document.getElementById('tcWeatherBadge').textContent = await fetchWeather();

        formContainer.style.display='none'; previewContainer.style.display='block';
    });

    document.getElementById('tcBackBtn').addEventListener('click', ()=> { previewContainer.style.display='none'; formContainer.style.display='block'; });

    // توليد blob للصورة
    async function getCardBlob() {
        const canvas = await html2canvas(document.getElementById('tcCard'), {scale:2, backgroundColor:'#ffffff'});
        return new Promise(res => canvas.toBlob(res, 'image/png'));
    }

    // حفظ النوت
    async function saveDelegationNote() {
        const data = {
            userId: currentUser.uid,
            type: 'delegation',
            name: `وفد ${document.getElementById('tcNationality').value}`,
            people: document.getElementById('tcPeopleCount').value,
            nationality: document.getElementById('tcNationality').value,
            from: document.getElementById('tcFrom').value,
            to: document.getElementById('tcTo').value,
            transport: document.getElementById('tcTransport').value,
            plate: document.getElementById('tcPlate').value,
            guide: document.getElementById('tcGuideName').value,
            phone: document.getElementById('tcGuidePhone').value,
            guidePhone: document.getElementById('tcGuidePhone').value,
            notes: document.getElementById('tcNotes').value.trim(),
            image: tcImageData,
            weather: await fetchWeather(),
            createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            visibility: 'private'
        };
        await db.collection('guides').add(data);
    }

    document.getElementById('tcDownloadBtn').addEventListener('click', async ()=>{
        const blob = await getCardBlob();
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'بطاقة_وفد.png'; a.click();
        toast('تم التحميل');
        await saveDelegationNote();
    });

    document.getElementById('tcShareBtn').addEventListener('click', async ()=>{
        const blob = await getCardBlob();
        const file = new File([blob], 'بطاقة_وفد.png', {type:'image/png'});
        const text = `*معلومات الوفد*\n👥 ${document.getElementById('tcPeopleCount').value}\n🌍 ${document.getElementById('tcNationality').value}\n📍 ${document.getElementById('tcFrom').value} ➔ ${document.getElementById('tcTo').value}\n🚌 ${document.getElementById('tcTransport').value}\n🔢 ${document.getElementById('tcPlate').value}\n👤 ${document.getElementById('tcGuideName').value}\n📞 ${document.getElementById('tcGuidePhone').value}\n📝 ${document.getElementById('tcNotes').value}`;
        if(navigator.canShare && navigator.canShare({files:[file]})) {
            try { await navigator.share({files:[file], text}); } catch(e) { if(e.name!=='AbortError') toast('تعذرت المشاركة',true); }
        } else {
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'بطاقة_وفد.png'; a.click();
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank');
        }
        await saveDelegationNote();
    });

    // باقي الأحداث
    document.getElementById('menuBtn').onclick = ()=> { document.getElementById('sidebar').classList.add('open'); document.getElementById('overlay').classList.add('show'); };
    document.getElementById('closeSidebar').onclick = ()=> { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); };
    document.getElementById('overlay').onclick = ()=> { document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); };
    document.getElementById('darkModeBtn').onclick = ()=> { document.body.classList.toggle('dark'); };
    document.getElementById('searchInput').oninput = renderNotes;
    document.getElementById('voiceSearchBtn').onclick = ()=>{
        if(!('webkitSpeechRecognition' in window)) return toast('غير مدعوم',true);
        const r = new webkitSpeechRecognition(); r.lang='ar-TN'; r.interimResults=false;
        document.getElementById('voiceSearchBtn').classList.add('recording');
        r.start();
        r.onresult = e => { document.getElementById('searchInput').value = e.results[0][0].transcript; renderNotes(); };
        r.onerror = r.onend = ()=> document.getElementById('voiceSearchBtn').classList.remove('recording');
    };
    document.getElementById('profileBtn').onclick = ()=> toast('الملف الشخصي قيد التطوير');
    document.querySelectorAll('.modal').forEach(m=> m.addEventListener('click', function(e){ if(e.target===this) this.classList.remove('show'); }));
    document.getElementById('loginPassword').addEventListener('keydown', e=> { if(e.key==='Enter') document.getElementById('loginBtn').click(); });
</script>
</body>
</html>
