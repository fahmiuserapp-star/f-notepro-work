<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>F-NOTEPRO WORK | بطاقة المرشد السياحي</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --olive: #556B2F; --gold: #D4AF37; --bg: #f5f7fa; --card: #fff; --txt: #1e293b;
            --txt2: #475569; --txt3: #94a3b8; --border: #e2e8f0; --err: #ef4444; --ok: #10b981; --wa: #25D366;
        }
        .dark { --bg: #0f172a; --card: #1e293b; --txt: #f1f5f9; --txt2: #cbd5e1; --txt3: #64748b; --border: #334155; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
        body { background:var(--bg); color:var(--txt); min-height:100vh; transition:0.2s; }
        @media(min-width:768px) { body { max-width:520px; margin:auto; border-left:1px solid var(--border); border-right:1px solid var(--border); } }
        button { cursor:pointer; border:none; background:none; transition:0.15s; }
        button:active { transform:scale(0.96); }
        input, textarea, select { width:100%; padding:12px; border:2px solid var(--border); border-radius:14px; background:var(--bg); color:var(--txt); font-size:14px; outline:none; margin:5px 0; }
        textarea { resize:vertical; min-height:70px; }
        .header { background:var(--card); padding:10px 14px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50; border-bottom:1px solid var(--border); }
        .logo-area { display:flex; align-items:center; gap:8px; }
        .logo-area img { height:38px; }
        .logo-text { font-weight:800; font-size:18px; color:var(--olive); }
        .h-btn { width:38px; height:38px; border-radius:50%; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; background:var(--card); }
        .header-actions { display:flex; gap:8px; }
        .header-actions button { padding:8px 14px; border-radius:12px; font-weight:700; font-size:14px; display:flex; align-items:center; gap:6px; }
        .save-btn { background:var(--olive); color:white; }
        .back-btn { background:var(--err); color:white; }

        /* Weather Widget */
        .weather-widget {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }
        .weather-left { display: flex; align-items: center; gap: 8px; }
        .weather-icon { font-size: 28px; color: var(--gold); }
        .temp { font-weight: 700; color: var(--txt); }
        .time-right { text-align: left; direction: ltr; }
        .current-time { font-size: 28px; font-weight: 800; color: var(--olive); line-height: 1; }
        .current-date { font-size: 12px; color: var(--txt3); margin-top: 2px; }

        /* Tourist Card */
        #touristCard { background:#fff; border-radius:20px; padding:20px; border:3px solid var(--gold); position:relative; overflow:hidden; color:#1e293b; }
        .stripe-top, .stripe-bottom { position:absolute; left:0; width:100%; height:5px; }
        .stripe-top { top:0; background:linear-gradient(90deg, var(--olive), var(--gold)); }
        .stripe-bottom { bottom:0; background:linear-gradient(90deg, var(--gold), var(--olive)); }
        .card-image-section { position:relative; margin-bottom:16px; }
        .main-bus-image { width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:14px; background:#e5e7eb; display:block; }
        .guide-mini-overlay { position:absolute; bottom:-15px; right:12px; width:60px; height:60px; border-radius:50%; border:3px solid white; box-shadow:0 3px 10px rgba(0,0,0,0.25); overflow:hidden; background:var(--card); }
        .guide-mini-overlay img { width:100%; height:100%; object-fit:cover; }
        .guide-mini-overlay .default-avatar { width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#d1d5db; color:#6b7280; font-size:28px; }
        .info-box { background:#f9fafb; border-radius:12px; padding:12px; border:1px solid #e5e7eb; }
        .info-box .label { font-size:10px; color:#6b7280; margin-bottom:4px; }
        .info-box .value { font-weight:800; color:var(--olive); font-size:15px; }
        .plate-display { background:#1e293b; color:white; border-radius:8px; padding:6px 10px; display:flex; align-items:center; justify-content:center; gap:4px; font-weight:800; direction:ltr; cursor:pointer; }
        .plate-display .plate-num { background:white; color:#1e293b; padding:3px 8px; border-radius:4px; }

        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(4px); z-index:300; display:flex; align-items:center; justify-content:center; visibility:hidden; opacity:0; transition:0.2s; }
        .modal.show { visibility:visible; opacity:1; }
        .modal-box { background:var(--card); border-radius:24px; padding:24px; width:92%; max-width:500px; max-height:88vh; overflow-y:auto; position:relative; }
        .modal-box .close-btn { position:absolute; top:12px; right:12px; font-size:22px; color:var(--txt2); cursor:pointer; }
        .btn-primary { background:var(--olive); color:white; padding:14px; border-radius:14px; font-weight:700; font-size:16px; }
        .toast { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); background:#1e293b; color:white; padding:10px 24px; border-radius:30px; font-size:13px; z-index:999; }
        .avatar { width:52px; height:52px; border-radius:14px; object-fit:cover; border:2px solid var(--olive); background:var(--bg); }
        .c-btn { padding:6px 12px; border-radius:20px; font-size:11px; font-weight:700; color:white; }
        .c-call { background:var(--ok); } .c-wa { background:var(--wa); } .c-card { background:var(--olive); } .c-edit { background:#f59e0b; } .c-del { background:var(--err); }
    </style>
</head>
<body>

<!-- Login Screen -->
<div id="loginScreen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;">
    <div style="background:var(--card);border-radius:24px;padding:32px;max-width:380px;width:100%;text-align:center;">
        <img src="https://i.ibb.co/ds6SXvq6/1778351155986-removebg-preview.png" style="width:80px;margin-bottom:16px;">
        <h1 style="color:var(--olive);font-weight:800;">F‑NOTEPRO WORK</h1>
        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" dir="ltr">
        <input type="password" id="loginPassword" placeholder="كلمة المرور">
        <button id="loginBtn" style="width:100%;padding:14px;background:var(--olive);color:white;border-radius:14px;font-weight:700;font-size:16px;margin-top:12px;">دخول</button>
        <button id="offlineBtn" style="width:100%;padding:14px;background:var(--txt3);color:white;border-radius:14px;font-weight:700;margin-top:8px;">🔄 بدون إنترنت</button>
    </div>
</div>

<!-- Main App -->
<div id="appContainer" style="display:none;">
    <div class="header">
        <div class="logo-area"><img src="https://i.ibb.co/ds6SXvq6/1778351155986-removebg-preview.png"><span class="logo-text">F‑NOTEPRO WORK</span></div>
        <div style="display:flex;gap:8px;">
            <div class="header-actions" id="headerActions" style="display:none;">
                <button class="back-btn" id="headerBackBtn"><i class="fa-solid fa-arrow-right"></i> رجوع</button>
                <button class="save-btn" id="headerSaveBtn"><i class="fa-solid fa-check"></i> حفظ</button>
            </div>
            <button class="h-btn" id="darkToggle"><i class="fa-solid fa-moon"></i></button>
            <button class="h-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
        </div>
    </div>

    <!-- Weather & Time Widget -->
    <div class="weather-widget" id="weatherWidget">
        <div class="weather-left">
            <span class="weather-icon" id="weatherIcon">☀️</span>
            <span class="temp" id="weatherTemp">--°</span>
        </div>
        <div class="time-right">
            <div class="current-time" id="currentTime">00:00</div>
            <div class="current-date" id="currentDate">السبت، 13 ماي</div>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="overlay" id="overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:150;display:none;"></div>
    <div class="sidebar" id="sidebar" style="position:fixed;top:0;right:-320px;width:280px;height:100%;background:var(--card);z-index:200;transition:0.3s;padding:20px;box-shadow:-4px 0 20px rgba(0,0,0,0.2);">
        <span id="sidebarCloseBtn" style="position:absolute;top:12px;left:12px;font-size:20px;cursor:pointer;">&times;</span>
        <h2>F‑NOTEPRO WORK</h2>
        <div id="sidebarUserInfo" style="font-size:12px;color:var(--txt3);margin-bottom:12px;"></div>
        <div class="s-item" id="editProfileBtn"><i class="fa-solid fa-user-pen"></i> تعديل الملف</div>
        <div class="s-item" id="signOutBtn"><i class="fa-solid fa-right-from-bracket"></i> خروج</div>
        <div class="s-item" id="syncBtn"><i class="fa-solid fa-cloud-arrow-up"></i> مزامنة</div>
        <div class="s-item" id="exportPdfBtn"><i class="fa-solid fa-file-pdf"></i> تصدير PDF</div>
        <div class="s-item" id="backupBtn"><i class="fa-solid fa-floppy-disk"></i> نسخ احتياطي</div>
        <div class="s-item" id="restoreBtn"><i class="fa-solid fa-upload"></i> استيراد</div>
        <div class="s-item" id="setPinBtn"><i class="fa-solid fa-lock"></i> تغيير PIN</div>
    </div>

    <!-- Toolbar -->
    <div style="display:flex;gap:8px;padding:10px 14px;background:var(--bg);position:sticky;top:58px;z-index:40;">
        <input type="text" id="searchInput" placeholder="🔍 بحث عن مرشد..." style="flex:1;border-radius:60px;">
        <button class="t-btn accent" id="addGuideBtn" style="width:42px;height:42px;border-radius:50%;background:var(--olive);color:white;font-size:22px;">+</button>
    </div>

    <!-- Guides List -->
    <div id="guidesContainer" style="padding:10px 14px;display:flex;flex-direction:column;gap:10px;padding-bottom:80px;"></div>
</div>

<!-- Add/Edit Guide Modal -->
<div class="modal" id="guideModal">
    <div class="modal-box">
        <div class="close-btn" id="closeGuideBtn2">&times;</div>
        <h3 id="modalTitle" style="color:var(--olive);text-align:center;">➕ إضافة مرشد</h3>
        <input type="text" id="gName" placeholder="اسم المرشد *">
        <input type="tel" id="gPhone" placeholder="رقم الهاتف *" dir="ltr">
        <div style="display:flex;gap:6px;"><input type="text" id="gNationality" placeholder="الجنسية" style="flex:1"><input type="number" id="gPeopleCount" placeholder="عدد الأفراد" style="flex:1" min="1"></div>
        <select id="gTransport"><option value="">نوع النقل</option><option value="حافلة كبيرة">حافلة كبيرة</option><option value="حافلة صغيرة">حافلة صغيرة</option><option value="ميكروبيس">ميكروبيس</option><option value="سيارة">سيارة</option><option value="باخرة">باخرة</option></select>

        <div id="tunisiaPlateSection"><label style="font-size:12px;">🇹🇳 اللوحة التونسية</label>
            <div style="display:flex;align-items:center;gap:6px;"><input type="text" id="gPlate1" placeholder="XXXXX" style="flex:2;text-align:center;" maxlength="5"><span>تونس</span><input type="text" id="gPlate2" placeholder="XXX" style="flex:1;text-align:center;" maxlength="3"></div>
        </div>
        <div id="foreignPlateSection" style="display:none;"><label style="font-size:12px;">🌍 لوحة أجنبية</label><input type="text" id="gForeignPlate" placeholder="أدخل رقم اللوحة الأجنبية كاملاً"></div>
        <button id="togglePlateBtn" style="background:var(--gold);color:white;border-radius:14px;padding:6px 12px;font-size:12px;margin:4px 0;">🔄 تبديل إلى لوحة أجنبية</button>

        <div style="display:flex;gap:6px;"><input type="text" id="gFrom" placeholder="من" style="flex:1"><input type="text" id="gTo" placeholder="إلى" style="flex:1"></div>
        <input type="datetime-local" id="gTripDate">

        <div class="upload-area" id="busUploadBtn" style="border:2px dashed var(--olive);border-radius:16px;padding:14px;text-align:center;margin:8px 0;cursor:pointer;"><i class="fa-solid fa-bus"></i> 🚌 صورة وسيلة النقل <img id="busPreview" style="display:none;width:50px;height:50px;border-radius:8px;margin-top:6px;"></div>
        <div class="upload-area" id="guideUploadBtn" style="border:2px dashed var(--gold);border-radius:16px;padding:14px;text-align:center;margin:8px 0;cursor:pointer;"><i class="fa-solid fa-image"></i> 📸 صورة المرشد <img id="guidePreview" style="display:none;width:50px;height:50px;border-radius:50%;margin-top:6px;"></div>

        <input type="text" id="gAgency" placeholder="الوكالة">
        <div style="display:flex;gap:6px;"><textarea id="gPublicSummary" placeholder="ملخص عام" style="flex:1;"></textarea><button id="autoSummaryBtn" style="background:var(--gold);color:white;border-radius:14px;padding:8px;">إنشاء ملخص</button></div>
        <button class="btn-primary" id="saveGuideBtn" style="margin-top:10px;">💾 حفظ المرشد</button>
    </div>
</div>

<!-- Card Modal -->
<div class="modal" id="cardModal">
    <div class="modal-box" style="max-width:550px; background:#f3f4f6;">
        <div class="close-btn" id="closeCardBtn2">&times;</div>
        <div id="touristCard">
            <div class="stripe-top"></div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                <div><h4 style="color:var(--olive);">F‑NOTEPRO WORK</h4><span style="font-size:10px;color:var(--gold);">بطاقة سائح سياحية</span></div>
                <span id="cardDate" style="font-size:12px;"></span>
            </div>
            <div class="card-image-section">
                <img id="cardMainImage" class="main-bus-image" src="" alt="صورة النقل">
                <div class="guide-mini-overlay" id="cardAvatarOverlay">
                    <img id="cardGuideAvatar" src="" style="display:none;" alt="المرشد">
                    <div class="default-avatar" id="defaultAvatar"><i class="fa-solid fa-user"></i></div>
                </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <div class="info-box"><span class="label">عدد الأفراد</span><br><span class="value" id="cardPeopleCount"></span></div>
                <div class="info-box"><span class="label">الجنسية</span><br><span class="value" id="cardNationality"></span></div>
                <div class="info-box"><span class="label">النقل</span><br><span class="value" id="cardTransport"></span></div>
                <div class="info-box" onclick="showPlateInfo()" style="cursor:pointer;">
                    <span class="label">رقم اللوحة</span><br>
                    <div class="plate-display" id="cardPlateDisplay"><span class="plate-num" id="cardPlate1"></span><span style="color:var(--gold);margin:0 3px;">تونس</span><span class="plate-num" id="cardPlate2"></span></div>
                </div>
                <div class="info-box"><span class="label">من</span><br><span class="value" id="cardFrom"></span></div>
                <div class="info-box"><span class="label">إلى</span><br><span class="value" id="cardTo"></span></div>
            </div>
            <div class="info-box" style="margin-top:8px;background:#f0fdf4;"><span class="label">المرشد</span><br><span class="value" id="cardGuideName"></span> | <span class="value" id="cardGuidePhone" dir="ltr"></span></div>
            <div class="stripe-bottom"></div>
        </div>
        <div style="display:flex;gap:6px;margin-top:12px;">
            <button id="shareCardBtn" style="flex:1;background:#25D366;padding:12px;border-radius:14px;color:white;font-weight:700;"><i class="fas fa-share-alt"></i> مشاركة</button>
            <button id="whatsappCardBtn" style="flex:1;background:#25D366;padding:12px;border-radius:14px;color:white;font-weight:700;"><i class="fab fa-whatsapp"></i> واتساب</button>
            <button id="directionsBtn" style="flex:1;background:var(--olive);padding:12px;border-radius:14px;color:white;font-weight:700;"><i class="fa-solid fa-map"></i> اتجاهات</button>
        </div>
    </div>
</div>

<script>
    // Firebase
    firebase.initializeApp({apiKey:"AIzaSyB3c1RP9ZZGC25BepSCxZYJ31okyBpdoEo",authDomain:"f-notepromax-work.firebaseapp.com",projectId:"f-notepromax-work",storageBucket:"f-notepromax-work.firebasestorage.app",messagingSenderId:"125749698617",appId:"1:125749698617:web:ff9709a863fd5a5053ede8"});
    const db = firebase.firestore();
    const auth = firebase.auth();
    db.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    const IMGBB_KEY = "4e65916ca5e764d97e1f5348c6515666";

    const LDB = {
        get(k) { try { return JSON.parse(localStorage.getItem('fnote_'+k)); } catch { return null; } },
        set(k,v) { localStorage.setItem('fnote_'+k, JSON.stringify(v)); },
        getGuides() { return this.get('guides') || []; },
        saveGuides(arr) { this.set('guides', arr); },
        getPin() { return this.get('appPin') || '0000'; },
        setPin(p) { this.set('appPin', p); }
    };

    let currentUser = null, guides = LDB.getGuides(), editGuideId = null;
    let busPhotoUrl = '', guidePhotoUrl = '';
    let isForeignPlate = false;

    function toast(m) { const e=document.createElement('div'); e.className='toast'; e.textContent=m; document.body.appendChild(e); setTimeout(()=>e.remove(),2500); }

    // رفع الصور
    async function uploadImg(file) {
        const blob = await new Promise(res => {
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const c = document.createElement('canvas'); let w=img.width, h=img.height;
                    if(w>400){ h*=400/w; w=400; } c.width=w; c.height=h;
                    c.getContext('2d').drawImage(img,0,0,w,h);
                    c.toBlob(bl=>res(bl), 'image/jpeg', 0.6);
                }; img.src=e.target.result;
            }; reader.readAsDataURL(file);
        });
        const fd = new FormData(); fd.append('image', blob);
        const resp = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {method:'POST',body:fd});
        const json = await resp.json();
        if(json.success) return json.data.url;
        throw new Error('فشل الرفع');
    }
    function pickImg(previewId, setUrl) {
        const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*';
        inp.onchange = async e => {
            const file = e.target.files[0]; if(!file) return;
            document.getElementById(previewId).src = URL.createObjectURL(file);
            document.getElementById(previewId).style.display='block';
            try { const url = await uploadImg(file); setUrl(url); toast('✅ تم رفع الصورة'); } catch { toast('❌ خطأ'); }
        }; inp.click();
    }

    // Auth
    auth.onAuthStateChanged(u => {
        if(u) { currentUser = u; document.getElementById('loginScreen').style.display='none'; document.getElementById('appContainer').style.display='block'; document.getElementById('sidebarUserInfo').textContent = u.email; loadFromCloud(); }
    });
    document.getElementById('loginBtn').onclick = () => auth.signInWithEmailAndPassword(loginEmail.value, loginPassword.value).catch(e=>toast(e.message));
    document.getElementById('offlineBtn').onclick = () => { currentUser={uid:'offline'}; document.getElementById('loginScreen').style.display='none'; document.getElementById('appContainer').style.display='block'; guides=LDB.getGuides(); renderGuides(); };
    document.getElementById('signOutBtn').onclick = () => auth.signOut();

    async function loadFromCloud() {
        const snap = await db.collection('guides').where('userId','==',currentUser.uid).get();
        let cloud = []; snap.forEach(d => cloud.push({id:d.id,...d.data()}));
        guides = [...cloud, ...LDB.getGuides().filter(l=>!cloud.find(c=>c.id===l.id))];
        LDB.saveGuides(guides); renderGuides();
    }

    // Sidebar
    document.getElementById('menuBtn').onclick = () => { document.getElementById('sidebar').style.right='0'; document.getElementById('overlay').style.display='block'; };
    document.getElementById('sidebarCloseBtn').onclick = () => { document.getElementById('sidebar').style.right='-320px'; document.getElementById('overlay').style.display='none'; };
    document.getElementById('overlay').onclick = () => { document.getElementById('sidebar').style.right='-320px'; document.getElementById('overlay').style.display='none'; };

    // Toggle plate
    document.getElementById('togglePlateBtn').onclick = () => {
        isForeignPlate = !isForeignPlate;
        document.getElementById('tunisiaPlateSection').style.display = isForeignPlate ? 'none' : 'block';
        document.getElementById('foreignPlateSection').style.display = isForeignPlate ? 'block' : 'none';
        document.getElementById('togglePlateBtn').textContent = isForeignPlate ? '🔄 تبديل إلى لوحة تونسية' : '🔄 تبديل إلى لوحة أجنبية';
    };

    // Upload buttons
    document.getElementById('busUploadBtn').onclick = () => pickImg('busPreview', url=>busPhotoUrl=url);
    document.getElementById('guideUploadBtn').onclick = () => pickImg('guidePreview', url=>guidePhotoUrl=url);

    // Save guide
    document.getElementById('saveGuideBtn').onclick = async () => {
        const name = document.getElementById('gName').value.trim();
        const phone = document.getElementById('gPhone').value.trim();
        if(!name||!phone) return toast('الاسم والهاتف مطلوبان');
        const data = {
            id: editGuideId || 'local_'+Date.now(), userId: currentUser?.uid||'offline', name, phone,
            nationality: document.getElementById('gNationality').value.trim(),
            peopleCount: document.getElementById('gPeopleCount').value,
            transportType: document.getElementById('gTransport').value,
            plate1: isForeignPlate ? '' : document.getElementById('gPlate1').value.trim(),
            plate2: isForeignPlate ? '' : document.getElementById('gPlate2').value.trim(),
            foreignPlate: isForeignPlate ? document.getElementById('gForeignPlate').value.trim() : '',
            isForeignPlate,
            fromLocation: document.getElementById('gFrom').value.trim(),
            toLocation: document.getElementById('gTo').value.trim(),
            tripDate: document.getElementById('gTripDate').value,
            busPhoto: busPhotoUrl, guidePhoto: guidePhotoUrl,
            agency: document.getElementById('gAgency').value.trim(),
            publicSummary: document.getElementById('gPublicSummary').value.trim(),
            updatedAt: new Date().toISOString()
        };
        if(editGuideId) guides = guides.map(g=>g.id===editGuideId?data:g);
        else guides.unshift(data);
        LDB.saveGuides(guides); renderGuides();
        document.getElementById('guideModal').classList.remove('show');
    };

    // Show card
    function showCard(id) {
        const g = guides.find(x=>x.id===id); if(!g) return;
        document.getElementById('cardMainImage').src = g.busPhoto || '';
        document.getElementById('cardMainImage').onerror = function() { this.src = ''; this.style.background = '#d1d5db'; };
        if(g.guidePhoto) {
            document.getElementById('cardGuideAvatar').src = g.guidePhoto;
            document.getElementById('cardGuideAvatar').style.display = 'block';
            document.getElementById('defaultAvatar').style.display = 'none';
        } else {
            document.getElementById('cardGuideAvatar').style.display = 'none';
            document.getElementById('defaultAvatar').style.display = 'flex';
        }
        document.getElementById('cardPeopleCount').textContent = g.peopleCount||'—';
        document.getElementById('cardNationality').textContent = g.nationality||'—';
        document.getElementById('cardTransport').textContent = g.transportType||'—';
        document.getElementById('cardFrom').textContent = g.fromLocation||'—';
        document.getElementById('cardTo').textContent = g.toLocation||'—';
        document.getElementById('cardGuideName').textContent = g.name||'—';
        document.getElementById('cardGuidePhone').textContent = g.phone||'—';
        document.getElementById('cardDate').textContent = new Date().toLocaleDateString('ar-TN');
        const plateDisplay = document.getElementById('cardPlateDisplay');
        if(g.isForeignPlate && g.foreignPlate) {
            plateDisplay.innerHTML = `<span style="background:white;color:#1e293b;padding:3px 8px;border-radius:4px;">${g.foreignPlate}</span><span style="color:var(--gold);margin:0 4px;">🌍</span>`;
        } else {
            plateDisplay.innerHTML = `<span class="plate-num">${g.plate1||'—'}</span><span style="color:var(--gold);margin:0 3px;">تونس</span><span class="plate-num">${g.plate2||'—'}</span>`;
        }
        document.getElementById('cardModal').classList.add('show');
        document.getElementById('headerActions').style.display='flex';
        document.getElementById('whatsappCardBtn').onclick = () => {
            const msg = `*بطاقة سائح*\nالاسم: ${g.name}\nالهاتف: ${g.phone}\nالنقل: ${g.transportType}\nمن: ${g.fromLocation} إلى: ${g.toLocation}`;
            window.open(`https://wa.me/${(g.phone||'').replace(/[^0-9]/g,'')}?text=${encodeURIComponent(msg)}`);
        };
        document.getElementById('directionsBtn').onclick = () => window.open(`https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(g.fromLocation)}&destination=${encodeURIComponent(g.toLocation)}`);
    }

    document.getElementById('shareCardBtn').onclick = async () => {
        const canvas = await html2canvas(document.getElementById('touristCard'),{scale:2,backgroundColor:'#ffffff',useCORS:true});
        const blob = await new Promise(r=>canvas.toBlob(r,'image/png'));
        const file = new File([blob],'بطاقة_سائح.png',{type:'image/png'});
        if(navigator.share && navigator.canShare({files:[file]})) await navigator.share({files:[file]});
        else { const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='بطاقة_سائح.png'; a.click(); }
    };

    document.getElementById('closeCardBtn2').onclick = () => { document.getElementById('cardModal').classList.remove('show'); document.getElementById('headerActions').style.display='none'; };
    document.getElementById('headerBackBtn').onclick = () => { document.querySelectorAll('.modal.show').forEach(m=>m.classList.remove('show')); document.getElementById('headerActions').style.display='none'; };
    document.getElementById('headerSaveBtn').onclick = () => document.getElementById('saveGuideBtn').click();

    // Render guides
    function renderGuides() {
        document.getElementById('guidesContainer').innerHTML = guides.map(g => `
            <div style="background:var(--card);border-radius:18px;padding:12px;display:flex;gap:10px;align-items:center;border:1px solid var(--border);">
                <img class="avatar" src="${g.busPhoto||g.guidePhoto||''}" onerror="this.style.display='none'" style="flex-shrink:0;">
                <div style="flex:1;"><div style="font-weight:800;">${g.name||''}</div><div style="color:var(--olive);direction:ltr;">📞 ${g.phone}</div></div>
                <div style="display:flex;gap:4px;">
                    <button class="c-btn c-call" onclick="location.href='tel:${g.phone}'">📞</button>
                    <button class="c-btn c-wa" onclick="window.open('https://wa.me/${(g.phone||'').replace(/[^0-9]/g,'')}')">💬</button>
                    <button class="c-btn c-card" onclick="showCard('${g.id}')">🪪</button>
                    <button class="c-btn c-edit" onclick="editGuide('${g.id}')">✏️</button>
                </div>
            </div>`).join('');
    }

    function editGuide(id) {
        const g = guides.find(x=>x.id===id); if(!g) return;
        editGuideId = id;
        document.getElementById('gName').value=g.name||''; document.getElementById('gPhone').value=g.phone||'';
        document.getElementById('gNationality').value=g.nationality||'';
        document.getElementById('gPeopleCount').value=g.peopleCount||'';
        document.getElementById('gTransport').value=g.transportType||'';
        document.getElementById('gPlate1').value=g.plate1||''; document.getElementById('gPlate2').value=g.plate2||'';
        document.getElementById('gForeignPlate').value=g.foreignPlate||'';
        isForeignPlate = g.isForeignPlate || false;
        document.getElementById('tunisiaPlateSection').style.display = isForeignPlate?'none':'block';
        document.getElementById('foreignPlateSection').style.display = isForeignPlate?'block':'none';
        document.getElementById('togglePlateBtn').textContent = isForeignPlate?'🔄 تبديل إلى لوحة تونسية':'🔄 تبديل إلى لوحة أجنبية';
        document.getElementById('gFrom').value=g.fromLocation||''; document.getElementById('gTo').value=g.toLocation||'';
        document.getElementById('gTripDate').value=g.tripDate||'';
        document.getElementById('gAgency').value=g.agency||'';
        document.getElementById('gPublicSummary').value=g.publicSummary||'';
        busPhotoUrl = g.busPhoto||''; guidePhotoUrl = g.guidePhoto||'';
        document.getElementById('busPreview').src=busPhotoUrl; document.getElementById('busPreview').style.display=busPhotoUrl?'block':'none';
        document.getElementById('guidePreview').src=guidePhotoUrl; document.getElementById('guidePreview').style.display=guidePhotoUrl?'block':'none';
        document.getElementById('modalTitle').textContent='✏️ تعديل مرشد';
        document.getElementById('guideModal').classList.add('show');
        document.getElementById('headerActions').style.display='flex';
    }

    document.getElementById('addGuideBtn').onclick = () => {
        editGuideId=null; busPhotoUrl=''; guidePhotoUrl='';
        ['gName','gPhone','gNationality','gPeopleCount','gTransport','gPlate1','gPlate2','gForeignPlate','gFrom','gTo','gAgency','gPublicSummary','gTripDate'].forEach(id=>document.getElementById(id).value='');
        document.getElementById('busPreview').style.display='none'; document.getElementById('guidePreview').style.display='none';
        isForeignPlate=false;
        document.getElementById('tunisiaPlateSection').style.display='block';
        document.getElementById('foreignPlateSection').style.display='none';
        document.getElementById('togglePlateBtn').textContent='🔄 تبديل إلى لوحة أجنبية';
        document.getElementById('modalTitle').textContent='➕ إضافة مرشد';
        document.getElementById('guideModal').classList.add('show');
        document.getElementById('headerActions').style.display='flex';
    };
    document.getElementById('closeGuideBtn2').onclick = () => { document.getElementById('guideModal').classList.remove('show'); document.getElementById('headerActions').style.display='none'; };

    document.getElementById('autoSummaryBtn').onclick = () => {
        const nat = document.getElementById('gNationality').value||'عالمي';
        const cnt = document.getElementById('gPeopleCount').value||'0';
        const from = document.getElementById('gFrom').value||'...';
        const to = document.getElementById('gTo').value||'...';
        const trans = document.getElementById('gTransport').value||'نقل';
        document.getElementById('gPublicSummary').value = `زيارة وفد ${nat} مكون من ${cnt} فرداً قادماً من ${from} إلى ${to} عبر ${trans}.`;
    };

    // Tools
    document.getElementById('syncBtn').onclick = async () => {
        const locals = guides.filter(g=>g.id.startsWith('local_'));
        for(let g of locals) { const ref = db.collection('guides').doc(); await ref.set({...g, id:ref.id}); }
        guides = guides.filter(g=>!g.id.startsWith('local_'));
        LDB.saveGuides(guides); renderGuides(); toast('تمت المزامنة');
    };
    document.getElementById('exportPdfBtn').onclick = async () => {
        const { jsPDF } = window.jspdf; const doc = new jsPDF();
        const cards = document.querySelectorAll('#guidesContainer > div');
        for(let i=0;i<cards.length;i++) { const canvas = await html2canvas(cards[i],{scale:2}); if(i>0) doc.addPage(); doc.addImage(canvas.toDataURL('image/png'),'PNG',10,10,190,0); }
        doc.save('guides.pdf');
    };
    document.getElementById('backupBtn').onclick = () => { const b=new Blob([JSON.stringify(guides)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='backup.json'; a.click(); };
    document.getElementById('restoreBtn').onclick = () => { const i=document.createElement('input'); i.type='file'; i.accept='.json'; i.onchange=e=>{ const r=new FileReader(); r.onload=()=>{ guides=JSON.parse(r.result); LDB.saveGuides(guides); renderGuides(); toast('تم الاستيراد'); }; r.readAsText(e.target.files[0]); }; i.click(); };
    document.getElementById('setPinBtn').onclick = () => { const p=prompt('أدخل رمز PIN (4 أرقام)'); if(p&&/^\d{4}$/.test(p)){ LDB.setPin(p); toast('تم'); } };

    // Weather & Time Widget
    async function updateWeather() {
        try {
            const resp = await fetch('https://api.open-meteo.com/v1/forecast?latitude=36.8&longitude=10.18&current_weather=true');
            const data = await resp.json();
            document.getElementById('weatherTemp').textContent = Math.round(data.current_weather.temperature) + '°';
            const code = data.current_weather.weathercode;
            const icons = {0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',61:'🌧️',63:'🌧️',65:'🌧️',71:'❄️',73:'❄️',75:'❄️',77:'❄️',80:'🌧️',81:'🌧️',82:'🌧️',85:'🌨️',86:'🌨️',95:'⛈️',96:'⛈️',99:'⛈️'};
            document.getElementById('weatherIcon').textContent = icons[code] || '🌡️';
        } catch(e) {}
    }
    function updateDateTime() {
        const now = new Date();
        document.getElementById('currentTime').textContent = now.toLocaleTimeString('ar-TN', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
        document.getElementById('currentDate').textContent = now.toLocaleDateString('ar-TN', {weekday:'long', day:'numeric', month:'long'});
    }
    updateWeather();
    updateDateTime();
    setInterval(updateDateTime, 1000);
    setInterval(updateWeather, 600000);

    renderGuides();
</script>
</body>
</html>
