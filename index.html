<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>F-Note Pro VIP · خزنة المرشدين المتكاملة</title>
    <!-- Firebase & libs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Tajawal', system-ui, -apple-system, sans-serif;
        }

        :root {
            --bg-gradient: linear-gradient(145deg, #f4f7fc 0%, #eef2f6 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-soft: #334155;
            --border-light: #e2edf2;
            --accent-gold: #e94560;
            --accent-teal: #0f7b6e;
            --gray-bg: #f1f5f9;
            --shadow-sm: 0 8px 20px rgba(0, 0, 0, 0.05), 0 2px 4px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 12px 28px rgba(0, 0, 0, 0.08);
            --bottom-nav: rgba(255, 255, 255, 0.96);
            --walkie-bg: #25D366;
        }

        body.dark {
            --bg-gradient: linear-gradient(145deg, #111827 0%, #1f2937 100%);
            --card-bg: #1e293b;
            --text-main: #f1f5f9;
            --text-soft: #cbd5e1;
            --border-light: #334155;
            --gray-bg: #2d3a4e;
            --bottom-nav: #1e293b;
            --walkie-bg: #128C7E;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 80px;
        }

        /* شعار خلفية شفاف */
        .bg-watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 260px;
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
        }

        /* headers & bars */
        .app-bar {
            background: var(--card-bg);
            backdrop-filter: blur(4px);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            position: relative;
            z-index: 20;
            border-bottom: 1px solid var(--border-light);
        }

        .logo-area img {
            height: 42px;
            width: auto;
        }

        .icon-btn {
            background: transparent;
            border: none;
            font-size: 26px;
            cursor: pointer;
            color: var(--accent-gold);
            padding: 6px;
            border-radius: 40px;
            transition: 0.1s;
        }

        .icon-btn:active {
            transform: scale(0.92);
            background: var(--gray-bg);
        }

        .add-guide-float {
            display: flex;
            justify-content: center;
            margin: 16px 0 8px;
        }

        .primary-btn {
            background: var(--accent-gold);
            border: none;
            color: white;
            font-weight: bold;
            padding: 10px 32px;
            border-radius: 60px;
            font-size: 18px;
            box-shadow: 0 6px 14px rgba(233,69,96,0.3);
            cursor: pointer;
            transition: 0.1s;
        }

        .primary-btn:active {
            transform: translateY(2px);
        }

        /* Search & filter */
        .search-section {
            display: flex;
            gap: 8px;
            padding: 8px 16px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 2;
            background: var(--gray-bg);
            border: none;
            padding: 12px 20px;
            border-radius: 60px;
            color: var(--text-main);
            font-size: 14px;
        }

        .filter-select {
            flex: 1;
            background: var(--gray-bg);
            border: none;
            border-radius: 60px;
            padding: 0 15px;
            color: var(--text-main);
        }

        .voice-search {
            background: var(--accent-gold);
            border: none;
            width: 48px;
            border-radius: 60px;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        /* Cards */
        .guides-list {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .guide-card {
            background: var(--card-bg);
            border-radius: 32px;
            padding: 16px;
            box-shadow: var(--shadow-sm);
            border-right: 5px solid var(--accent-gold);
            transition: 0.1s;
        }

        .card-row {
            display: flex;
            gap: 14px;
            align-items: center;
        }

        .card-photo {
            width: 56px;
            height: 56px;
            border-radius: 28px;
            object-fit: cover;
            border: 2px solid var(--accent-gold);
            cursor: pointer;
            background: var(--gray-bg);
        }

        .card-info {
            flex: 1;
        }

        .card-name {
            font-weight: 800;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge-pub {
            background: #3b82f6;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 30px;
            color: white;
        }

        .badge-priv {
            background: #64748b;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 30px;
            color: white;
        }

        .phone-chip {
            background: var(--gray-bg);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 13px;
            margin-top: 5px;
        }

        .expand-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--accent-gold);
        }

        .card-details {
            display: none;
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid var(--border-light);
        }

        .card-details.show {
            display: block;
        }

        .details-inner {
            background: var(--gray-bg);
            border-radius: 24px;
            padding: 12px;
        }

        .action-group {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn-wa {
            background: #25D366;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-edit {
            background: var(--accent-teal);
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }

        .btn-danger {
            background: #dc2626;
            border: none;
            padding: 8px 16px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }

        /* bottom nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--bottom-nav);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-around;
            padding: 8px 16px 12px;
            border-top: 1px solid var(--border-light);
            z-index: 90;
        }

        .nav-item {
            text-align: center;
            background: transparent;
            border: none;
            padding: 6px 12px;
            border-radius: 40px;
            color: var(--text-soft);
            font-weight: 500;
        }

        .nav-item i {
            font-size: 26px;
            display: block;
        }

        .channel-badge {
            background: var(--accent-gold);
            border-radius: 30px;
            padding: 2px 10px;
            font-size: 14px;
            margin-right: 5px;
        }

        /* walkie talkie */
        .walkie-btn {
            position: fixed;
            bottom: 90px;
            left: 20px;
            width: 64px;
            height: 64px;
            background: var(--walkie-bg);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.25);
            z-index: 95;
            border: none;
            cursor: pointer;
            transition: 0.05s linear;
        }

        .walkie-btn.recording {
            background: #ef4444;
            animation: pulseAnim 0.8s infinite;
        }

        @keyframes pulseAnim {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239,68,68,0.7);}
            70% { transform: scale(1.07); box-shadow: 0 0 0 12px rgba(239,68,68,0);}
            100% { transform: scale(1);}
        }

        /* Modals */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }

        .modal.show {
            visibility: visible;
            opacity: 1;
        }

        .modal-card {
            background: var(--card-bg);
            width: 90%;
            max-width: 520px;
            max-height: 85vh;
            border-radius: 48px;
            padding: 24px;
            overflow-y: auto;
        }

        input, textarea, select {
            width: 100%;
            margin: 8px 0;
            padding: 12px 18px;
            border-radius: 60px;
            border: 1px solid var(--border-light);
            background: var(--gray-bg);
            color: var(--text-main);
        }

        .upload-card {
            background: var(--gray-bg);
            border-radius: 32px;
            padding: 12px;
            text-align: center;
            margin: 8px 0;
            cursor: pointer;
        }

        .color-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 12px 0;
        }

        .color-dot {
            width: 44px;
            height: 44px;
            border-radius: 30px;
            cursor: pointer;
            border: 2px solid transparent;
        }

        .color-dot.selected {
            border-color: white;
            box-shadow: 0 0 0 2px var(--accent-gold);
            transform: scale(1.05);
        }

        .toast-msg {
            position: fixed;
            bottom: 100px;
            left: 20px;
            right: 20px;
            background: #1e293b;
            color: white;
            text-align: center;
            padding: 12px;
            border-radius: 60px;
            z-index: 1100;
            font-weight: 500;
        }

        /* sidebar */
        .sidebar {
            position: fixed;
            top: 0;
            right: -280px;
            width: 280px;
            height: 100%;
            background: var(--card-bg);
            z-index: 1200;
            transition: 0.25s;
            padding: 24px 16px;
            box-shadow: -4px 0 20px rgba(0,0,0,0.1);
        }

        .sidebar.open {
            right: 0;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1150;
            display: none;
        }

        .overlay.show {
            display: block;
        }

        .login-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-gradient);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-screen.hide {
            display: none;
        }

        .login-card {
            background: var(--card-bg);
            padding: 32px;
            border-radius: 64px;
            width: 85%;
            max-width: 380px;
            text-align: center;
        }

        .login-logo img {
            width: 70px;
        }

        button.login-btn {
            background: var(--accent-gold);
            color: white;
            width: 100%;
            padding: 12px;
            border-radius: 60px;
            border: none;
            margin-top: 16px;
            font-weight: bold;
        }

        hr {
            margin: 12px 0;
        }
    </style>
</head>
<body>

<div class="bg-watermark"><img src="https://i.ibb.co/KxCpMmmq/1777593015229-removebg-preview.png" style="width:100%;" alt="watermark"></div>

<div class="app-bar">
    <button class="icon-btn" id="menuToggleBtn">☰</button>
    <div class="logo-area"><img src="https://i.ibb.co/KxCpMmmq/1777593015229-removebg-preview.png" alt="logo"></div>
    <button class="icon-btn" id="syncRefreshBtn">⟳</button>
</div>

<div class="add-guide-float">
    <button class="primary-btn" id="openAddGuideModal">+ إضافة مرشد</button>
</div>

<div class="search-section">
    <input type="text" id="searchGuide" class="search-input" placeholder="🔍 بحث بالاسم أو الهاتف">
    <select id="agencyFilter" class="filter-select">
        <option value="all">جميع الوكالات</option>
        <option value="فندق">فندق</option>
        <option value="شركة">شركة</option>
        <option value="مستقل">مستقل</option>
    </select>
    <button class="voice-search" id="voiceSearchBtn">🎤</button>
</div>

<div id="guidesContainer" class="guides-list"><div style="text-align:center;">جاري التحميل...</div></div>

<div class="bottom-nav">
    <button class="nav-item" id="showMessagesNavBtn"><i>📼</i><span>الرسائل</span></button>
    <button class="nav-item" id="openChannelModalBtn"><i>🌊</i><span>الموجة <span id="currentChannelSpan" class="channel-badge">1</span></span></button>
    <button class="nav-item" id="helpInfoBtn"><i>ℹ️</i><span>تعليمات</span></button>
</div>

<button id="walkieBtn" class="walkie-btn">🎙️</button>

<!-- MODALS -->
<div id="guideFormModal" class="modal"><div class="modal-card"><h3 id="modalTitleGuide">➕ إضافة مرشد</h3>
    <input type="text" id="guideName" placeholder="الاسم الكامل *">
    <input type="tel" id="guidePhone" placeholder="رقم الهاتف *">
    <input type="text" id="plateNumber" placeholder="رقم اللوحة">
    <div class="upload-card" id="uploadGuidePhotoTrigger">📸 رفع صورة المرشد</div>
    <div id="guidePhotoPreviewArea" style="display:none;"><img id="guidePhotoPreviewImg" style="width:70px; border-radius: 20px;"></div>
    <div class="upload-card" id="uploadBusPhotoTrigger">🚌 رفع صورة وسيلة النقل</div>
    <div id="busPhotoPreviewArea" style="display:none;"><img id="busPhotoPreviewImg" style="width:70px; border-radius: 20px;"></div>
    <input type="text" id="transportType" placeholder="وسيلة النقل">
    <input type="text" id="agency" placeholder="الوكالة">
    <textarea id="guideNotes" rows="2" placeholder="ملاحظات إضافية"></textarea>
    <div class="color-selector" id="colorSelectorPalette"></div>
    <select id="guideVisibilitySelect"><option value="private">🔒 خاص</option><option value="public">🌍 عام</option></select>
    <div style="display:flex; gap:12px; margin-top:15px;"><button id="saveGuideFinalBtn" class="primary-btn" style="background: #10b981;">💾 حفظ</button><button id="closeGuideModalBtn" class="btn-danger" style="background:#64748b;">إلغاء</button></div>
</div></div>

<div id="channelModal" class="modal"><div class="modal-card"><h3>🌊 اختيار الموجة (راديو)</h3><button data-channel="1" class="primary-btn" style="background:#3b82f6; width:100%; margin:8px 0;">الموجة 1 - عامة</button><button data-channel="2" class="primary-btn" style="background:#8b5cf6; width:100%; margin:8px 0;">الموجة 2 - فريق العمل</button><button data-channel="3" class="primary-btn" style="background:#ef4444; width:100%; margin:8px 0;">الموجة 3 - طوارئ</button><button id="closeChannelSelectBtn" class="btn-danger" style="background:#64748b;">إلغاء</button></div></div>

<div id="messagesListModal" class="modal"><div class="modal-card"><h3>📼 رسائل الموجة <span id="messagesChannelNum">1</span></h3><div id="messagesContainer" style="max-height: 400px; overflow-y:auto;"></div><p style="font-size:12px; margin-top: 12px;">🗑️ تُحذف تلقائياً بعد 7 أيام</p><button id="closeMessagesListModal" class="btn-danger" style="background:#64748b;">إغلاق</button></div></div>

<div id="fullImageViewModal" class="modal"><div class="modal-card" style="text-align:center;"><img id="fullImageViewImg" style="max-width:100%;border-radius:28px;"><button id="closeFullImageBtn" class="btn-danger" style="margin-top:16px;">إغلاق</button></div></div>

<div id="multiShareModal" class="modal"><div class="modal-card"><h3>📨 إرسال لعدة جهات اتصال</h3><div id="contactsCheckList" style="max-height:260px; overflow-y:auto;"></div><div style="display:flex; gap:10px; margin-top:18px;"><button id="confirmGroupShareBtn" class="primary-btn" style="background:#25D366;">إرسال عبر واتساب</button><button id="closeMultiShareBtn" class="btn-danger">إلغاء</button></div></div></div>

<div id="sidebarMenu" class="sidebar"><h3>✨ القائمة الذهبية</h3><hr><div id="userInfoSidebar"></div><button id="darkModeSidebarBtn" class="primary-btn" style="background:transparent; border:1px solid var(--border-light); width:100%; margin:10px 0;">🌙 الوضع الداكن</button><button id="exportJsonBtn" class="primary-btn" style="background:transparent; border:1px solid var(--border-light); width:100%; margin:6px 0;">💾 تصدير JSON</button><button id="exportPdfBtnSide" class="primary-btn" style="background:transparent; border:1px solid var(--border-light); width:100%; margin:6px 0;">📄 تصدير PDF</button><button id="clearAllVoiceMessagesBtn" class="btn-danger" style="width:100%;">🗑️ مسح كل الرسائل الصوتية</button><button id="logoutSidebarBtn" class="btn-danger" style="margin-top:20px; background:#dc2626;">🚪 تسجيل الخروج</button></div>
<div id="globalOverlay" class="overlay"></div>

<div id="loginScreen" class="login-screen"><div class="login-card"><div class="login-logo"><img src="https://i.ibb.co/KxCpMmmq/1777593015229-removebg-preview.png"></div><h2>F-Note Pro VIP</h2><input type="email" id="loginEmail" placeholder="البريد الإلكتروني" value="fahmiajmi5@gmail.com"><input type="password" id="loginPassword" placeholder="كلمة المرور"><button class="login-btn" id="doLoginBtn">دخول إلى الخزنة</button></div></div>

<script>
    // ---------- FIREBASE ----------
    const firebaseConfig = {
        apiKey: "AIzaSyAJLpdRoKamaHHofnCh4qQk6mHKeI25Tgc",
        authDomain: "f-notepro-work.firebaseapp.com",
        projectId: "f-notepro-work",
        storageBucket: "f-notepro-work.firebasestorage.app",
        messagingSenderId: "645688115664",
        appId: "1:645688115664:web:5dbfee1e28c41e0a1c79d5"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    db.enablePersistence({ synchronizeTabs: true }).catch(e=>console.warn);

    // IndexedDB voice
    const voiceDB = new Dexie('VoiceMessagesDB');
    voiceDB.version(1).stores({ messages: '++id, channel, sender, timestamp, audioBlob, expiry' });

    // ---------- Global state ----------
    let currentUser = null;
    let guidesArray = [];
    let currentEditId = null;
    let selectedCardColor = "#e94560";
    let currentChannel = 1;        // الموجة الحالية
    let currentGuidePhotoBase64 = "", currentBusPhotoBase64 = "";
    let mediaRecorder = null, audioChunks = [], isRecordingActive = false;
    let currentShareGuideId = null;

    // Helpers
    function toast(msg, isError = false) { let t = document.createElement('div'); t.className = 'toast-msg'; t.innerText = msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2800); }

    function compressAndPreview(file, type) {
        if(!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                let w = img.width, h = img.height;
                const maxW = 400;
                if(w > maxW) { h = (h * maxW) / w; w = maxW; }
                canvas.width = w; canvas.height = h;
                canvas.getContext('2d').drawImage(img,0,0,w,h);
                const b64 = canvas.toDataURL('image/jpeg', 0.65);
                if(type === 'guide') { currentGuidePhotoBase64 = b64; document.getElementById('guidePhotoPreviewImg').src = b64; document.getElementById('guidePhotoPreviewArea').style.display = 'block'; }
                else { currentBusPhotoBase64 = b64; document.getElementById('busPhotoPreviewImg').src = b64; document.getElementById('busPhotoPreviewArea').style.display = 'block'; }
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function resetImagePreviews() { currentGuidePhotoBase64=""; currentBusPhotoBase64=""; document.getElementById('guidePhotoPreviewArea').style.display='none'; document.getElementById('busPhotoPreviewArea').style.display='none'; }

    // Render guides
    function renderGuidesList() {
        const searchTerm = document.getElementById('searchGuide').value.toLowerCase();
        const agencyVal = document.getElementById('agencyFilter').value;
        let filtered = guidesArray.filter(g => (g.name?.toLowerCase().includes(searchTerm) || g.phone?.includes(searchTerm)));
        if(agencyVal !== 'all') filtered = filtered.filter(g => g.agency === agencyVal);
        const container = document.getElementById('guidesContainer');
        if(!filtered.length) { container.innerHTML = '<div style="text-align:center; padding:40px;">📭 لا توجد بيانات</div>'; return; }
        container.innerHTML = filtered.map(guide => `
            <div class="guide-card" style="border-right-color: ${guide.cardColor || '#e94560'}">
                <div class="card-row">
                    <img class="card-photo" src="${guide.guidePhoto || ''}" onerror="this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20fill%3D%22gray%22%3E%3C%2Fsvg%3E'" onclick="window.showFullImage('${guide.guidePhoto}')">
                    <div class="card-info">
                        <div class="card-name">${escapeHtml(guide.name)} ${guide.visibility === 'public' ? '<span class="badge-pub">عام</span>' : '<span class="badge-priv">خاص</span>'}</div>
                        <div class="phone-chip">📞 ${escapeHtml(guide.phone)} <button style="background:none;border:none;" onclick="window.location.href='tel:${guide.phone}'">📞</button></div>
                    </div>
                    <button class="expand-btn" data-expand-id="${guide.id}">▼</button>
                </div>
                <div id="details-${guide.id}" class="card-details">
                    <div class="details-inner">
                        ${guide.busPhoto ? `<img src="${guide.busPhoto}" style="width:55px; border-radius:16px;" onclick="window.showFullImage('${guide.busPhoto}')">` : ''}
                        <p><strong>🚐 النقل:</strong> ${escapeHtml(guide.transportType || '-')}</p>
                        <p><strong>🚍 اللوحة:</strong> <span style="background:${guide.cardColor}; padding:2px 12px; border-radius:40px;">${escapeHtml(guide.plateNumber || '-')}</span></p>
                        <p><strong>🏢 الوكالة:</strong> ${escapeHtml(guide.agency || '-')}</p>
                        <p><strong>📝 ملاحظات:</strong> ${escapeHtml((guide.notes || '').substring(0,70))}</p>
                        <div class="action-group">
                            ${guide.userId === currentUser?.uid ? `<button class="btn-edit" data-edit-id="${guide.id}">✏️ تعديل</button><button class="btn-danger" data-del-id="${guide.id}">🗑️ حذف</button>` : ''}
                            <button class="btn-wa" data-share-id="${guide.id}">💬 مشاركة واتساب</button>
                        </div>
                    </div>
                </div>
            </div>
        `).join('');
        // attach expand events delegation
        document.querySelectorAll('.expand-btn').forEach(btn => {
            const id = btn.dataset.expandId;
            btn.onclick = () => { document.getElementById(`details-${id}`).classList.toggle('show'); btn.innerHTML = document.getElementById(`details-${id}`).classList.contains('show') ? '▲' : '▼'; };
        });
        document.querySelectorAll('[data-edit-id]').forEach(btn => { btn.onclick = () => editGuideById(btn.dataset.editId); });
        document.querySelectorAll('[data-del-id]').forEach(btn => { btn.onclick = () => deleteGuideById(btn.dataset.delId); });
        document.querySelectorAll('[data-share-id]').forEach(btn => { btn.onclick = () => openMultiShare(btn.dataset.shareId); });
    }

    window.showFullImage = (url) => { if(url) { document.getElementById('fullImageViewImg').src = url; document.getElementById('fullImageViewModal').classList.add('show'); } };

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

    async function editGuideById(id) { const g = guidesArray.find(g => g.id === id); if(g && g.userId === currentUser?.uid) { currentEditId = id; document.getElementById('guideName').value = g.name; document.getElementById('guidePhone').value = g.phone; document.getElementById('plateNumber').value = g.plateNumber || ''; document.getElementById('transportType').value = g.transportType || ''; document.getElementById('agency').value = g.agency || ''; document.getElementById('guideNotes').value = g.notes || ''; selectedCardColor = g.cardColor || '#e94560'; document.getElementById('guideVisibilitySelect').value = g.visibility || 'private'; if(g.guidePhoto) { currentGuidePhotoBase64 = g.guidePhoto; document.getElementById('guidePhotoPreviewImg').src = g.guidePhoto; document.getElementById('guidePhotoPreviewArea').style.display = 'block'; } if(g.busPhoto) { currentBusPhotoBase64 = g.busPhoto; document.getElementById('busPhotoPreviewImg').src = g.busPhoto; document.getElementById('busPhotoPreviewArea').style.display = 'block'; } document.getElementById('modalTitleGuide').innerHTML = '✏️ تعديل مرشد'; document.getElementById('guideFormModal').classList.add('show'); } else toast('لا يمكنك تعديل بيانات الآخرين', true); }
    async function deleteGuideById(id) { if(confirm('حذف المرشد نهائياً؟')) await db.collection('guides').doc(id).delete(); toast('تم الحذف'); }

    async function saveGuideHandler() {
        const name = document.getElementById('guideName').value.trim();
        const phone = document.getElementById('guidePhone').value.trim();
        if(!name || !phone) { toast('الاسم والهاتف مطلوبان', true); return; }
        const guideObj = { id: currentEditId || null, name, phone, plateNumber: document.getElementById('plateNumber').value.trim(), cardColor: selectedCardColor, transportType: document.getElementById('transportType').value.trim(), agency: document.getElementById('agency').value.trim(), notes: document.getElementById('guideNotes').value.trim(), visibility: document.getElementById('guideVisibilitySelect').value };
        try {
            const finalData = { userId: currentUser.uid, name: guideObj.name, phone: guideObj.phone, plateNumber: guideObj.plateNumber, guidePhoto: currentGuidePhotoBase64 || null, busPhoto: currentBusPhotoBase64 || null, cardColor: guideObj.cardColor, transportType: guideObj.transportType, agency: guideObj.agency, notes: guideObj.notes, visibility: guideObj.visibility, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
            if(!guideObj.id) finalData.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            const ref = guideObj.id ? db.collection('guides').doc(guideObj.id) : db.collection('guides').doc();
            await ref.set(finalData, { merge: true });
            toast('تم الحفظ بنجاح');
            document.getElementById('guideFormModal').classList.remove('show');
            resetFormModal();
        } catch(e) { toast('فشل الحفظ: '+e.message, true); }
    }

    function resetFormModal() { currentEditId = null; resetImagePreviews(); document.getElementById('guideName').value = ''; document.getElementById('guidePhone').value = ''; document.getElementById('plateNumber').value = ''; document.getElementById('transportType').value = ''; document.getElementById('agency').value = ''; document.getElementById('guideNotes').value = ''; document.getElementById('guideVisibilitySelect').value = 'private'; document.getElementById('modalTitleGuide').innerHTML = '➕ إضافة مرشد'; selectedCardColor = '#e94560'; document.querySelectorAll('.color-dot').forEach(c=>c.classList.remove('selected')); document.querySelector('.color-dot[data-color="#e94560"]')?.classList.add('selected'); }

    // Firebase realtime listener
    function subscribeGuides() { if(!currentUser) return; const mine = db.collection('guides').where('userId','==',currentUser.uid); const pub = db.collection('guides').where('visibility','==','public'); const listener = () => { Promise.all([mine.get(), pub.get()]).then(([mineSnap, pubSnap])=>{ let all = []; mineSnap.forEach(d=>all.push({id:d.id,...d.data()})); pubSnap.forEach(d=>{ if(d.data().userId !== currentUser.uid) all.push({id:d.id,...d.data()}); }); const unique = []; all.forEach(g=>{ if(!unique.find(u=>u.id===g.id)) unique.push(g); }); guidesArray = unique; renderGuidesList(); }); }; mine.onSnapshot(listener); pub.onSnapshot(listener); }

    // VOICE RECORDING (WALKIE)
    async function startRecording() { if(isRecordingActive) return; try { const stream = await navigator.mediaDevices.getUserMedia({ audio: true }); mediaRecorder = new MediaRecorder(stream); audioChunks = []; mediaRecorder.ondataavailable = e => audioChunks.push(e.data); mediaRecorder.onstop = async () => { const blob = new Blob(audioChunks, { type: 'audio/webm' }); const expiry = new Date(); expiry.setDate(expiry.getDate()+7); await voiceDB.messages.add({ channel: currentChannel, sender: currentUser?.email || 'مرشد', timestamp: new Date().toISOString(), audioBlob: blob, expiry: expiry.toISOString() }); toast(`🎙️ تم حفظ البث في الموجة ${currentChannel}`); stream.getTracks().forEach(t=>t.stop()); isRecordingActive = false; document.getElementById('walkieBtn').classList.remove('recording'); }; mediaRecorder.start(); isRecordingActive = true; document.getElementById('walkieBtn').classList.add('recording'); } catch(e) { toast('الوصول للميكروفون مرفوض', true); } }
    function stopRecording() { if(mediaRecorder && isRecordingActive && mediaRecorder.state !== 'inactive') { mediaRecorder.stop(); } }
    document.getElementById('walkieBtn').addEventListener('pointerdown', startRecording);
    document.getElementById('walkieBtn').addEventListener('pointerup', stopRecording);
    document.getElementById('walkieBtn').addEventListener('pointerleave', stopRecording);

    // Show messages for current channel
    async function showMessagesForChannel() { await voiceDB.messages.where('expiry').below(new Date().toISOString()).delete(); const msgs = await voiceDB.messages.where('channel').equals(currentChannel).toArray(); const container = document.getElementById('messagesContainer'); if(!msgs.length) container.innerHTML = '<div style="padding:20px;text-align:center;">📭 لا توجد رسائل صوتية</div>'; else container.innerHTML = msgs.map(m => `<div style="background:var(--gray-bg); border-radius:24px; padding:12px; margin-bottom:12px;"><div><strong>${escapeHtml(m.sender)}</strong> · ${new Date(m.timestamp).toLocaleString()}</div><audio controls src="${URL.createObjectURL(m.audioBlob)}" style="width:100%; margin-top:8px;"></audio></div>`).join(''); document.getElementById('messagesChannelNum').innerText = currentChannel; document.getElementById('messagesListModal').classList.add('show'); }
    
    // Channel selector
    function setChannel(ch) { currentChannel = ch; document.getElementById('currentChannelSpan').innerText = ch; toast(`الموجة الحالية: ${ch}`); }
    document.querySelectorAll('#channelModal button[data-channel]').forEach(btn => { btn.onclick = () => { setChannel(parseInt(btn.dataset.channel)); document.getElementById('channelModal').classList.remove('show'); }; });

    // MultiShare
    function openMultiShare(guideId) { currentShareGuideId = guideId; const guide = guidesArray.find(g=>g.id===guideId); if(!guide) return; const contacts = [{name:"أحمد محمد",phone:"+21612345678"},{name:"سارة خالد",phone:"+21698765432"},{name:"ياسر منصور",phone:"+21655554444"},{name:"ليلى حسن",phone:"+21633332222"}]; document.getElementById('contactsCheckList').innerHTML = contacts.map(c=>`<label style="display:flex; align-items:center; gap:10px; margin:8px 0;"><input type="checkbox" value="${c.phone}"> ${c.name} (${c.phone})</label>`).join(''); document.getElementById('multiShareModal').classList.add('show'); }
    document.getElementById('confirmGroupShareBtn').onclick = () => { const guide = guidesArray.find(g=>g.id===currentShareGuideId); if(!guide) return; const selected = Array.from(document.querySelectorAll('#contactsCheckList input:checked')).map(cb=>cb.value); if(!selected.length){ toast('اختر جهة اتصال',true); return; } const msg = `*${guide.name}*\n📞 ${guide.phone}\n🚐 ${guide.transportType||''}\n🚍 ${guide.plateNumber||''}\n🏢 ${guide.agency||''}`; selected.forEach(phone=> window.open(`https://wa.me/${phone.replace(/[^0-9+]/g,'')}?text=${encodeURIComponent(msg)}`,'_blank')); document.getElementById('multiShareModal').classList.remove('show'); };
    document.getElementById('closeMultiShareBtn').onclick = () => document.getElementById('multiShareModal').classList.remove('show');

    // Authentication & bootstrap
    auth.onAuthStateChanged(user => { if(user) { currentUser = user; document.getElementById('loginScreen').classList.add('hide'); document.getElementById('userInfoSidebar').innerHTML = `✅ ${user.email}`; subscribeGuides(); } else { currentUser = null; guidesArray = []; renderGuidesList(); document.getElementById('loginScreen').classList.remove('hide'); } });
    document.getElementById('doLoginBtn').onclick = () => { const email = document.getElementById('loginEmail').value, pass = document.getElementById('loginPassword').value; auth.signInWithEmailAndPassword(email,pass).catch(e=>toast(e.message,true)); };
    document.getElementById('logoutSidebarBtn').onclick = () => { auth.signOut(); toast('تم الخروج'); };
    document.getElementById('darkModeSidebarBtn').onclick = () => { document.body.classList.toggle('dark'); localStorage.setItem('fnoteDark', document.body.classList.contains('dark')); };
    if(localStorage.getItem('fnoteDark') === 'true') document.body.classList.add('dark');
    document.getElementById('exportJsonBtn').onclick = () => { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(guidesArray,null,2)],{type:'application/json'})); a.download=`guides_backup_${Date.now()}.json`; a.click(); };
    document.getElementById('exportPdfBtnSide').onclick = () => { let el=document.createElement('div'); el.dir='rtl'; el.innerHTML='<h2>F-Note Pro</h2>'; guidesArray.forEach(g=>{ el.innerHTML+=`<div><b>${g.name}</b><br>📞 ${g.phone}<br>🚐 ${g.transportType||'-'}</div><hr>`; }); html2pdf().from(el).set({margin:1,filename:`guides_${Date.now()}.pdf`}).save(); };
    document.getElementById('clearAllVoiceMessagesBtn').onclick = async () => { if(confirm('مسح كل الرسائل الصوتية؟')) await voiceDB.messages.clear(); toast('تم مسح الأرشيف'); };
    document.getElementById('openAddGuideModal').onclick = () => { resetFormModal(); document.getElementById('guideFormModal').classList.add('show'); };
    document.getElementById('saveGuideFinalBtn').onclick = saveGuideHandler;
    document.getElementById('closeGuideModalBtn').onclick = () => document.getElementById('guideFormModal').classList.remove('show');
    document.getElementById('showMessagesNavBtn').onclick = showMessagesForChannel;
    document.getElementById('openChannelModalBtn').onclick = () => document.getElementById('channelModal').classList.add('show');
    document.getElementById('closeChannelSelectBtn').onclick = () => document.getElementById('channelModal').classList.remove('show');
    document.getElementById('closeMessagesListModal').onclick = () => document.getElementById('messagesListModal').classList.remove('show');
    document.getElementById('closeFullImageBtn').onclick = () => document.getElementById('fullImageViewModal').classList.remove('show');
    document.getElementById('menuToggleBtn').onclick = () => { document.getElementById('sidebarMenu').classList.add('open'); document.getElementById('globalOverlay').classList.add('show'); };
    document.getElementById('globalOverlay').onclick = () => { document.getElementById('sidebarMenu').classList.remove('open'); document.getElementById('globalOverlay').classList.remove('show'); };
    document.getElementById('syncRefreshBtn').onclick = () => toast('تم التحديث');
    document.getElementById('voiceSearchBtn').onclick = () => { const recognition = new (window.webkitSpeechRecognition||window.SpeechRecognition)(); if(!recognition) { toast('غير مدعوم',true); return; } recognition.lang='ar'; recognition.start(); recognition.onresult = e => { document.getElementById('searchGuide').value = e.results[0][0].transcript; renderGuidesList(); }; };
    document.getElementById('searchGuide').addEventListener('input', renderGuidesList);
    document.getElementById('agencyFilter').addEventListener('change', renderGuidesList);
    // color palette
    const colors = ['#e94560','#2c7da0','#e76f51','#2a9d8f','#e9c46a','#9b5de5','#06d6a0','#ff006e'];
    const paletteDiv = document.getElementById('colorSelectorPalette');
    paletteDiv.innerHTML = colors.map(c => `<div class="color-dot" style="background:${c};" data-color="${c}"></div>`).join('');
    document.querySelectorAll('.color-dot').forEach(dot => { dot.onclick = () => { document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('selected')); dot.classList.add('selected'); selectedCardColor = dot.dataset.color; }; });
    document.querySelector('.color-dot[data-color="#e94560"]')?.classList.add('selected');
    document.getElementById('uploadGuidePhotoTrigger').onclick = () => { const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.onchange=e=> compressAndPreview(e.target.files[0],'guide'); inp.click(); };
    document.getElementById('uploadBusPhotoTrigger').onclick = () => { const inp = document.createElement('input'); inp.type='file'; inp.accept='image/*'; inp.onchange=e=> compressAndPreview(e.target.files[0],'bus'); inp.click(); };
    toast('✨ النظام الأساسي جاهز · الموجات الصوتية نشطة');
</script>
</body>
</html>
