<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
  <meta name="theme-color" content="#e94560">
  <title>F-Note Pro | خزنة المرشدين + لاسلكي تونسي</title>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg: #f0f2f5;
      --card: #ffffff;
      --text: #1a1a2e;
      --sub: #545f71;
      --muted: #8b95a5;
      --border: #e2e8f0;
      --gold: #e94560;
      --success: #10b981;
      --danger: #ef4444;
      --walkie: #25D366;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
      --radius: 20px;
      --radius-sm: 14px;
      --radius-full: 60px;
      --font: 'Segoe UI', 'Tajawal', system-ui, sans-serif;
      --transition: 0.2s;
      --nav-h: 68px;
    }
    body.dark {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --sub: #cbd5e1;
      --muted: #94a3b8;
      --border: #334155;
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
      --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.4);
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: var(--bg);
      font-family: var(--font);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      transition: background var(--transition);
      padding-bottom: var(--nav-h);
    }

    /* ============ LOGIN ============ */
    .login-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-screen.hide {
      display: none;
    }
    .login-card {
      background: var(--card);
      border-radius: 32px;
      padding: 32px 24px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border);
    }
    .login-title {
      font-size: 26px;
      font-weight: 900;
      color: var(--gold);
      margin-bottom: 4px;
    }
    .login-sub {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 20px;
    }
    .login-input {
      width: 100%;
      padding: 13px 16px;
      margin: 6px 0;
      border: 2px solid var(--border);
      border-radius: var(--radius-full);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
      transition: var(--transition);
    }
    .login-input:focus {
      border-color: var(--gold);
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      margin-top: 14px;
      border: none;
      border-radius: var(--radius-full);
      background: var(--gold);
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }
    .login-error {
      color: #ef4444;
      font-size: 12px;
      margin-top: 8px;
      display: none;
      background: #fef2f2;
      border-radius: 30px;
      padding: 8px 14px;
    }
    .login-error.show {
      display: block;
    }

    /* ============ HEADER ============ */
    .header {
      background: var(--card);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--border);
    }
    .header-title {
      font-weight: 800;
      font-size: 18px;
      color: var(--gold);
    }
    .menu-btn {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: var(--bg);
      border: none;
      font-size: 22px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      color: var(--sub);
    }

    /* ============ SIDEBAR ============ */
    .sidebar {
      position: fixed;
      top: 0;
      right: -300px;
      width: 280px;
      height: 100%;
      background: var(--card);
      z-index: 1500;
      transition: right 0.3s;
      overflow-y: auto;
      border-left: 1px solid var(--border);
    }
    .sidebar.open {
      right: 0;
    }
    .sidebar-head {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-head h3 {
      color: var(--gold);
      font-size: 18px;
    }
    .sidebar-close {
      background: var(--bg);
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 18px;
    }
    .sidebar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 16px;
      cursor: pointer;
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 13px;
      margin: 2px 8px;
    }
    .sidebar-item:active {
      background: var(--bg);
    }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 1400;
      visibility: hidden;
      opacity: 0;
      transition: 0.2s;
    }
    .overlay.show {
      visibility: visible;
      opacity: 1;
    }

    /* ============ BOTTOM NAV ============ */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--card);
      display: flex;
      border-top: 1px solid var(--border);
      z-index: 999;
      height: var(--nav-h);
    }
    .nav-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      border: none;
      background: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .nav-tab.active {
      color: var(--gold);
    }
    .nav-tab .ico {
      font-size: 22px;
    }
    .page {
      display: none;
      min-height: calc(100vh - var(--nav-h));
    }
    .page.active {
      display: block;
    }

    /* ============ GUIDES PAGE ============ */
    .toolbar {
      display: flex;
      padding: 10px 14px;
      gap: 8px;
      background: var(--bg);
      position: sticky;
      top: 62px;
      z-index: 90;
    }
    .search-box {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid transparent;
      border-radius: var(--radius-full);
      background: var(--card);
      color: var(--text);
      font-size: 14px;
      outline: none;
      box-shadow: var(--shadow);
    }
    .search-box:focus {
      border-color: var(--gold);
    }
    .add-btn {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--gold);
      color: #fff;
      font-size: 28px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(233, 69, 96, 0.35);
    }
    .guides-list {
      padding: 8px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .guide-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 14px 16px;
      box-shadow: var(--shadow);
      border-right: 5px solid var(--gold);
      cursor: pointer;
    }
    .guide-card .name {
      font-size: 15px;
      font-weight: 800;
    }
    .guide-card .phone {
      color: var(--gold);
      font-weight: 600;
    }

    /* ============ CHAT PAGE ============ */
    #pageChat {
      display: none;
      height: calc(100vh - var(--nav-h));
      flex-direction: column;
    }
    #pageChat.active {
      display: flex;
    }
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--bg);
    }
    .chat-header-bar {
      background: var(--card);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      color: var(--gold);
      flex-shrink: 0;
    }
    .contacts-row {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 8px 14px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .contact-chip {
      flex-shrink: 0;
      text-align: center;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 16px;
      min-width: 64px;
      border: 2px solid transparent;
      background: var(--bg);
      transition: 0.2s;
    }
    .contact-chip.selected {
      border-color: var(--gold);
      background: #fef2f2;
      transform: translateY(-2px);
    }
    .contact-chip .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin: 0 auto 3px;
      background: #ddd;
    }
    .contact-chip .cname {
      font-size: 10px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60px;
    }
    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      box-shadow: var(--shadow);
      animation: fadeIn 0.2s;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .msg.me {
      align-self: flex-end;
      background: #e8f5e9;
    }
    .msg.other {
      align-self: flex-start;
      background: var(--card);
    }
    .msg .sender {
      font-size: 10px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 3px;
    }
    .msg .time {
      font-size: 9px;
      color: var(--muted);
      text-align: left;
      margin-top: 4px;
    }
    .msg img {
      max-width: 180px;
      border-radius: 10px;
    }

    /* شريط الكتابة */
    .input-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      background: var(--card);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .input-bar input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 24px;
      border: 2px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }
    .input-bar input:focus {
      border-color: var(--gold);
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--sub);
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }
    .icon-btn.ptt {
      width: 50px;
      height: 50px;
      background: var(--walkie);
      color: #fff;
      font-size: 22px;
      box-shadow: 0 4px 16px rgba(37, 211, 102, 0.4);
    }
    .icon-btn.ptt.recording {
      background: #ef4444;
      animation: pulse 0.6s infinite;
    }
    @keyframes pulse {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.1);
      }
    }
    .toast {
      position: fixed;
      bottom: 80px;
      left: 16px;
      right: 16px;
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      padding: 12px 20px;
      border-radius: 30px;
      text-align: center;
      z-index: 9999;
      font-size: 13px;
      animation: slideUp 0.3s;
    }
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .silent-fx {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(37, 211, 102, 0.3);
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      z-index: 1000;
      animation: ripple 0.5s ease-out forwards;
    }
    @keyframes ripple {
      to {
        transform: translate(-50%, -50%) scale(2);
        opacity: 0;
      }
    }
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1600;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-box {
      background: var(--card);
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 24px;
      padding: 22px 18px;
      box-shadow: var(--shadow-lg);
    }
    .modal-box h3 {
      text-align: center;
      margin-bottom: 14px;
      color: var(--gold);
    }
    .modal-box input,
    .modal-box textarea,
    .modal-box select {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: 2px solid var(--border);
      border-radius: var(--radius-full);
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      outline: none;
      font-family: var(--font);
    }
    .modal-box textarea {
      border-radius: var(--radius-sm);
      resize: vertical;
    }
    .btn-save,
    .btn-cancel {
      flex: 1;
      padding: 12px;
      border-radius: var(--radius-full);
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 13px;
    }
    .btn-save {
      background: var(--success);
      color: #fff;
    }
    .btn-cancel {
      background: #64748b;
      color: #fff;
    }
    .modal-btns {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    /* ============ FLOATING BUBBLE ============ */
    .floating-bubble {
      position: fixed;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--card);
      z-index: 3000;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
      border: 3px solid var(--gold);
    }
    .floating-bubble.show {
      display: flex;
    }
    .floating-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: #ef4444;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      min-width: 22px;
      height: 22px;
      border-radius: 11px;
      display: none;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
    }
  </style>
</head>
<body>

  <!-- ==================== LOGIN ==================== -->
  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-title">F-Note Pro</div>
      <div class="login-sub">خزنة المرشدين + لاسلكي تونسي</div>
      <input type="email" id="loginEmail" class="login-input" placeholder="البريد الإلكتروني" value="fahmiajmi5@gmail.com" autocomplete="email">
      <input type="password" id="loginPassword" class="login-input" placeholder="كلمة المرور" autocomplete="current-password">
      <button class="login-btn" id="loginBtn">🔐 دخول</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- ==================== HEADER ==================== -->
  <div class="header">
    <div class="header-title">F-Note Pro</div>
    <button class="menu-btn" id="menuBtn">☰</button>
  </div>

  <!-- ==================== SIDEBAR ==================== -->
  <div class="overlay" id="overlay"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <h3>✨ القائمة</h3>
      <button class="sidebar-close" id="closeSidebar">✕</button>
    </div>
    <div class="sidebar-item" id="darkModeBtn"><span>🌙</span> الوضع الداكن</div>
    <div class="sidebar-item" id="profileBtn"><span>👤</span> الملف الشخصي</div>
    <div class="sidebar-item" id="signOutBtn"><span>🚪</span> تسجيل الخروج</div>
  </div>

  <!-- ==================== PAGE GUIDES ==================== -->
  <div id="pageGuides" class="page active">
    <div class="toolbar">
      <input type="text" id="searchInput" class="search-box" placeholder="🔍 بحث عن مرشد...">
      <button class="add-btn" id="addGuideBtn">+</button>
    </div>
    <div class="guides-list" id="guidesList">
      <div style="text-align:center;padding:40px;color:var(--muted);">⏳ جاري التحميل...</div>
    </div>
  </div>

  <!-- ==================== PAGE CHAT - الدردشة التونسية ==================== -->
  <div id="pageChat" class="page">
    <div class="chat-container">
      <div class="chat-header-bar">📻 اللاسلكي الذكي • الدارجة التونسية</div>
      <div class="contacts-row" id="contactsRow"></div>
      <div class="messages-area" id="messagesArea">
        <div style="text-align:center;padding:40px;color:var(--muted);">👋 اختار شكون باش تكلّم</div>
      </div>
      <div class="input-bar">
        <button class="icon-btn" id="attachImageBtn" title="تصويرة">🖼️</button>
        <button class="icon-btn" id="sendLocationBtn" title="وينك">📍</button>
        <input type="text" id="textInput" placeholder="أكتب رسالة بالدارجة..." autocomplete="off">
        <button class="icon-btn ptt" id="pttMainBtn" title="أضغط واهدر">🎙️</button>
        <button class="icon-btn" id="sendTextBtn" title="إرسال">📤</button>
        <button class="icon-btn" id="emojiBtn" title="إيموجي">😊</button>
        <button class="icon-btn" id="silentWaveBtn" title="موجة">🌊</button>
      </div>
    </div>
  </div>

  <!-- ==================== BOTTOM NAV ==================== -->
  <div class="bottom-nav">
    <button class="nav-tab active" data-page="pageGuides"><span class="ico">📋</span> المرشدين</button>
    <button class="nav-tab" data-page="pageChat"><span class="ico">📻</span> الدردشة</button>
  </div>

  <!-- الكرة العائمة -->
  <div class="floating-bubble" id="floatingBubble" style="left:20px;top:120px;">
    💬
    <div class="floating-badge" id="floatingBadge">0</div>
  </div>

  <!-- مودال إضافة مرشد -->
  <div class="modal" id="guideModal" style="display:none;">
    <div class="modal-box">
      <h3 id="modalTitle">➕ إضافة مرشد</h3>
      <input type="text" id="gName" placeholder="الاسم الكامل *">
      <input type="tel" id="gPhone" placeholder="رقم الهاتف *">
      <input type="text" id="gPlate" placeholder="رقم اللوحة">
      <input type="text" id="gTransport" placeholder="وسيلة النقل">
      <input type="text" id="gAgency" placeholder="الوكالة">
      <textarea id="gNotes" rows="2" placeholder="ملاحظات"></textarea>
      <div class="modal-btns">
        <button class="btn-save" id="saveGuideBtn">💾 حفظ</button>
        <button class="btn-cancel" id="cancelGuideBtn">❌ إلغاء</button>
      </div>
    </div>
  </div>

  <input type="file" id="hiddenImageInput" accept="image/*" style="display:none;">
  <input type="file" id="hiddenFileInput" style="display:none;">

  <script>
    // ==================== FIREBASE ====================
    const firebaseConfig = {
      apiKey: "AIzaSyC4vYbhHGfAWMSh-fRl4NlG1WiEyS6Ez9s",
      authDomain: "f-notepro-work-2d25b.firebaseapp.com",
      databaseURL: "https://f-notepro-work-2d25b-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "f-notepro-work-2d25b",
      storageBucket: "f-notepro-work-2d25b.firebasestorage.app",
      messagingSenderId: "221438380381",
      appId: "1:221438380381:web:b46c35d0ec0944079480b4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    const storage = firebase.storage();
    const rtdb = firebase.database();

    let currentUser = null;
    let guides = [];
    let editGuideId = null;
    let allUsers = [];
    let presenceData = {};
    let selectedChatUid = null;
    let chatMessages = [];
    let unsubscribeChat = null;
    let currentAudio = null;
    let mediaRecorder = null;
    let recording = false;
    let speechRecognition = null;
    let latestTranscript = '';
    let floatingMode = false;

    // ==================== دالة toast ====================
    function toast(msg, err = false) {
      const t = document.createElement('div');
      t.className = 'toast';
      t.style.background = err ? 'rgba(239,68,68,0.9)' : 'rgba(15,23,42,0.9)';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(() => { t.style.opacity = '0';
        t.style.transition = '0.3s';
        setTimeout(() => t.remove(), 300); }, 2500);
    }

    function esc(s) { if (!s) return ''; return String(s).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[
        m
      ]); }

    function vibrate(ms = 10) { if (navigator.vibrate) navigator.vibrate(ms); }

    // ==================== AUTH ====================
    document.getElementById('loginBtn').addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value.trim();
      const pass = document.getElementById('loginPassword').value;
      const errEl = document.getElementById('loginError');
      if (!email || !pass) { errEl.textContent = '⚠️ املأ جميع الحقول';
        errEl.classList.add('show'); return; }
      try {
        await auth.signInWithEmailAndPassword(email, pass);
        toast('✅ أهلاً وسهلاً');
      } catch (e) {
        errEl.textContent = '⚠️ ' + (e.code === 'auth/invalid-credential' ? 'بيانات خاطئة' : e.message);
        errEl.classList.add('show');
      }
    });

    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('loginScreen').classList.add('hide');
        setupPresence();
        loadGuides();
        loadAllUsers();
      } else {
        currentUser = null;
        document.getElementById('loginScreen').classList.remove('hide');
      }
    });

    function setupPresence() {
      if (!currentUser) return;
      const ref = rtdb.ref('presence/' + currentUser.uid);
      ref.set({ online: true, lastSeen: firebase.database.ServerValue.TIMESTAMP });
      ref.onDisconnect().set({ online: false, lastSeen: firebase.database.ServerValue.TIMESTAMP });
    }

    // ==================== GUIDES ====================
    function loadGuides() {
      if (!currentUser) return;
      db.collection('guides').where('userId', '==', currentUser.uid).onSnapshot(snap => {
        guides = [];
        snap.forEach(d => guides.push({ id: d.id, ...d.data() }));
        renderGuides();
      });
    }

    function renderGuides() {
      const q = (document.getElementById('searchInput')?.value || '').toLowerCase();
      let f = guides.filter(g => !q || (g.name || '').toLowerCase().includes(q) || (g.phone || '').includes(q));
      const container = document.getElementById('guidesList');
      if (!f.length) { container.innerHTML =
          '<div style="text-align:center;padding:40px;color:var(--muted);">😕 لا توجد نتائج</div>'; return; }
      container.innerHTML = f.map(g => `
        <div class="guide-card" style="border-right-color:${g.cardColor||'var(--gold)'}">
          <div class="name">${esc(g.name)}</div>
          <div class="phone">📞 ${esc(g.phone)}</div>
          <div style="font-size:11px;color:var(--muted);">🚐 ${esc(g.transportType||'—')} | 🏢 ${esc(g.agency||'—')} | 🚍 ${esc(g.plateNumber||'—')}</div>
          <div style="display:flex;gap:6px;margin-top:6px;">
            <button class="btn-save" style="padding:5px 12px;font-size:11px;" onclick="editGuide('${g.id}')">✏️</button>
            <button class="btn-cancel" style="padding:5px 12px;font-size:11px;" onclick="deleteGuide('${g.id}')">🗑️</button>
          </div>
        </div>
      `).join('');
    }

    window.editGuide = (id) => {
      const g = guides.find(x => x.id === id);
      if (!g) return;
      editGuideId = id;
      document.getElementById('gName').value = g.name || '';
      document.getElementById('gPhone').value = g.phone || '';
      document.getElementById('gPlate').value = g.plateNumber || '';
      document.getElementById('gTransport').value = g.transportType || '';
      document.getElementById('gAgency').value = g.agency || '';
      document.getElementById('gNotes').value = g.notes || '';
      document.getElementById('modalTitle').textContent = '✏️ تعديل';
      document.getElementById('guideModal').style.display = 'flex';
    };

    window.deleteGuide = async (id) => {
      if (confirm('حذف؟')) { await db.collection('guides').doc(id).delete();
        toast('تم الحذف'); }
    };

    document.getElementById('addGuideBtn').addEventListener('click', () => {
      editGuideId = null;
      document.getElementById('gName').value = '';
      document.getElementById('gPhone').value = '';
      document.getElementById('gPlate').value = '';
      document.getElementById('gTransport').value = '';
      document.getElementById('gAgency').value = '';
      document.getElementById('gNotes').value = '';
      document.getElementById('modalTitle').textContent = '➕ إضافة';
      document.getElementById('guideModal').style.display = 'flex';
    });

    document.getElementById('cancelGuideBtn').addEventListener('click', () => {
      document.getElementById('guideModal').style.display = 'none';
    });

    document.getElementById('saveGuideBtn').addEventListener('click', async () => {
      const name = document.getElementById('gName').value.trim();
      const phone = document.getElementById('gPhone').value.trim();
      if (!name || !phone) return toast('⚠️ الاسم والهاتف مطلوبين', true);
      const data = {
        userId: currentUser.uid,
        name,
        phone,
        plateNumber: document.getElementById('gPlate').value.trim(),
        transportType: document.getElementById('gTransport').value.trim(),
        agency: document.getElementById('gAgency').value.trim(),
        notes: document.getElementById('gNotes').value.trim(),
        cardColor: '#e94560',
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      if (editGuideId) {
        await db.collection('guides').doc(editGuideId).update(data);
      } else {
        data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        await db.collection('guides').add(data);
      }
      toast('✅ تم الحفظ');
      document.getElementById('guideModal').style.display = 'none';
    });

    document.getElementById('searchInput').addEventListener('input', renderGuides);

    // ==================== CHAT SYSTEM ====================
    async function loadAllUsers() {
      if (!currentUser) return;
      const snap = await db.collection('users').get();
      allUsers = [];
      snap.forEach(doc => { if (doc.id !== currentUser.uid) allUsers.push({ uid: doc.id, ...doc.data() }); });
      listenPresence();
      renderContacts();
    }

    function listenPresence() {
      allUsers.forEach(u => {
        rtdb.ref('presence/' + u.uid).on('value', snap => {
          presenceData[u.uid] = snap.val()?.online || false;
          renderContacts();
        });
      });
    }

    function renderContacts() {
      const row = document.getElementById('contactsRow');
      row.innerHTML = allUsers.map(u => `
        <div class="contact-chip ${presenceData[u.uid]?'online':''} ${selectedChatUid===u.uid?'selected':''}" onclick="openChat('${u.uid}')">
          <div class="avatar" style="background:${presenceData[u.uid]?'#10b981':'#94a3b8'};"></div>
          <div class="cname">${esc(u.displayName||u.email)}</div>
        </div>
      `).join('') || '<span style="font-size:11px;color:var(--muted);">ما فمّاش مستخدمين</span>';
    }

    window.openChat = function(uid) {
      selectedChatUid = uid;
      renderContacts();
      if (unsubscribeChat) unsubscribeChat();
      unsubscribeChat = db.collection('chatMessages')
        .where('participants', 'array-contains', currentUser.uid)
        .orderBy('timestamp', 'asc')
        .onSnapshot(snap => {
          chatMessages = [];
          snap.forEach(doc => {
            const data = doc.data();
            if (data.participants.includes(uid)) chatMessages.push({ id: doc.id, ...data });
          });
          renderMessages();
        });
    };

    function renderMessages() {
      const area = document.getElementById('messagesArea');
      if (!chatMessages.length) { area.innerHTML =
          '<div style="text-align:center;padding:40px;color:var(--muted);">💬 ما فمّة حتى رسالة</div>'; return; }
      area.innerHTML = chatMessages.map(m => {
        const mine = m.senderId === currentUser.uid;
        const sname = mine ? 'أنا' : (allUsers.find(u => u.uid === m.senderId)?.displayName || 'مستخدم');
        let body = '';
        switch (m.type) {
          case 'text':
            body = esc(m.text);
            break;
          case 'voice':
            body =
              `🎵 رسالة صوتية ${m.audioUrl?`<br><audio controls src="${m.audioUrl}" style="max-width:100%;"></audio>`:''}`;
            if (m.caption) body += `<div style="font-size:11px;color:var(--sub);margin-top:3px;">🗣️ ${esc(m.caption)}</div>`;
            break;
          case 'image':
            body = `<img src="${m.imageUrl}" onclick="window.open('${m.imageUrl}')" loading="lazy">`;
            if (m.caption) body +=
              `<div style="font-size:11px;color:var(--sub);margin-top:3px;">${esc(m.caption)}</div>`;
            break;
          case 'location':
            body =
              `<div onclick="window.open('https://maps.google.com/?q=${m.lat},${m.lng}')" style="cursor:pointer;background:#f0fdf4;padding:8px;border-radius:10px;">📍 الموقع</div>`;
            break;
          case 'silent':
            body = '🌊 موجة صامتة';
            break;
        }
        return `<div class="msg ${mine?'me':'other'}"><div class="sender">${esc(sname)}</div>${body}<div class="time">${new Date(m.timestamp?.toDate?.()||Date.now()).toLocaleTimeString('ar')}</div></div>`;
      }).join('');
      area.scrollTop = area.scrollHeight;
    }

    // ==================== إرسال نص ====================
    document.getElementById('sendTextBtn').addEventListener('click', () => {
      const text = document.getElementById('textInput').value.trim();
      if (!text || !selectedChatUid) return toast(selectedChatUid ? '⚠️ أكتب شيئاً' : '⚠️ اختار شكون', true);
      sendMessage('text', { text });
      document.getElementById('textInput').value = '';
    });

    document.getElementById('textInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') document.getElementById('sendTextBtn').click();
    });

    async function sendMessage(type, extra = {}) {
      if (!selectedChatUid) return;
      await db.collection('chatMessages').add({
        senderId: currentUser.uid,
        participants: [currentUser.uid, selectedChatUid],
        type,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        isRead: false,
        ...extra,
      });
    }

    // ==================== صورة ====================
    document.getElementById('attachImageBtn').addEventListener('click', () => document.getElementById('hiddenImageInput')
      .click());
    document.getElementById('hiddenImageInput').addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const blob = await fetch(ev.target.result).then(r => r.blob());
          const path = `images/${Date.now()}.jpg`;
          const snap = await storage.ref(path).put(blob);
          const url = await snap.ref.getDownloadURL();
          sendMessage('image', { imageUrl: url });
          toast('✅ تم إرسال التصويرة');
        } catch (ex) {
          sendMessage('image', { imageUrl: ev.target.result });
          toast('💾 تم الإرسال محلياً');
        }
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    // ==================== موقع ====================
    document.getElementById('sendLocationBtn').addEventListener('click', () => {
      if (!navigator.geolocation) return toast('⚠️ الموقع غير مدعوم', true);
      navigator.geolocation.getCurrentPosition(pos => {
        sendMessage('location', { lat: pos.coords.latitude, lng: pos.coords.longitude, locationName: 'وين راني' });
        toast('📍 تم إرسال الموقع');
      }, () => toast('⚠️ تعذر الموقع', true));
    });

    // ==================== إيموجي ====================
    document.getElementById('emojiBtn').addEventListener('click', () => {
      const e = prompt('أكتب إيموجي:');
      if (e) sendMessage('text', { text: e });
    });

    // ==================== موجة صامتة ====================
    document.getElementById('silentWaveBtn').addEventListener('click', () => {
      if (!selectedChatUid) return toast('⚠️ اختار شكون', true);
      sendMessage('silent', {});
      const fx = document.createElement('div');
      fx.className = 'silent-fx';
      document.body.appendChild(fx);
      setTimeout(() => fx.remove(), 550);
      navigator.vibrate?.([150, 80, 150]);
      toast('🌊 طارت الموجة');
    });

    // ==================== ميكروفون PTT ====================
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      speechRecognition = new SR();
      speechRecognition.lang = 'ar-SA';
      speechRecognition.continuous = false;
    }

    const pttBtn = document.getElementById('pttMainBtn');
    let isHolding = false,
      holdTimer = null;

    pttBtn.addEventListener('mousedown', (e) => { e.preventDefault();
      startHold(); });
    pttBtn.addEventListener('mouseup', endHold);
    pttBtn.addEventListener('mouseleave', endHold);
    pttBtn.addEventListener('touchstart', (e) => { e.preventDefault();
      startHold(); });
    pttBtn.addEventListener('touchend', endHold);
    pttBtn.addEventListener('touchcancel', endHold);

    function startHold() {
      if (!selectedChatUid) return toast('⚠️ اختار شكون باش تكلّم', true);
      isHolding = true;
      holdTimer = setTimeout(() => { if (isHolding) startRecording(); }, 250);
    }

    function endHold() {
      isHolding = false;
      clearTimeout(holdTimer);
      if (recording) stopRecording();
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        mediaRecorder = new MediaRecorder(stream);
        const chunks = [];
        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = async () => {
          const blob = new Blob(chunks, { type: 'audio/webm' });
          const path = `voice/${currentUser.uid}_${Date.now()}.webm`;
          const snap = await storage.ref(path).put(blob);
          const url = await snap.ref.getDownloadURL();
          sendMessage('voice', { audioUrl: url, caption: latestTranscript || '' });
          stream.getTracks().forEach(t => t.stop());
          latestTranscript = '';
        };
        mediaRecorder.start();
        recording = true;
        pttBtn.classList.add('recording');
        if (speechRecognition) {
          speechRecognition.start();
          speechRecognition.onresult = (e) => {
            latestTranscript = e.results[0][0].transcript;
            toast('🗣️ سمعتك: ' + latestTranscript.substring(0, 50));
          };
        }
        vibrate(10);
        toast('🎙️ تسجّل...');
      } catch (e) {
        toast('⚠️ الميكروفون مسدود', true);
      }
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      recording = false;
      pttBtn.classList.remove('recording');
      if (speechRecognition) speechRecognition.stop();
    }

    // ==================== SIDEBAR & NAVIGATION ====================
    document.getElementById('menuBtn').addEventListener('click', () => {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('overlay').classList.add('show');
    });
    document.getElementById('closeSidebar').addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
    });
    document.getElementById('overlay').addEventListener('click', () => {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
    });

    document.getElementById('darkModeBtn').addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });

    document.getElementById('signOutBtn').addEventListener('click', () => {
      if (confirm('تسجيل الخروج؟')) auth.signOut();
    });

    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(tab.dataset.page).classList.add('active');
      });
    });

    // ==================== FLOATING BUBBLE ====================
    document.getElementById('floatingBubble').addEventListener('click', () => {
      document.querySelector('.nav-tab[data-page="pageChat"]').click();
      document.getElementById('floatingBubble').classList.remove('show');
    });

    // ==================== إغلاق المودالات ====================
    document.querySelectorAll('.modal').forEach(m => {
      m.addEventListener('click', function(e) { if (e.target === this) this.style.display = 'none'; });
    });

    console.log('🚀 F-Note Pro جاهز - الدردشة التونسية شغالة');
  </script>
</body>
</html>
