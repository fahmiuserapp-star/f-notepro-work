<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <meta name="theme-color" content="#e94560">
    <title>F-Note Pro | خزنة المرشدين + لاسلكي متطور</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg: #f0f2f5;
            --card: #ffffff;
            --text: #1a1a2e;
            --sub: #545f71;
            --muted: #8b95a5;
            --border: #e2e8f0;
            --gold: #e94560;
            --gold-light: #ff6b81;
            --success: #10b981;
            --danger: #ef4444;
            --walkie: #25D366;
            --walkie-glow: #2ecc71;
            --my-msg: #e8f5e9;
            --friend-msg: #ffffff;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.12);
            --radius: 20px;
            --radius-sm: 14px;
            --radius-full: 60px;
            --font: 'Segoe UI', 'Tajawal', system-ui, sans-serif;
            --transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --bottom-nav-h: 70px;
        }
        body.dark {
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f1f5f9;
            --sub: #cbd5e1;
            --muted: #94a3b8;
            --border: #334155;
            --my-msg: #1a3a2a;
            --friend-msg: #1e293b;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: var(--bg);
            font-family: var(--font);
            color: var(--text);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            transition: background var(--transition), color var(--transition);
            padding-bottom: var(--bottom-nav-h);
        }
        body::after {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 45%;
            max-width: 260px;
            aspect-ratio: 1;
            background: url('https://i.ibb.co/KxCpMmmq/1777593015229-removebg-preview.png') center/contain no-repeat;
            opacity: 0.03;
            z-index: 0;
            pointer-events: none;
        }

        /* شاشة الدخول */
        .login-screen {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-screen.hide {
            display: none;
        }
        .login-card {
            background: var(--card);
            border-radius: 32px;
            padding: 32px 22px;
            width: 100%;
            max-width: 370px;
            text-align: center;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
        }
        .login-logo img {
            width: 80px;
            margin-bottom: 10px;
        }
        .login-title {
            font-size: 24px;
            font-weight: 900;
            color: var(--gold);
            margin-bottom: 4px;
        }
        .login-sub {
            font-size: 11px;
            color: var(--muted);
            margin-bottom: 18px;
        }
        .login-input {
            width: 100%;
            padding: 12px 15px;
            margin: 5px 0;
            border: 2px solid var(--border);
            border-radius: var(--radius-full);
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            outline: none;
            transition: var(--transition);
            direction: ltr;
        }
        .login-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.08);
        }
        .login-btn {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: none;
            border-radius: var(--radius-full);
            background: var(--gold);
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: var(--transition);
        }
        .login-btn:active {
            transform: scale(0.95);
        }
        .login-error {
            color: #ef4444;
            font-size: 11px;
            margin-top: 6px;
            display: none;
        }
        .login-error.show {
            display: block;
        }

        /* الهيدر */
        .header {
            background: var(--card);
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
            border-bottom: 1px solid var(--border);
        }
        .header-logo img {
            height: 38px;
        }
        .header-menu {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--bg);
            border: none;
            font-size: 20px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            color: var(--sub);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* التنقل السفلي */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--card);
            display: flex;
            border-top: 1px solid var(--border);
            z-index: 999;
            height: var(--bottom-nav-h);
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.04);
        }
        .nav-tab {
            flex: 1;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
            border: none;
            background: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            transition: var(--transition);
            position: relative;
        }
        .nav-tab.active {
            color: var(--gold);
        }
        .nav-tab .ico {
            font-size: 20px;
        }
        .nav-tab .badge-count {
            position: absolute;
            top: 4px;
            right: 50%;
            transform: translateX(30px);
            background: var(--danger);
            color: #fff;
            font-size: 9px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }
        .page {
            display: none;
        }
        .page.active {
            display: block;
        }

        /* صفحة المرشدين */
        .toolbar {
            display: flex;
            padding: 8px 12px;
            gap: 8px;
            background: var(--bg);
            position: sticky;
            top: 54px;
            z-index: 90;
        }
        .search-wrap {
            flex: 1;
            display: flex;
            gap: 6px;
        }
        .search-box {
            flex: 1;
            padding: 10px 14px;
            border: 2px solid transparent;
            border-radius: var(--radius-full);
            background: var(--card);
            color: var(--text);
            font-size: 13px;
            outline: none;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .search-box:focus {
            border-color: var(--gold);
        }
        .voice-btn,
        .add-btn {
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .voice-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--card);
            font-size: 18px;
            color: var(--sub);
            box-shadow: var(--shadow);
        }
        .voice-btn.listening {
            background: var(--success);
            color: #fff;
            animation: pulse 0.6s infinite;
        }
        .add-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--gold);
            color: #fff;
            font-size: 26px;
            box-shadow: 0 4px 14px rgba(233, 69, 96, 0.3);
        }
        @keyframes pulse {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
        }
        .filter-wrap {
            padding: 2px 12px 6px;
        }
        .filter-toggle {
            width: 100%;
            padding: 9px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius-full);
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            color: var(--sub);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .colors-panel {
            display: none;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
            padding: 12px;
            background: var(--card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            justify-content: center;
        }
        .colors-panel.show {
            display: flex;
        }
        .color-dot {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: var(--transition);
        }
        .color-dot.active {
            border-color: var(--gold);
            transform: scale(1.15);
            box-shadow: 0 0 12px rgba(233, 69, 96, 0.3);
        }
        .guides-list {
            padding: 6px 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .guide-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 12px 14px;
            box-shadow: var(--shadow);
            border-right: 4px solid var(--gold);
            cursor: pointer;
            transition: var(--transition);
        }
        .guide-card:active {
            transform: scale(0.98);
        }
        .card-top {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-avatar {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            object-fit: cover;
            border: 2px solid var(--gold);
            background: var(--bg);
            flex-shrink: 0;
            cursor: pointer;
        }
        .card-info {
            flex: 1;
            min-width: 0;
        }
        .card-name {
            font-size: 14px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card-phone {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--bg);
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 600;
            color: var(--gold);
            direction: ltr;
            margin-top: 2px;
        }
        .card-phone .call-btn {
            background: var(--success);
            border: none;
            color: #fff;
            padding: 2px 8px;
            border-radius: 15px;
            font-size: 9px;
            cursor: pointer;
        }
        .card-chevron {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            color: var(--muted);
        }
        .card-details {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid var(--border);
            display: none;
        }
        .card-details.show {
            display: block;
        }
        .details-box {
            background: var(--bg);
            padding: 10px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            line-height: 1.7;
        }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 15px;
            font-size: 9px;
            font-weight: 700;
            margin: 0 2px;
        }
        .badge-plate {
            background: var(--gold);
            color: #fff;
        }
        .badge-public {
            background: #3b82f6;
            color: #fff;
        }
        .badge-private {
            background: #64748b;
            color: #fff;
        }
        .action-row {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .btn-sm {
            padding: 6px 10px;
            border-radius: 20px;
            border: none;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            flex: 1;
            min-width: 55px;
            text-align: center;
        }
        .btn-edit {
            background: var(--success);
            color: #fff;
        }
        .btn-del {
            background: var(--danger);
            color: #fff;
        }
        .btn-share {
            background: #25D366;
            color: #fff;
        }
        .btn-fav {
            background: #f59e0b;
            color: #fff;
        }

        /* ============ صفحة اللاسلكي (الدردشة المتطورة) ============ */
        .radio-page-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - var(--bottom-nav-h) - 54px);
            background: var(--bg);
        }
        .chat-header-bar {
            background: var(--card);
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border);
            box-shadow: var(--shadow);
            z-index: 10;
        }
        .chat-header-bar h4 {
            flex: 1;
            font-size: 15px;
            color: var(--gold);
        }
        .chat-search-input {
            flex: 1;
            padding: 8px 12px;
            border-radius: var(--radius-full);
            border: 2px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 12px;
            outline: none;
            transition: var(--transition);
        }
        .chat-search-input:focus {
            border-color: var(--gold);
        }
        .chat-header-btn {
            background: var(--bg);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            color: var(--sub);
        }
        .chat-header-btn:active {
            background: var(--border);
            transform: scale(0.9);
        }
        .friends-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 10px 14px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
        }
        .friend-chip {
            flex-shrink: 0;
            text-align: center;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: var(--radius);
            background: var(--bg);
            box-shadow: var(--shadow);
            min-width: 55px;
            position: relative;
            transition: var(--transition);
            border: 2px solid transparent;
        }
        .friend-chip.selected {
            border-color: var(--gold);
            background: #fef2f2;
        }
        body.dark .friend-chip.selected {
            background: #2d1b2a;
        }
        .friend-chip-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--border);
            background: var(--bg);
        }
        .friend-chip-name {
            font-size: 10px;
            margin-top: 4px;
            color: var(--text);
            max-width: 60px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .online-dot-mini {
            position: absolute;
            top: 6px;
            right: 10px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #10b981;
            border: 2px solid #fff;
            box-shadow: 0 0 6px rgba(16, 185, 129, 0.5);
        }
        .offline-dot-mini {
            background: #94a3b8;
        }
        .add-friend-chip {
            flex-shrink: 0;
            text-align: center;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: var(--radius);
            background: var(--gold);
            color: #fff;
            border: none;
            font-weight: 700;
            font-size: 11px;
            min-width: 55px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        /* منطقة الدردشة */
        .chat-messages-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--bg);
        }
        .msg-wrapper {
            display: flex;
            gap: 8px;
            max-width: 90%;
            animation: msgSlide 0.3s ease;
        }
        @keyframes msgSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .msg-wrapper.mine {
            align-self: flex-end;
        }
        .msg-wrapper.friend {
            align-self: flex-start;
        }
        .msg-avatar-img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--bg);
            flex-shrink: 0;
            border: 2px solid var(--border);
        }
        .msg-body {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .msg-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
            position: relative;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .msg-wrapper.mine .msg-bubble {
            background: var(--my-msg);
            border-bottom-left-radius: 4px;
        }
        .msg-wrapper.friend .msg-bubble {
            background: var(--friend-msg);
            border-bottom-right-radius: 4px;
        }
        .msg-sender-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--gold);
            margin-bottom: 2px;
        }
        .msg-time-label {
            font-size: 9px;
            color: var(--muted);
            margin-top: 4px;
            text-align: left;
            direction: ltr;
        }
        .msg-image {
            max-width: 200px;
            border-radius: 14px;
            cursor: pointer;
            border: 2px solid var(--border);
        }
        .msg-location-card {
            background: #f0fdf4;
            border-radius: 14px;
            padding: 10px;
            cursor: pointer;
            border: 1px solid #bbf7d0;
        }
        body.dark .msg-location-card {
            background: #1a2e22;
            border-color: #2d5a3d;
        }
        .msg-location-card .loc-icon {
            font-size: 20px;
        }
        .msg-location-card .loc-text {
            font-size: 10px;
            color: var(--sub);
            margin-top: 3px;
        }
        .play-msg-btn {
            background: var(--walkie);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(37, 211, 102, 0.3);
        }
        .play-msg-btn:active {
            transform: scale(0.93);
            background: #1da851;
        }
        .play-msg-btn.played {
            opacity: 0.6;
            background: #64748b;
        }

        /* شريط الإدخال السفلي */
        .chat-input-bar {
            display: flex;
            gap: 8px;
            padding: 10px 12px;
            background: var(--card);
            border-top: 1px solid var(--border);
            align-items: center;
            box-shadow: 0 -2px 8px rgba(0, 0, 0, 0.04);
        }
        .chat-input {
            flex: 1;
            padding: 10px 14px;
            border-radius: var(--radius-full);
            border: 2px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            outline: none;
            transition: var(--transition);
        }
        .chat-input:focus {
            border-color: var(--gold);
        }
        .chat-action-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            background: var(--bg);
            color: var(--sub);
            flex-shrink: 0;
        }
        .chat-action-btn:active {
            transform: scale(0.9);
        }
        .chat-action-btn.send-btn {
            background: var(--gold);
            color: #fff;
            box-shadow: 0 3px 10px rgba(233, 69, 96, 0.3);
        }
        .chat-action-btn.ptt-btn {
            background: var(--walkie);
            color: #fff;
            width: 48px;
            height: 48px;
            font-size: 22px;
            box-shadow: 0 4px 16px rgba(37, 211, 102, 0.4);
            position: relative;
        }
        .chat-action-btn.ptt-btn.recording {
            background: #ef4444;
            animation: pttPulse 0.5s infinite;
            box-shadow: 0 0 28px rgba(239, 68, 68, 0.7);
        }
        @keyframes pttPulse {
            0%,
            100% {
                transform: scale(1);
                box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
            }
            50% {
                transform: scale(1.18);
                box-shadow: 0 0 40px rgba(239, 68, 68, 0.9);
            }
        }
        .ptt-ripple {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(37, 211, 102, 0.5);
            animation: ripple 1.5s infinite;
        }
        @keyframes ripple {
            0% {
                transform: scale(1);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }
        .ptt-label {
            font-size: 8px;
            font-weight: 700;
            position: absolute;
            bottom: -16px;
            white-space: nowrap;
            color: var(--walkie);
        }

        /* النوافذ */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1600;

    <script>
        // ==================== إعدادات Firebase & Cloudinary ====================
        const firebaseConfig = {
            apiKey: "AIzaSyC4vYbhHGfAWMSh-fRl4NlG1WiEyS6Ez9s",
            authDomain: "f-notepro-work-2d25b.firebaseapp.com",
            databaseURL: "https://f-notepro-work-2d25b-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "f-notepro-work-2d25b",
            storageBucket: "f-notepro-work-2d25b.firebasestorage.app",
            messagingSenderId: "221438380381",
            appId: "1:221438380381:web:b46c35d0ec0944079480b4"
        };
        const CLOUD_NAME = 'dmhtx93nj',
            UPLOAD_PRESET = 'fcloud_preset';
        const CLOUDINARY_URL = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore(app);
        const auth = firebase.auth(app);
        const storage = firebase.storage(app);
        const rtdb = firebase.database(app);
        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

        // متغيرات
        let currentUser = null;
        let guides = [],
            editId = null,
            selectedColor = '#e94560',
            colorFilter = 'all',
            detailGuide = null;
        let guidePhotoData = '',
            busPhotoData = '';
        let userProfile = { displayName: '', photoURL: '' };
        let friends = [],
            friendsPresence = {};
        let chatMessages = [];
        let selectedFriendUid = null;
        let isRecordingPTT = false;
        let mediaRecorderPTT, pttChunks = [];

        // ==================== دوال مساعدة ====================
        function toast(msg, err = false) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.style.background = err ? 'rgba(239,68,68,0.92)' : 'rgba(15,23,42,0.9)';
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => { t.style.opacity = '0';
                t.style.transition = '0.3s';
                setTimeout(() => t.remove(), 300); }, 2200);
        }

        function esc(s) { if (!s) return '';
            const m = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }; return String(s).replace(
                /[&<>"']/g, c => m[c]); }

        function validPhone(p) { return /^\+?[0-9]{8,15}$/.test(p.replace(/[\s\-\(\)]/g, '')); }

        function sanitize(s) { return s.replace(/[<>]/g, '').trim(); }

        async function uploadToCloudinary(base64) {
            if (!navigator.onLine) return null;
            try {
                const blob = await fetch(base64).then(r => r.blob());
                const fd = new FormData();
                fd.append('file', blob, 'img_' + Date.now() + '.jpg');
                fd.append('upload_preset', UPLOAD_PRESET);
                const res = await fetch(CLOUDINARY_URL, { method: 'POST', body: fd });
                if (!res.ok) throw new Error('Upload failed');
                const data = await res.json();
                return data.secure_url;
            } catch (e) { return null; }
        }

        function handleImage(file, type) {
            if (!file) return;
            const stat = document.getElementById(type === 'guide' ? 'guideUploadStat' : 'busUploadStat');
            const prev = document.getElementById(type === 'guide' ? 'guidePreviewImg' : 'busPreviewImg');
            const wrap = document.getElementById(type === 'guide' ? 'guidePreviewWrap' : 'busPreviewWrap');
            if (stat) stat.textContent = '⏳ ضغط...';
            const r = new FileReader();
            r.onload = async (e) => {
                const img = new Image();
                img.onload = async () => {
                    const c = document.createElement('canvas');
                    const mw = 450;
                    let w = img.width,
                        h = img.height;
                    if (w > mw) { h *= mw / w;
                        w = mw; }
                    c.width = Math.round(w);
                    c.height = Math.round(h);
                    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
                    const b64 = c.toDataURL('image/jpeg', 0.55);
                    if (stat) stat.textContent = '☁️ رفع...';
                    const url = await uploadToCloudinary(b64);
                    const final = url || b64;
                    if (stat) stat.textContent = url ? '✅ Cloudinary' : '✅ محلي';
                    if (type === 'guide') guidePhotoData = final;
                    else busPhotoData = final;
                    if (prev) prev.src = b64;
                    if (wrap) wrap.style.display = 'flex';
                };
                img.src = e.target.result;
            };
            r.readAsDataURL(file);
        }

        function pickImage(type) {
            const inp = document.createElement('input');
            inp.type = 'file';
            inp.accept = 'image/*';
            inp.capture = 'environment';
            inp.onchange = e => { if (e.target.files[0]) handleImage(e.target.files[0], type); };
            inp.click();
        }

        // ==================== المرشدين ====================
        async function saveGuide(data) {
            if (!currentUser) throw new Error('سجل الدخول');
            const ref = data.id ? db.collection('guides').doc(data.id) : db.collection('guides').doc();
            const doc = {
                userId: currentUser.uid,
                creatorName: userProfile.displayName || currentUser.email,
                creatorPhoto: userProfile.photoURL || '',
                name: sanitize(data.name),
                phone: data.phone.replace(/[\s\-\(\)]/g, ''),
                plateNumber: sanitize(data.plate || ''),
                guidePhoto: guidePhotoData || null,
                busPhoto: busPhotoData || null,
                cardColor: data.color,
                transportType: sanitize(data.transport || ''),
                agency: sanitize(data.agency || ''),
                notes: sanitize(data.notes || ''),
                favorite: data.fav || false,
                visibility: data.vis || 'private',
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            if (!data.id) doc.createdAt = firebase.firestore.FieldValue.serverTimestamp();
            await ref.set(doc, { merge: true });
        }
        let unsubGuides = null;

        function listenGuides() {
            if (unsubGuides) unsubGuides();
            if (!currentUser) return;
            unsubGuides = db.collection('guides').where('userId', '==', currentUser.uid).onSnapshot(snap => {
                let mine = [];
                snap.forEach(d => mine.push({ id: d.id, ...d.data() }));
                db.collection('guides').where('visibility', '==', 'public').get().then(ps => {
                    let pubs = [];
                    ps.forEach(d => { if (d.data().userId !== currentUser.uid) pubs.push({ id: d.id, ...d
                            .data() }); });
                    const all = [...mine, ...pubs];
                    const u = new Map();
                    all.forEach(g => u.set(g.id, g));
                    guides = Array.from(u.values());
                    renderGuides();
                }).catch(() => { guides = mine;
                    renderGuides(); });
            });
        }

        function filterGuides() {
            const q = document.getElementById('searchInput')?.value.toLowerCase() || '';
            let f = guides.filter(g => !q || (g.name || '').toLowerCase().includes(q) || (g.phone || '').includes(q) || (
                g.transportType || '').includes(q) || (g.agency || '').includes(q) || (g.plateNumber || '').includes(
                q));
            if (colorFilter !== 'all') f = f.filter(g => g.cardColor === colorFilter);
            f.sort((a, b) => (b.favorite ? 1 : 0) - (a.favorite ? 1 : 0));
            return f;
        }

        function renderGuides() {
            const f = filterGuides();
            const c = document.getElementById('guidesContainer');
            if (!f.length) { c.innerHTML = '<div class="loading-msg">😕 لا نتائج</div>'; return; }
            c.innerHTML = f.map(g => {
                const own = g.userId === currentUser?.uid;
                const star = g.favorite ? '⭐ ' : '';
                const vis = g.visibility === 'public' ?
                    '<span class="badge badge-public">🌍 عام</span>' :
                    '<span class="badge badge-private">🔒 خاص</span>';
                const creator = (!own && g.visibility === 'public') ?
                    `<div style="font-size:9px;color:var(--muted);">👤 ${esc(g.creatorName||'')}</div>` : '';
                return `
                <div class="guide-card" style="border-right-color:${esc(g.cardColor)}" onclick="showDetail('${g.id}')">
                  <div class="card-top">
                    <img class="card-avatar" src="${g.guidePhoto||''}" onclick="event.stopPropagation();viewImage('${g.guidePhoto||''}')" onerror="this.style.display='none'">
                    <div class="card-info">
                      <div class="card-name">${star}${esc(g.name)} ${vis}</div>
                      <div class="card-phone"><span>${esc(g.phone)}</span><button class="call-btn" onclick="event.stopPropagation();location.href='tel:${esc(g.phone)}'">📞</button></div>
                      ${creator}
                    </div>
                    <button class="card-chevron" onclick="event.stopPropagation();toggleDet('${g.id}',this)">▼</button>
                  </div>
                  <div id="det-${g.id}" class="card-details">...</div>
                </div>`;
            }).join('');
        }
        window.toggleDet = (id, btn) => { const el = document.getElementById('det-' + id); if (el) { el.classList.toggle(
                'show');
                btn.textContent = el.classList.contains('show') ? '▲' : '▼'; } };
        window.viewImage = url => { if (url) { document.getElementById('fullImage').src = url;
                document.getElementById('fullImageModal').classList.add('show'); } };
        window.toggleFav = async id => { const g = guides.find(x => x.id === id); if (g && g.userId === currentUser?.uid) { await db
                    .collection('guides').doc(id).update({ favorite: !g.favorite });
                toast(g.favorite ? 'أزيل من المفضلة' : '⭐ أضيف للمفضلة'); } };
        window.editGuide = id => { /* نفس السابق */ };
        window.delGuide = async id => { if (confirm('حذف؟')) { await db.collection('guides').doc(id).delete();
                toast('تم الحذف'); } };
        window.showDetail = id => { /* نفس السابق */ };
        window.openShare = id => { /* نفس السابق */ };

        // ==================== البحث عن الأصدقاء (Firebase) ====================
        document.getElementById('friendSearchInput').addEventListener('input', async function() {
            const q = this.value.trim().toLowerCase();
            if (q.length < 2) return;
            // البحث في users collection بالبريد أو الاسم
            const snap1 = await db.collection('users').where('email', '>=', q).where('email', '<=', q + '\uf8ff')
                .limit(5).get();
            const snap2 = await db.collection('users').where('displayName', '>=', q).where('displayName', '<=', q +
                '\uf8ff').limit(5).get();
            const results = new Map();
            snap1.forEach(d => results.set(d.id, d.data()));
            snap2.forEach(d => results.set(d.id, d.data()));
            // عرض النتائج في dropdown
            showSearchResults(Array.from(results.entries()).map(([uid, data]) => ({ uid, ...data })));
        });

        function showSearchResults(users) {
            let modal = document.getElementById('searchResultsModal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'searchResultsModal';
                modal.className = 'modal';
                modal.innerHTML =
                    '<div class="modal-box"><h3>🔍 نتائج البحث</h3><div id="searchResultsList"></div><button class="btn-cancel" id="closeSearchResultsBtn">إغلاق</button></div>';
                document.body.appendChild(modal);
                modal.querySelector('#closeSearchResultsBtn').onclick = () => modal.classList.remove('show');
            }
            const list = modal.querySelector('#searchResultsList');
            list.innerHTML = users.filter(u => u.uid !== currentUser?.uid).map(u => `
            <div class="search-result-item" onclick="addFriendDirect('${u.uid}')">
              <img src="${u.photoURL||''}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;" onerror="this.style.display='none'">
              <div><strong>${esc(u.displayName||u.email)}</strong><br><small>${esc(u.email)}</small></div>
            </div>`).join('') || '<p style="text-align:center;color:var(--muted);">لا توجد نتائج</p>';
            modal.classList.add('show');
        }
        window.addFriendDirect = async (uid) => {
            const exist = await db.collection('friendships').where('users', 'array-contains', currentUser.uid).get();
            let found = false;
            exist.forEach(doc => { if (doc.data().users.includes(uid)) found = true; });
            if (found) return toast('موجود بالفعل');
            await db.collection('friendships').add({ users: [currentUser.uid, uid],
                createdAt: firebase.firestore.FieldValue.serverTimestamp() });
            toast('✅ تمت الإضافة');
            document.getElementById('searchResultsModal').classList.remove('show');
            loadFriends();
        };

        // ==================== نظام الدردشة المتطور ====================
        async function loadFriends() {
            if (!currentUser) return;
            const snap = await db.collection('friendships').where('users', 'array-contains', currentUser.uid).get();
            friends = [];
            snap.forEach(doc => { const data = doc.data();
                const fUid = data.users.find(u => u !== currentUser.uid); if (fUid) friends.push({ uid: fUid, name: '',
                    photo: '' }); });
            for (let f of friends) {
                const userDoc = await db.collection('users').doc(f.uid).get();
                if (userDoc.exists) { const d = userDoc.data();
                    f.name = d.displayName || d.email;
                    f.photo = d.photoURL || ''; }
            }
            listenFriendsPresence();
            renderFriendChips();
        }

        function listenFriendsPresence() {
            friends.forEach(f => {
                rtdb.ref('presence/' + f.uid).on('value', snap => { friendsPresence[f.uid] = snap.val()
                        ?.online || false;
                    renderFriendChips(); });
            });
        }

        function renderFriendChips() {
            const c = document.getElementById('friendChipsRow');
            let html = '';
            friends.forEach(f => {
                const online = friendsPresence[f.uid];
                html += `
                <div class="friend-chip ${selectedFriendUid===f.uid?'selected':''}" onclick="selectFriend('${f.uid}')">
                  <img class="friend-chip-avatar" src="${f.photo||''}" onerror="this.style.display='none'">
                  <div class="friend-chip-name">${esc(f.name||'مستخدم')}</div>
                  <span class="online-dot-mini ${online?'':'offline-dot-mini'}"></span>
                </div>`;
            });
            html +=
                '<button class="add-friend-chip" id="addFriendChipBtnInner">➕<br>أضف</button>';
            c.innerHTML = html;
            document.getElementById('addFriendChipBtnInner').onclick = () => document.getElementById('addFriendModal')
                .classList.add('show');
            document.getElementById('addFriendChipBtn').onclick = () => document.getElementById('addFriendModal').classList
                .add('show');
        }

        function selectFriend(uid) {
            selectedFriendUid = uid;
            renderFriendChips();
            loadChatMessages();
        }
        window.selectFriend = selectFriend;

        async function loadChatMessages() {
            if (!selectedFriendUid || !currentUser) {
                document.getElementById('chatMessagesArea').innerHTML =
                    '<div class="loading-msg">👋 اختر صديقاً لبدء الدردشة</div>';
                return;
            }
            const participants = [currentUser.uid, selectedFriendUid];
            const snap = await db.collection('chatMessages')
                .where('participants', 'array-contains', currentUser.uid)
                .orderBy('timestamp', 'asc')
                .get();
            chatMessages = [];
            snap.forEach(doc => {
                const data = doc.data();
                if (data.participants.includes(selectedFriendUid)) {
                    chatMessages.push({ id: doc.id, ...data });
                }
            });
            // أيضاً تحميل الرسائل الصوتية
            const voiceSnap = await db.collection('voiceMessages')
                .where('participants', 'array-contains', currentUser.uid)
                .orderBy('timestamp', 'asc')
                .get();
            voiceSnap.forEach(doc => {
                const data = doc.data();
                if (data.participants.includes(selectedFriendUid)) {
                    chatMessages.push({ id: doc.id, ...data, type: 'voice' });
                }
            });
            chatMessages.sort((a, b) => (a.timestamp?.toMillis() || 0) - (b.timestamp?.toMillis() || 0));
            renderChatMessages();
        }

        function renderChatMessages() {
            const area = document.getElementById('chatMessagesArea');
            if (!chatMessages.length) { area.innerHTML = '<div class="loading-msg">💬 لا توجد رسائل بعد</div>'; return; }
            area.innerHTML = chatMessages.map(msg => {
                const mine = msg.senderId === currentUser.uid;
                const sender = mine ? (userProfile.displayName || 'أنت') : (friends.find(f => f.uid === msg
                    .senderId)?.name || 'مستخدم');
                const avatar = mine ? (userProfile.photoURL || '') : (friends.find(f => f.uid === msg.senderId)
                    ?.photo || '');
                const time = msg.timestamp ? new Date(msg.timestamp.toMillis()).toLocaleTimeString('ar-TN') : '';
                let content = '';
                if (msg.type === 'voice') {
                    content =
                        `<button class="play-msg-btn ${msg.openedBy?.[currentUser.uid]?'played':''}" onclick="playAudio('${msg.audioUrl}','${msg.id}')">▶️ رسالة صوتية</button>`;
                } else if (msg.type === 'image') {
                    content =
                        `<img src="${msg.imageUrl}" class="msg-image" onclick="viewImage('${msg.imageUrl}')" loading="lazy">`;
                } else if (msg.type === 'location') {
                    content = `
                    <div class="msg-location-card" onclick="window.open('https://maps.google.com/?q=${msg.lat},${msg.lng}','_blank')">
                      <div class="loc-icon">📍</div>
                      <div class="loc-text">${msg.locationName||'موقع مشترك'}<br><small>${msg.lat?.toFixed(5)}, ${msg.lng?.toFixed(5)}</small></div>
                    </div>`;
                } else {
                    content = `<span>${esc(msg.text||'')}</span>`;
                }
                return `
                <div class="msg-wrapper ${mine?'mine':'friend'}">
                  <img class="msg-avatar-img" src="${avatar}" onerror="this.style.display='none'">
                  <div class="msg-body">
                    <div class="msg-sender-label">${esc(sender)}</div>
                    <div class="msg-bubble">${content}</div>
                    <div class="msg-time-label">${time}</div>
                  </div>
                </div>`;
            }).join('');
            area.scrollTop = area.scrollHeight;
        }
        window.playAudio = async (url, msgId) => {
            const audio = new Audio(url);
            await audio.play();
            if (msgId) {
                const ref = db.collection('voiceMessages').doc(msgId);
                const deleteAt = new Date(Date.now() + 10 * 60 * 1000);
                await ref.update({ [`openedBy.${currentUser.uid}`]: { openedAt: firebase.firestore.FieldValue
                        .serverTimestamp(), deleteAt: firebase.firestore.Timestamp.fromDate(deleteAt) } });
                loadChatMessages();
            }
        };

        // إرسال رسالة نصية
        async function sendTextMessage() {
            const input = document.getElementById('chatTextInput');
            const text = input.value.trim();
            if (!text || !selectedFriendUid) return;
            await db.collection('chatMessages').add({
                senderId: currentUser.uid,
                participants: [currentUser.uid, selectedFriendUid],
                type: 'text',
                text: text,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });
            input.value = '';
            loadChatMessages();
        }

        // إرسال صورة
        async function sendImageMessage(file) {
            if (!file || !selectedFriendUid) return;
            const reader = new FileReader();
            reader.onload = async (e) => {
                const url = await uploadToCloudinary(e.target.result) || e.target.result;
                await db.collection('chatMessages').add({
                    senderId: currentUser.uid,
                    participants: [currentUser.uid, selectedFriendUid],
                    type: 'image',
                    imageUrl: url,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                loadChatMessages();
            };
            reader.readAsDataURL(file);
        }

        // إرسال الموقع
        async function sendLocation() {
            if (!selectedFriendUid) return toast('اختر صديقاً أولاً', true);
            if (!navigator.geolocation) return toast('الموقع غير مدعوم', true);
            navigator.geolocation.getCurrentPosition(async (pos) => {
                const { latitude, longitude } = pos.coords;
                let locationName = '';
                try {
                    const res = await fetch(
                        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&accept-language=ar`);
                    const data = await res.json();
                    locationName = data.display_name || '';
                } catch (e) {}
                await db.collection('chatMessages').add({
                    senderId: currentUser.uid,
                    participants: [currentUser.uid, selectedFriendUid],
                    type: 'location',
                    lat: latitude,
                    lng: longitude,
                    locationName: locationName,
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                loadChatMessages();
                toast('📍 تم إرسال الموقع');
            }, () => toast('تعذر تحديد الموقع', true), { enableHighAccuracy: true });
        }

        // PTT تسجيل صوتي
        async function startPTT() {
            if (isRecordingPTT || !selectedFriendUid) return;
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorderPTT = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
            pttChunks = [];
            mediaRecorderPTT.ondataavailable = e => pttChunks.push(e.data);
            mediaRecorderPTT.onstop = async () => {
                const blob = new Blob(pttChunks, { type: 'audio/webm' });
                const path = `voice/${currentUser.uid}_${Date.now()}.webm`;
                const snap = await storage.ref(path).put(blob);
                const url = await snap.ref.getDownloadURL();
                const participants = [currentUser.uid, selectedFriendUid];
                const expiresAt = new Date(Date.now() + 24 * 60 * 60 * 1000);
                await db.collection('voiceMessages').add({
                    senderId: currentUser.uid,
                    participants,
                    audioUrl: url,
                    type: 'voice',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp(),
                    expiresAt: firebase.firestore.Timestamp.fromDate(expiresAt),
                    openedBy: {}
                });
                loadChatMessages();
                stream.getTracks().forEach(t => t.stop());
            };
            mediaRecorderPTT.start();
            isRecordingPTT = true;
            document.getElementById('pttRecordBtn').classList.add('recording');
            document.getElementById('pttRecordBtn').querySelector('.ptt-label').textContent = 'جاري...';
        }

        function stopPTT() {
            if (mediaRecorderPTT && isRecordingPTT && mediaRecorderPTT.state !== 'inactive') {
                mediaRecorderPTT.stop();
                isRecordingPTT = false;
                document.getElementById('pttRecordBtn').classList.remove('recording');
                document.getElementById('pttRecordBtn').querySelector('.ptt-label').textContent = 'PTT';
            }
        }

        // مراقبة الرسائل الجديدة
        function listenNewMessages() {
            if (!currentUser) return;
            db.collection('chatMessages')
                .where('participants', 'array-contains', currentUser.uid)
                .orderBy('timestamp', 'desc')
                .limit(1)
                .onSnapshot(snap => {
                    snap.docChanges().forEach(change => {
                        if (change.type === 'added' && selectedFriendUid && change.doc.data()
                            .participants.includes(selectedFriendUid)) {
                            loadChatMessages();
                        }
                    });
                });
        }

        // ==================== الملف الشخصي ====================
        async function loadProfile() {
            if (!currentUser) return;
            const doc = await db.collection('users').doc(currentUser.uid).get();
            if (doc.exists) userProfile = doc.data();
            else { userProfile = { displayName: '', photoURL: '' };
                await db.collection('users').doc(currentUser.uid).set({ email: currentUser.email, displayName: '',
                    photoURL: '' }); }
        }

        function setupPresence() {
            if (!currentUser) return;
            const ref = rtdb.ref('presence/' + currentUser.uid);
            ref.set({ online: true, lastSeen: firebase.database.ServerValue.TIMESTAMP });
            ref.onDisconnect().set({ online: false, lastSeen: firebase.database.ServerValue.TIMESTAMP });
        }

        // ==================== مصادقة ====================
        async function login(email, pw) {
            const btn = document.getElementById('loginBtn'),
                errEl = document.getElementById('loginError');
            if (!email || !pw) { errEl.textContent = 'املأ الحقول';
                errEl.classList.add('show'); return; }
            btn.classList.add('loading');
            btn.textContent = '⏳...';
            errEl.classList.remove('show');
            try { await auth.signInWithEmailAndPassword(email.trim(), pw); } catch (e) { errEl.textContent = '⚠️ ' + (e
                    .message);
                errEl.classList.add('show'); } finally { btn.classList.remove('loading');
                btn.textContent = '🔐 دخول'; }
        }

        function logout() {
            if (confirm('تسجيل الخروج؟')) {
                auth.signOut();
                currentUser = null;
                guides = [];
                renderGuides();
                document.getElementById('loginScreen').classList.remove('hide');
                document.getElementById('signOutBtn').style.display = 'none';
            }
        }

        auth.onAuthStateChanged(async u => {
            if (u) {
                currentUser = u;
                document.getElementById('loginScreen').classList.add('hide');
                document.getElementById('signOutBtn').style.display = 'flex';
                document.getElementById('userInfo').innerHTML = `<strong>${u.email}</strong>`;
                await loadProfile();
                setupPresence();
                listenGuides();
                listenNewMessages();
            } else {
                currentUser = null;
                guides = [];
                renderGuides();
                document.getElementById('loginScreen').classList.remove('hide');
            }
        });

        // ==================== أحداث الواجهة ====================
        document.getElementById('loginBtn').onclick = () => login(document.getElementById('loginEmail').value, document
            .getElementById('loginPassword').value);
        document.getElementById('signOutBtn').onclick = logout;
        document.getElementById('menuBtn').onclick = () => { document.getElementById('sidebar').classList.add('open');
            document.getElementById('overlay').classList.add('show'); };
        document.getElementById('closeSidebar').onclick = () => { document.getElementById('sidebar').classList.remove(
            'open');
            document.getElementById('overlay').classList.remove('show'); };
        document.getElementById('overlay').onclick = () => { document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('show'); };
        document.getElementById('darkModeBtn').onclick = () => { document.body.classList.toggle('dark');
            localStorage.setItem('dark', document.body.classList.contains('dark') ? '1' : '0'); };
        if (localStorage.getItem('dark') === '1') document.body.classList.add('dark');
        document.getElementById('addBtn').onclick = () => { resetForm();
            document.getElementById('guideModal').classList.add('show'); };
        document.getElementById('searchInput').oninput = renderGuides;
        document.getElementById('filterToggle').onclick = () => document.getElementById('colorsPanel').classList.toggle(
            'show');
        document.getElementById('syncBtn').onclick = () => toast('🔄 تلقائية');
        document.getElementById('exportJsonBtn').onclick = () => { const a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([JSON.stringify(guides, null, 2)], { type: 'application/json' }));
            a.download = 'F-NotePro.json';
            a.click(); };
        document.getElementById('exportPdfBtn').onclick = () => { const el = document.createElement('div');
            el.dir = 'rtl';
            el.innerHTML = '<h1>F-Note Pro</h1>';
            guides.forEach(g => { el.innerHTML +=
                    `<p><b>${esc(g.name)}</b> - ${esc(g.phone)}</p>`; });
            html2pdf().from(el).set({ margin: 5, filename: 'F-NotePro.pdf' }).save(); };

        // أحداث الدردشة
        document.getElementById('sendTextBtn').onclick = sendTextMessage;
        document.getElementById('chatTextInput').addEventListener('keydown', e => { if (e.key === 'Enter')
            sendTextMessage(); });
        document.getElementById('attachImageBtn').onclick = () => {
            const inp = document.createElement('input');
            inp.type = 'file';
            inp.accept = 'image/*';
            inp.onchange = e => { if (e.target.files[0]) sendImageMessage(e.target.files[0]); };
            inp.click();
        };
        document.getElementById('sendLocationBtn').onclick = sendLocation;
        document.getElementById('pttRecordBtn').addEventListener('pointerdown', startPTT);
        document.getElementById('pttRecordBtn').addEventListener('pointerup', stopPTT);
        document.getElementById('pttRecordBtn').addEventListener('pointerleave', stopPTT);
        document.getElementById('refreshFriendsBtn').onclick = loadFriends;

        // التنقل بين الصفحات
        document.querySelectorAll('.nav-tab').forEach(tab => tab.addEventListener('click', () => {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(tab.dataset.page).classList.add('active');
            if (tab.dataset.page === 'pageRadio') { loadFriends();
                loadChatMessages(); }
        }));

        // فلتر الألوان
        const colorDots = ['#e94560', '#2c7da0', '#e76f51', '#2a9d8f', '#e9c46a', '#9b5de5', '#06d6a0', '#ff006e'];
        document.getElementById('colorsPanel').innerHTML =
            '<div class="color-dot active" data-color="all" style="background:conic-gradient(#e94560,#f59e0b,#10b981,#3b82f6,#9b5de5,#e94560);"></div>' +
            colorDots.map(c => `<div class="color-dot" data-color="${c}" style="background:${c};"></div>`).join('');
        document.querySelectorAll('.color-dot').forEach(d => d.onclick = () => {
            colorFilter = d.dataset.color;
            document.querySelectorAll('.color-dot').forEach(x => x.classList.remove('active'));
            d.classList.add('active');
            renderGuides();
            document.getElementById('colorsPanel').classList.remove('show');
        });

        // تنظيف دوري
        setInterval(() => { if (currentUser && selectedFriendUid) loadChatMessages(); }, 30000);
        console.log('🚀 F-Note Pro - نسخة الدردشة المتطورة جاهزة');
    </script>
</body>
</html>
